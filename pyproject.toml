[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sdmr"
version = "0.3.0.dev0"
description = "Sealed-holdout tuning and cross-taxon predictor discovery for presence-only plant SDMs."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "ZHANG RUIQI"}]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
test = ["pytest>=8"]
geo = ["rasterio>=1.3"]
parquet = ["pyarrow>=14"]
cloud = ["duckdb>=1.2", "pyarrow>=14"]

[project.scripts]
sdmr = "sdmr.cli:main"
sdmr-gbif-pilot = "sdmr.data_cli:main"
sdmr-gbif-snapshot = "sdmr.snapshot_cli:main"
sdmr-snapshot-pilot = "sdmr.snapshot_pilot_cli:main"
sdmr-chelsa = "sdmr.chelsa_cli:main"
sdmr-pilot = "sdmr.pilot_cli:main"
sdmr-spec-select = "sdmr.spec_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
