[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sdmr"
version = "0.3.0.dev0"
description = "Sealed-holdout tuning and cross-taxon predictor discovery for presence-only plant SDMs."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "ZHANG RUIQI"}]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
test = ["pytest>=8"]
geo = ["rasterio>=1.3"]
parquet = ["pyarrow>=14"]
cloud = ["duckdb>=1.2", "pyarrow>=14"]

[project.scripts]
sdmr = "sdmr.cli:main"
sdmr-gbif-pilot = "sdmr.data_cli:main"
sdmr-gbif-snapshot = "sdmr.snapshot_cli:main"
sdmr-gbif-target-footprint = "sdmr.target_footprint_cli:main"
sdmr-gbif-target-footprint-parallel = "sdmr.target_footprint_parallel_cli:main"
sdmr-snapshot-pilot = "sdmr.snapshot_pilot_cli:main"
sdmr-chelsa = "sdmr.chelsa_cli:main"
sdmr-pilot = "sdmr.pilot_cli:main"
sdmr-pilot-grid = "sdmr.pilot_grid_cli:main"
sdmr-prepared-benchmark = "sdmr.prepared_benchmark_cli:main"
sdmr-compare-evaluation = "sdmr.evaluation_contrast_cli:main"
sdmr-compare-continuous-boyce = "sdmr.cbi_contrast_cli:main"
sdmr-generalization-diagnostics = "sdmr.generalization_diagnostics_cli:main"
sdmr-assess-differentiation = "sdmr.differentiation_cli:main"
sdmr-spec-select = "sdmr.spec_cli:main"
sdmr-protocol-select = "sdmr.protocol_cli:main"
sdmr-protocol-stability = "sdmr.protocol_stability_cli:main"
sdmr-promote-protocol = "sdmr.promotion_cli:main"
sdmr-product-b = "sdmr.product_b_cli:main"
sdmr-universal-processes = "sdmr.universal_process_cli:main"
sdmr-promote-processes = "sdmr.process_promotion_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
