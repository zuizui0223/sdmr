name: FIA VA-WI conditional growth fixed two-phase one-shot v1

# Post-prior-outcome exploratory only, NOT independent sample replication.
# Source ZIP bytes may drift. Never automatically rerun this biological source.
on:
  push:
    branches: [research/geographic-driver-turnover-macro-v0-20261019]
    paths:
      - 'configs/fia_VA_WI_growth_first_open_once_v1.lock'

permissions:
  contents: read

jobs:
  frozen-new-source-and-conditional-growth:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require first-open frozen contract before any upstream GET
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          text=Path('configs/fia_VA_WI_growth_first_open_once_v1.lock').read_text()
          for k in ('programme=fia_VA_WI_new_source_two_phase_conditional_growth_v1',
                    'primary_species=129_316_802_833_837',
                    'study_regions=VA_WI',
                    'prior_source_contract_run=43883371062',
                    'first_open_two_phase=true',
                    'new_FIA_version_not_independent_tree_sample=true',
                    'source_stage_must_pass_before_DIA_STATUSCD=true',
                    'no_automatic_retry=true',
                    'RI_biological_response_open=false',
                    'biological_niche_adaptation_claim=forbidden'):
              assert k in text,k
          config=json.loads(Path('configs/fia_VA_WI_shared_regional_growth_v1.json').read_text())
          assert config['primary_five_species']==['129','316','802','833','837']
          assert config['no_automatic_rerun_after_failure'] is True
          PY
      - name: Install numerical and validation libraries only
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2,<4' 'pytest>=8,<10'
      - name: Require synthetic false-attribution and no-source STOP tests to pass
        run: |
          python -m pytest -q \
            tests/test_fia_shared_vs_regional_growth_core_v1.py \
            tests/test_fia_VA_WI_new_source_growth_v1.py
      - name: Freeze source receipts then open only linked survivor growth if allowed
        run: |
          python experiments/fia_VA_WI_new_source_growth_v1.py \
            --noaa-csv results/fia_noaa_county_climate_v1/noaa_county_growing_months_1991_2025.csv \
            --noaa-receipt results/fia_noaa_county_climate_v1/source_receipt.json \
            --support-config configs/fia_joint_climate_support_gate_v1.json \
            --science-config configs/fia_VA_WI_shared_regional_growth_v1.json \
            --outdir artifacts/fia_VA_WI_growth_first_open_v1
      - name: Record exact final denominator and model claim boundary
        if: success()
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('artifacts/fia_VA_WI_growth_first_open_v1')
          r=json.loads((root/'VA_WI_growth_result_v1.json').read_text())
          s=json.loads((root/'source_phase_receipt.json').read_text())
          assert s['n_source_states_ready']==2
          assert s['complete_primary_25_source_folds_before_response']
          assert r['n_declared_species']==13
          assert r['external_RI_growth_opened'] is False
          assert r['n_primary_complete']<=5
          assert r['does_not_test_survival_or_population_mortality']
          assert r['biological_promotion_authorized'] is False
          assert r['product_B_remains_blocked'] is True
          print('source first-open:',s['source_rows_after_county_QC'],
                'primary response complete:',r['n_primary_complete'],'/5')
          PY
      - name: Archive source, nonavailability and biological response exactly once
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fia-VA-WI-growth-first-open-v1
          path: artifacts/fia_VA_WI_growth_first_open_v1/
          if-no-files-found: warn
          retention-days: 90
