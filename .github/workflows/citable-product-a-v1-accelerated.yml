name: citable-product-a-v1-accelerated

on:
  push:
    branches:
      - agent/nested-spatial-raster-benchmark
    paths:
      - '.github/workflows/citable-product-a-v1-accelerated.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: citable-product-a-v1-accelerated
  cancel-in-progress: true

jobs:
  product-a-v1-accelerated:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SCIENTIFIC_SOURCE_SHA: bdabeff06c1be26006837d978e8beffc0584faac
      EXECUTION_ENGINE_SHA: 9d3c9411a717a3b352b86b6cc6f3298f75ac1d17
      PERFORMANCE_EQUIVALENCE_RUN_ID: '31869105326'
      SDMR_BENCHMARK_JOBS: '4'
      SDMR_MODEL_SPEC_JOBS: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      SEED: '20260814'
      SPATIAL_TEST_FRACTION: '0.20'
      TAXON_VALIDATION_FRACTION: '0.25'
    steps:
      - name: Checkout execution engine
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXECUTION_ENGINE_SHA }}
          path: engine
      - name: Checkout frozen scientific source/governance
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SCIENTIFIC_SOURCE_SHA }}
          path: governance
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install exact-semantics accelerated engine
        working-directory: engine
        run: python -m pip install -e '.[geo,parquet]'
      - name: Verify execution engine equivalence run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json, os
          from urllib.request import Request, urlopen
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['PERFORMANCE_EQUIVALENCE_RUN_ID']}"
          req = Request(url, headers={'Authorization': f"Bearer {os.environ['GH_TOKEN']}", 'Accept':'application/vnd.github+json'})
          with urlopen(req, timeout=60) as response:
              run = json.load(response)
          if run.get('status') != 'completed' or run.get('conclusion') != 'success':
              raise SystemExit('performance equivalence run is not successful')
          if str(run.get('head_sha')) != os.environ['EXECUTION_ENGINE_SHA']:
              raise SystemExit('performance equivalence run tested a different engine SHA')
          print('exact_semantics_engine_verified', os.environ['EXECUTION_ENGINE_SHA'])
          PY
      - name: Bind frozen focal/target source contracts
        id: sources
        run: |
          python - <<'PY'
          import csv, os
          from pathlib import Path
          def one(path):
              rows = list(csv.DictReader(Path(path).open(encoding='utf-8')))
              if len(rows) != 1: raise SystemExit(f'{path} must contain one row')
              return rows[0]
          focal = one('governance/configs/product_a_v1_focal_cache.csv')
          target = one('governance/configs/product_a_v1_target_cache.csv')
          snapshot = one('governance/configs/gbif_snapshot_v1.csv')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              out.write(f"focal_run={focal['source_run_id']}\n")
              out.write(f"focal_artifact={focal['artifact_name']}\n")
              out.write(f"target_run={target['source_run_id']}\n")
              out.write(f"target_artifact={target['artifact_name']}\n")
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as env:
              env.write(f"FOCAL_SHA={focal['focal_sha256'].strip().lower()}\n")
              env.write(f"FOCAL_QUERY_SHA={focal['focal_query_sha256'].strip().lower()}\n")
              env.write(f"TARGET_SHA={target['target_sha256'].strip().lower()}\n")
              env.write(f"TARGET_QUERY_SHA={target['target_query_sha256'].strip().lower()}\n")
              env.write(f"SNAPSHOT_DATE={snapshot['snapshot_date'].strip()}\n")
              env.write(f"SNAPSHOT_DOI={snapshot['snapshot_doi'].strip()}\n")
              env.write(f"CITATION_SHA={snapshot['citation_sha256'].strip().lower()}\n")
          PY
      - name: Preflight all frozen 43 CHELSA predictors
        run: |
          sdmr-chelsa \
            --manifest governance/configs/chelsa_v2_1_plant_candidates.csv \
            --output-dir citable_preflight \
            --probe \
            --require-probe-success
      - name: Download frozen focal source
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.sources.outputs.focal_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ steps.sources.outputs.focal_artifact }}
          path: focal_bundle
      - name: Download frozen non-focal target source
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.sources.outputs.target_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ steps.sources.outputs.target_artifact }}
          path: target_bundle
      - name: Verify exact source files
        run: |
          mkdir -p citable_input citable_result
          cp focal_bundle/citable_input/focal.parquet citable_input/focal.parquet
          cp focal_bundle/citable_input/focal.provenance.csv citable_input/focal.provenance.csv
          cp focal_bundle/citable_input/focal.parquet.citation.txt citable_input/focal.parquet.citation.txt
          cp target_bundle/target_group.parquet citable_input/target_group.parquet
          cp target_bundle/target_group.provenance.csv citable_input/target_group.provenance.csv
          cp target_bundle/target_group.parquet.citation.txt citable_input/target_group.parquet.citation.txt
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          import pandas as pd
          for path,key in [('citable_input/focal.parquet','FOCAL_SHA'),('citable_input/target_group.parquet','TARGET_SHA')]:
              actual=hashlib.sha256(Path(path).read_bytes()).hexdigest()
              if actual != os.environ[key]: raise SystemExit(f'{path} SHA mismatch: {actual}')
          f=pd.read_csv('citable_input/focal.provenance.csv').iloc[0]
          t=pd.read_csv('citable_input/target_group.provenance.csv').iloc[0]
          if str(f.get('query_sha256','')).lower()!=os.environ['FOCAL_QUERY_SHA']: raise SystemExit('focal query SHA mismatch')
          if str(t.get('query_sha256','')).lower()!=os.environ['TARGET_QUERY_SHA']: raise SystemExit('target query SHA mismatch')
          for p in ['citable_input/focal.parquet.citation.txt','citable_input/target_group.parquet.citation.txt']:
              if hashlib.sha256(Path(p).read_bytes()).hexdigest()!=os.environ['CITATION_SHA']: raise SystemExit(f'citation mismatch: {p}')
          if str(t.get('focal_taxa_excluded_pre_split','')).lower() not in {'true','1'}: raise SystemExit('target source lacks pre-split focal-taxon exclusion')
          if int(t.get('excluded_taxa_count',0) or 0)!=12: raise SystemExit('target excluded-taxon count !=12')
          print('frozen_source_verified')
          PY
      - name: Run accelerated strict M-robust Product-A benchmark
        run: |
          sdmr-pilot-grid \
            --gbif-download citable_input/focal.parquet \
            --gbif-download-key 'accelerated-citable-fixed-source-2026-08-01' \
            --target-group-download citable_input/target_group.parquet \
            --target-group-download-key 'accelerated-citable-fixed-source-2026-08-01' \
            --checklist-key 'snapshot-interpreted:2026-08-01' \
            --taxa governance/configs/product_a_pilot_taxa_v1.csv \
            --grid governance/configs/product_a_buffer_specs_v1.csv \
            --manifest governance/configs/chelsa_v2_1_plant_candidates.csv \
            --output-dir citable_result \
            --m-grid-as-sensitivity \
            --min-occurrences 80 \
            --min-unique-cells 50 \
            --gate-cell-size-degrees 0.05 \
            --spatial-test-fraction "$SPATIAL_TEST_FRACTION" \
            --taxon-validation-fraction "$TAXON_VALIDATION_FRACTION" \
            --vif-threshold 5 \
            --max-predictors 8 \
            --random-baseline-repeats 0 \
            --seed "$SEED"
      - name: Compare SDMR with conventional AUC/Boyce selectors
        run: |
          sdmr-compare-evaluation \
            --product-a-dir citable_result \
            --manifest governance/configs/chelsa_v2_1_plant_candidates.csv \
            --canonical-specification buffer_300km
      - name: Enforce frozen scientific information barrier
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          import pandas as pd
          expected=set(pd.read_csv('governance/configs/product_a_pilot_taxa_v1.csv')['scientific_name'].astype(str))
          gate=pd.read_csv('citable_result/species_gate.csv')
          eligible=set(gate.loc[gate['eligible'].astype(bool),'species'].astype(str))
          if eligible!=expected: raise SystemExit(f'full panel failed: missing={sorted(expected-eligible)}')
          spec=json.loads(Path('citable_result/pilot_grid_specification.json').read_text())
          contrast=json.loads(Path('citable_result/selector_contrast_contract.json').read_text())
          if spec.get('outer_sealed_before_M') is not True or spec.get('m_grid_as_sensitivity') is not True: raise SystemExit('strict M semantics failed')
          if contrast.get('cross_taxon_selection_data')!='discovery_taxa_only': raise SystemExit('cross-taxon selection leak')
          if contrast.get('local_nested_auc_selection_data')!='validation_species_model_pool_only': raise SystemExit('local nested AUC leak')
          if contrast.get('outer_sealed_used_for_selection') is not False: raise SystemExit('outer sealed selection leak')
          print('accelerated_citable_barrier_passed')
          PY
      - name: Freeze accelerated citable contract
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          import pandas as pd
          def sha(path): return hashlib.sha256(Path(path).read_bytes()).hexdigest() if Path(path).exists() else ''
          spec_path=Path('citable_result/pilot_grid_specification.json')
          spec=json.loads(spec_path.read_text()) if spec_path.exists() else {}
          contrast_path=Path('citable_result/selector_contrast_contract.json')
          contrast=json.loads(contrast_path.read_text()) if contrast_path.exists() else {}
          probe=pd.read_csv('citable_preflight/chelsa_raster_probe.csv') if Path('citable_preflight/chelsa_raster_probe.csv').exists() else pd.DataFrame()
          contract={
            'protocol_version':'product_a_v1_leakage_safe_M_sensitivity_fixed_sources_accelerated_exact_semantics',
            'scientific_source_sha':os.environ['SCIENTIFIC_SOURCE_SHA'],
            'execution_engine_sha':os.environ['EXECUTION_ENGINE_SHA'],
            'performance_equivalence_run_id':os.environ['PERFORMANCE_EQUIVALENCE_RUN_ID'],
            'exact_semantics_equivalence':True,
            'snapshot_date':os.environ.get('SNAPSHOT_DATE'),
            'snapshot_doi':os.environ.get('SNAPSHOT_DOI'),
            'focal_subset_sha256':os.environ.get('FOCAL_SHA'),
            'focal_query_sha256':os.environ.get('FOCAL_QUERY_SHA'),
            'target_subset_sha256':os.environ.get('TARGET_SHA'),
            'target_query_sha256':os.environ.get('TARGET_QUERY_SHA'),
            'seed':int(os.environ['SEED']),
            'spatial_test_fraction':float(os.environ['SPATIAL_TEST_FRACTION']),
            'taxon_validation_fraction':float(os.environ['TAXON_VALIDATION_FRACTION']),
            'outer_sealed_before_M':bool(spec.get('outer_sealed_before_M',False)),
            'm_grid_as_sensitivity':bool(spec.get('m_grid_as_sensitivity',False)),
            'chelsa_probe_failures':int(probe['status'].ne('ok').sum()) if 'status' in probe else None,
            'promotion_criteria_sha256':sha('governance/configs/product_a_promotion_criteria_v1.csv'),
            'differentiation_criteria_sha256':sha('governance/configs/product_a_differentiation_criteria_v1.csv'),
            'selector_contrast_outer_sealed_used_for_selection':contrast.get('outer_sealed_used_for_selection'),
            'performance_only_changes':['SDMR_BENCHMARK_JOBS=4','random_baseline_repeats=0'],
          }
          Path('citable_result/citable_snapshot_contract.json').write_text(json.dumps(contract,indent=2,sort_keys=True),encoding='utf-8')
          PY
          cp governance/configs/product_a_promotion_criteria_v1.csv citable_result/
          cp governance/configs/product_a_differentiation_criteria_v1.csv citable_result/
          cat > citable_result/ACCELERATED_CITABLE_BOUNDARY.txt <<'EOF'
          Exact-semantics accelerated rerun of the frozen Product-A v1 scientific protocol. Scientific source
          configuration/criteria come from bdabeff06c1be26006837d978e8beffc0584faac. Execution changes are
          performance-only and covered by the declared successful equivalence run. This artifact is not a new
          scientific protocol and may be compared directly with the original sequential citable run.
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: citable-product-a-v1-accelerated-2026-08-01
          path: |
            citable_preflight/
            citable_input/
            citable_result/
          if-no-files-found: error
          retention-days: 90
