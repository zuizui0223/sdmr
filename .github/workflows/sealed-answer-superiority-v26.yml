name: sealed-answer-superiority-v26

on:
  pull_request:
    branches:
      - development/relative-attribution-v22
    paths:
      - 'src/sdmr/sealed_answer_superiority_v26.py'
      - 'tests/test_sealed_answer_superiority_v26.py'
      - 'docs/SEALED_ANSWER_SUPERIORITY_V26_CONTRACT.md'
      - 'docs/superpowers/plans/2026-09-16-sealed-answer-superiority-v26.md'
      - '.github/workflows/sealed-answer-superiority-v26.yml'
  workflow_dispatch:

jobs:
  focused-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e . pytest
      - run: pytest -q tests/test_sealed_answer_superiority_v26.py
