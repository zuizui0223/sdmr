name: product-b-v3-formal-unblock

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  unblock:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - name: Validate pre-outcome Product-B v3 unblock contract
        run: |
          pytest -q tests/test_product_b_v3_formal_unblock.py
          python - <<'PY'
          from sdmr.product_b_v3_formal_unblock import load_product_b_v3_unblock_contract
          c=load_product_b_v3_unblock_contract('configs/product_b_v3_formal_unblock_contract.json')
          assert c['contract_frozen_before_product_a_continuation_sealed_outcome'] is True
          assert c['contract_frozen_before_product_b_v3_known_truth_outcome'] is True
          assert c['new_postoutcome_scientific_thresholds'] is False
          PY
      - name: Locate exact frozen Product-A promotion and Product-B v3 decision sources
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          from sdmr.product_b_v3_formal_unblock import load_product_b_v3_unblock_contract
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']; api=f'https://api.github.com/repos/{repo}'
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'sdmr-product-b-v3-unblock'}
          c=load_product_b_v3_unblock_contract('configs/product_b_v3_formal_unblock_contract.json')
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=60) as r:
                  return json.loads(r.read())
          def exact_run(source):
              p=get(f"{api}/actions/workflows/{source['workflow_file']}/runs?event=workflow_dispatch&per_page=100")
              runs=[r for r in p.get('workflow_runs',[]) if str(r.get('head_sha'))==source['implementation_sha'] and str(r.get('head_branch'))==source['frozen_ref'] and str(r.get('event'))=='workflow_dispatch']
              if len(runs)!=1: raise SystemExit(f"expected exactly one run for {source['workflow_file']}, found {len(runs)}")
              run=runs[0]
              if run.get('status')!='completed' or run.get('conclusion')!='success':
                  raise SystemExit(f"source run not successful: {source['workflow_file']} {run.get('status')}/{run.get('conclusion')}")
              arts=get(f"{api}/actions/runs/{run['id']}/artifacts?per_page=100").get('artifacts',[])
              found=[a for a in arts if a.get('name')==source['artifact_name'] and not a.get('expired')]
              if len(found)!=1: raise SystemExit(f"expected one artifact {source['artifact_name']}, found {len(found)}")
              return run, found[0]
          a_run,a_art=exact_run(c['product_a_promotion_source'])
          b_run,b_art=exact_run(c['product_b_v3_known_truth_source'])
          Path('source_ids.json').write_text(json.dumps({
              'product_a_run_id':int(a_run['id']),
              'product_a_artifact_id':int(a_art['id']),
              'product_a_artifact_digest':a_art.get('digest'),
              'product_b_run_id':int(b_run['id']),
              'product_b_artifact_id':int(b_art['id']),
              'product_b_artifact_digest':b_art.get('digest'),
          },indent=2,sort_keys=True)+'\n')
          PY
      - name: Download exact frozen source artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p sources/a sources/b
          A_RUN=$(python -c "import json;print(json.load(open('source_ids.json'))['product_a_run_id'])")
          B_RUN=$(python -c "import json;print(json.load(open('source_ids.json'))['product_b_run_id'])")
          gh run download "$A_RUN" --repo "$GITHUB_REPOSITORY" --name product-a-v2-6-continuation-promotion-decision --dir sources/a
          gh run download "$B_RUN" --repo "$GITHUB_REPOSITORY" --name product-b-v3-fresh-known-truth-decision --dir sources/b
      - name: Apply frozen formal-unblock logic only
        run: |
          python -m sdmr.product_b_v3_formal_unblock \
            --contract configs/product_b_v3_formal_unblock_contract.json \
            --product-a-promotion-dir sources/a \
            --product-b-known-truth-dir sources/b \
            --output-dir unblock
          cp source_ids.json unblock/
          cat unblock/decision.csv
          cat unblock/contract.json
      - uses: actions/upload-artifact@v4
        with:
          name: product-b-v3-formal-unblock-decision
          path: unblock/
          retention-days: 90
