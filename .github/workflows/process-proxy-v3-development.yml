name: process-proxy-v3-development

on:
  pull_request:
    paths:
      - 'src/sdmr/process_proxy_audit.py'
      - 'src/sdmr/process_proxy_audit_development.py'
      - 'configs/process_challenge_v3_development.json'
      - 'tests/test_process_proxy_audit.py'
      - '.github/workflows/process-proxy-v3-development.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  VECLIB_MAXIMUM_THREADS: '1'
  BLIS_NUM_THREADS: '1'

jobs:
  predictor-only-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package
        run: python -m pip install -e '.[test]'
      - name: Verify proxy audit tests
        run: pytest -q tests/test_process_proxy_audit.py tests/test_process_challenge_v3_development_contract.py
      - name: Run predictor-only audit
        run: python -m sdmr.process_proxy_audit_development --output-dir proxy-audit
      - name: Show strongest residual reconstructability
        run: |
          cat proxy-audit/proxy_audit_decision.json
          head -n 20 proxy-audit/process_reconstructability_summary.csv
          head -n 40 proxy-audit/proxy_candidate_summary.csv
      - name: Upload predictor-only audit
        uses: actions/upload-artifact@v4
        with:
          name: process-proxy-v3-development-only
          path: proxy-audit/
          retention-days: 30
          if-no-files-found: error
