name: product-a-v1-target-cache-parallel

on:
  push:
    branches:
      - agent/nested-spatial-raster-benchmark
    paths:
      - 'configs/product_a_v1_target_parallel_trigger.txt'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: product-a-v1-target-cache-parallel
  cancel-in-progress: true

jobs:
  chunk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        chunk: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install cloud dependencies
        run: python -m pip install -e '.[cloud,parquet]'
      - name: Materialize exact shard-chunk cell minima
        run: |
          mkdir -p chunk_output
          sdmr-gbif-target-footprint-parallel chunk \
            --snapshot-date 2026-08-01 \
            --region us-east-1 \
            --exclude-taxa configs/product_a_pilot_taxa_v1.csv \
            --grid-cell-degrees 0.05 \
            --chunk-index '${{ matrix.chunk }}' \
            --chunk-count 8 \
            --output chunk_output/partial.parquet \
            --metadata chunk_output/partial.metadata.json
      - name: Upload exact chunk minimum artifact
        uses: actions/upload-artifact@v4
        with:
          name: product-a-target-chunk-${{ matrix.chunk }}
          path: chunk_output/
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: chunk
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install cloud dependencies
        run: python -m pip install -e '.[cloud,parquet]'
      - name: Download all exact chunk minima
        uses: actions/download-artifact@v4
        with:
          pattern: product-a-target-chunk-*
          path: target_parts
      - name: Reduce chunk minima to exact global non-focal footprint
        run: |
          mkdir -p target_cache
          sdmr-gbif-target-footprint-parallel aggregate \
            --parts-root target_parts \
            --snapshot-doi 10.15468/dl.fs3btq \
            --output target_cache/target_group.parquet \
            --provenance target_cache/target_group.provenance.csv
      - name: Verify final target evidence and write manifest
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          import pandas as pd

          target = Path('target_cache/target_group.parquet')
          provenance = pd.read_csv('target_cache/target_group.provenance.csv').iloc[0].to_dict()
          citation = Path('target_cache/target_group.parquet.citation.txt')
          taxa = Path('configs/product_a_pilot_taxa_v1.csv')
          target_sha = hashlib.sha256(target.read_bytes()).hexdigest()
          citation_sha = hashlib.sha256(citation.read_bytes()).hexdigest()
          taxa_sha = hashlib.sha256(taxa.read_bytes()).hexdigest()

          if target_sha != str(provenance.get('sha256','')).lower():
              raise SystemExit('parallel target file/provenance SHA mismatch')
          if citation_sha != '022a524b59c4c037b28f252c08294e0f22c5eb7b3bce5c52a0a5fc6016f17050':
              raise SystemExit('parallel target citation SHA mismatch')
          if str(provenance.get('snapshot_doi','')).lower() != '10.15468/dl.fs3btq':
              raise SystemExit('parallel target DOI mismatch')
          if str(provenance.get('sampling_mode','')) != 'global_nonfocal_one_per_grid_cell_sampling_footprint':
              raise SystemExit('parallel target sampling mode mismatch')
          if int(provenance.get('excluded_taxa_count',0)) != 12:
              raise SystemExit('parallel target did not exclude all 12 focal taxa')
          if str(provenance.get('excluded_taxa_sha256','')).lower() != taxa_sha:
              raise SystemExit('parallel target taxon-exclusion SHA mismatch')
          if int(provenance.get('snapshot_shard_count',0)) != 9705:
              raise SystemExit('parallel target did not cover the verified 9705-shard snapshot')
          if int(provenance.get('parallel_chunk_count',0)) != 8:
              raise SystemExit('parallel target did not use the frozen 8-chunk reduction')

          frame = pd.read_parquet(target, columns=['species'])
          manifest = {
              'protocol_source': 'product_a_v1_global_nonfocal_target_group_footprint_parallel_exact',
              'snapshot_date': '2026-08-01',
              'snapshot_doi': '10.15468/dl.fs3btq',
              'citation_sha256': citation_sha,
              'target_sha256': target_sha,
              'target_query_sha256': str(provenance.get('query_sha256','')),
              'target_rows': int(len(frame)),
              'target_species': int(frame['species'].nunique()),
              'sampling_mode': str(provenance.get('sampling_mode','')),
              'one_per_grid_cell_degrees': float(provenance.get('one_per_grid_cell_degrees')),
              'source_independent_of_focal_occurrence_geography': True,
              'focal_taxa_excluded_pre_split': True,
              'excluded_taxa_count': int(provenance.get('excluded_taxa_count')),
              'excluded_taxa_sha256': str(provenance.get('excluded_taxa_sha256','')),
              'snapshot_shard_count': int(provenance.get('snapshot_shard_count')),
              'snapshot_shard_catalog_sha256': str(provenance.get('snapshot_shard_catalog_sha256','')),
              'parallel_chunk_count': int(provenance.get('parallel_chunk_count')),
              'parallel_reduction': str(provenance.get('parallel_reduction','')),
              'cloud_provider': str(provenance.get('cloud_provider','')),
              'http_keep_alive': provenance.get('http_keep_alive'),
              'http_retries': provenance.get('http_retries'),
              'http_retry_wait_ms': provenance.get('http_retry_wait_ms'),
              'http_retry_backoff': provenance.get('http_retry_backoff'),
              'http_timeout': provenance.get('http_timeout'),
          }
          Path('target_cache/target_cache_manifest.json').write_text(json.dumps(manifest, indent=2, sort_keys=True), encoding='utf-8')
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY
      - name: Upload exact parallel target cache
        uses: actions/upload-artifact@v4
        with:
          name: product-a-v1-target-cache-parallel-2026-08-01
          path: target_cache/
          if-no-files-found: error
          retention-days: 90
