name: product-b-v2-2-known-truth-recovery-launch

on:
  push:
    branches: [main]
    paths:
      - 'configs/product_b_v2_2_known_truth_recovery_trigger.txt'

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exactly one frozen Product-B v2.2 recovery run and record receipt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, time, urllib.error, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']
          workflow='product-b-v2-2-known-truth-recovery.yml'
          frozen_ref='frozen/product-b-v2-2-recovery-daaf207d'
          implementation_sha='daaf207d1574befbc703ace02a82971d4980a865'
          api=f'https://api.github.com/repos/{repo}'
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'sdmr-product-b-v22-recovery-launcher'}
          def request(url,*,method='GET',payload=None,allow_404=False):
              data=None if payload is None else json.dumps(payload).encode()
              req=urllib.request.Request(url,data=data,headers=headers,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=60) as r:
                      raw=r.read(); return json.loads(raw) if raw else None
              except urllib.error.HTTPError as exc:
                  if allow_404 and exc.code==404: return None
                  raise
          def matching_runs():
              payload=request(f'{api}/actions/workflows/{workflow}/runs?event=workflow_dispatch&per_page=100')
              return [run for run in payload.get('workflow_runs',[])
                      if str(run.get('head_sha'))==implementation_sha
                      and str(run.get('head_branch'))==frozen_ref
                      and str(run.get('event'))=='workflow_dispatch']
          runs=matching_runs(); dispatched_now=False
          if len(runs)>1:
              raise SystemExit(f'multiple recovery runs already exist: {len(runs)}')
          if not runs:
              request(f'{api}/actions/workflows/{workflow}/dispatches',method='POST',payload={'ref':frozen_ref})
              dispatched_now=True
              for _ in range(24):
                  time.sleep(5); runs=matching_runs()
                  if runs: break
          if len(runs)!=1:
              raise SystemExit(f'expected one frozen recovery run, found {len(runs)}')
          run=runs[0]
          receipt={
              'purpose':'product_b_v2_2_known_truth_recovery_launch_receipt',
              'launcher_trigger_sha':os.environ['GITHUB_SHA'],'dispatched_now':dispatched_now,
              'run_id':int(run['id']),'run_number':int(run['run_number']),
              'status':str(run['status']),'conclusion':run.get('conclusion'),
              'created_at':str(run['created_at']),'head_sha':str(run['head_sha']),
              'head_branch':str(run['head_branch']),'frozen_ref':frozen_ref,
              'implementation_sha':implementation_sha,'html_url':str(run['html_url']),
              'workflow_name':str(run['name']),
              'predecessor_run_id':32422606768,
              'predecessor_fresh_taxa_generated':False,
              'predecessor_generating_truth_opened':False,
          }
          path='configs/product_b_v2_2_known_truth_recovery_launch_receipt.json'
          existing=request(f'{api}/contents/{path}?ref=main',allow_404=True)
          payload={'message':f'Record Product-B v2.2 recovery run {run["id"]}','content':base64.b64encode((json.dumps(receipt,indent=2,sort_keys=True)+'\n').encode()).decode(),'branch':'main'}
          if existing: payload['sha']=existing['sha']
          request(f'{api}/contents/{path}',method='PUT',payload=payload)
          print(json.dumps(receipt,indent=2,sort_keys=True))
          PY
