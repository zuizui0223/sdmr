name: sdmr-v6-prospective-kt-v2

on:
  push:
    branches:
      - 'design/sdmr-v3-process-identification'
    paths:
      - 'configs/sdmr_v6_prospective_kt_v2_execute.json'

permissions:
  contents: read

concurrency:
  group: sdmr-v6-prospective-kt-v2
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Validate blocked prospective v2 machinery
        run: |
          pytest -q \
            tests/test_process_id_v6_prospective_v2_execution.py \
            tests/test_process_id_scoped_pipeline_v6.py
          python -m py_compile \
            scripts/run_sdmr_v6_prospective_kt_v2_shard.py \
            scripts/aggregate_sdmr_v6_prospective_kt_v2.py
      - name: Verify prospective v2 activation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("configs/sdmr_v6_prospective_kt_v2_execute.json").read_text())
          assert x["purpose"]=="execute_sdmr_v6_prospective_known_truth_v2"
          assert x["single_activation"] is True
          for key in ("validation_prerequisite","confirmation_prerequisite","integration_prerequisite"):
              assert x[key]["terminal_passed"] is True
              assert str(x[key]["artifact_digest"]).startswith("sha256:")
          assert x["prospective_outcomes_opened_before_activation"] is False
          assert x["fresh_empirical_opened"] is False
          PY

  prospective:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        world:
          - unique_process
          - redundant_representation
          - shared_carrier
          - null_correlated
          - interaction
          - observation_confounded
          - omitted_driver
          - geographic_shift
        seed_block: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install -e '.[test]'
      - name: Run prospective v2 shard
        run: |
          python scripts/run_sdmr_v6_prospective_kt_v2_shard.py \
            --scientific-contract configs/sdmr_v6_prospective_kt_v2.json \
            --execution-profile configs/sdmr_v6_prospective_kt_v2_execution.json \
            --activation configs/sdmr_v6_prospective_kt_v2_execute.json \
            --world ${{ matrix.world }} \
            --seed-block ${{ matrix.seed_block }} \
            --outdir prospective-output
      - name: Upload prospective v2 shard
        uses: actions/upload-artifact@v4
        with:
          name: v6-prospective-v2-${{ matrix.world }}-block${{ matrix.seed_block }}
          path: prospective-output/
          if-no-files-found: error

  aggregate:
    needs: prospective
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install -e '.[test]'
      - name: Download prospective v2 shards
        uses: actions/download-artifact@v4
        with:
          pattern: 'v6-prospective-v2-*'
          path: prospective-shards
      - name: Aggregate prospective v2 evidence
        run: |
          python scripts/aggregate_sdmr_v6_prospective_kt_v2.py \
            --input-root prospective-shards \
            --scientific-contract configs/sdmr_v6_prospective_kt_v2.json \
            --execution-profile configs/sdmr_v6_prospective_kt_v2_execution.json \
            --activation configs/sdmr_v6_prospective_kt_v2_execute.json \
            --outdir prospective-aggregate \
            --expected-shards 32
      - name: Upload prospective v2 terminal evidence
        uses: actions/upload-artifact@v4
        with:
          name: sdmr-v6-prospective-kt-v2
          path: prospective-aggregate/
          if-no-files-found: error
