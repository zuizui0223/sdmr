name: fia-stand-context-archive-v1
on:
  pull_request:
    paths:
      - 'evidence/fia_new_source_stand_context_v1/aggregate.json'
      - 'experiments/fia_stand_context_synthesis_v1.py'
      - 'tests/test_fia_stand_context_synthesis_v1.py'
      - 'results/fia_new_source_stand_context_synthesis_v1.json'
      - '.github/workflows/fia-stand-context-archive-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify immutable source hash, denoms and cell means
        run: python -m pip install pytest && python -m pytest -q tests/test_fia_stand_context_synthesis_v1.py
      - name: Recompute source-pinned exploratory descriptive results
        run: |
          python experiments/fia_stand_context_synthesis_v1.py \
            --input evidence/fia_new_source_stand_context_v1/aggregate.json \
            --output artifacts/fia_new_source_stand_context_synthesis_v1.json
      - name: Preserve recomputation
        uses: actions/upload-artifact@v4
        with:
          name: fia-stand-context-synthesis-v1
          path: artifacts/fia_new_source_stand_context_synthesis_v1.json
          if-no-files-found: error
