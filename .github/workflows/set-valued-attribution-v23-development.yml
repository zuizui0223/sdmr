name: set-valued-attribution-v23-development

on:
  pull_request:
    paths:
      - 'src/sdmr/set_valued_attribution_v23.py'
      - 'configs/set_valued_attribution_v23_development.json'
      - 'tests/test_set_valued_attribution_v23.py'
      - '.github/workflows/set-valued-attribution-v23-development.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e . pytest
      - run: pytest -q tests/test_set_valued_attribution_v23.py
