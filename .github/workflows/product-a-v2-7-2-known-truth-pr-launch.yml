name: product-a-v2-7-2-known-truth-pr-launch

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'configs/product_a_v2_7_2_known_truth_pr_trigger.txt'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Dispatch exactly one frozen v2.7.2 known-truth run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.parse, urllib.request
          from pathlib import Path

          c=json.load(open('configs/product_a_v2_7_2_known_truth_execution_contract.json'))
          if c.get('purpose')!='product_a_v2_7_2_known_truth_execution_contract':
              raise SystemExit('wrong v2.7.2 execution contract')
          if c.get('execution_identity_frozen_before_known_truth_outcome') is not True:
              raise SystemExit('v2.7.2 execution identity was not frozen before outcome')
          if c.get('requires_single_workflow_dispatch_run_for_frozen_identity') is not True:
              raise SystemExit('v2.7.2 known-truth execution is not one-shot')
          scope=c.get('scope',{})
          if scope.get('empirical_sealed_environment_read_allowed') is not False:
              raise SystemExit('v2.7.2 known truth may not open empirical sealed environments')
          if scope.get('current_v2_7_1_fresh_sealed_rows_read_allowed') is not False:
              raise SystemExit('v2.7.2 known truth may not consume v2.7.1 sealed rows')
          if scope.get('post_outcome_threshold_change_allowed') is not False:
              raise SystemExit('v2.7.2 thresholds are not frozen')
          if scope.get('post_outcome_random_seed_change_allowed') is not False:
              raise SystemExit('v2.7.2 random seeds are not frozen')

          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']
          api=f'https://api.github.com/repos/{repo}'
          headers={
              'Authorization':f'Bearer {token}',
              'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28',
              'User-Agent':'sdmr-v272-known-truth-launcher',
          }
          def request(url,*,method='GET',payload=None):
              data=None if payload is None else json.dumps(payload).encode()
              req=urllib.request.Request(url,data=data,headers=headers,method=method)
              with urllib.request.urlopen(req,timeout=60) as r:
                  raw=r.read(); return json.loads(raw) if raw else None

          contract_path=urllib.parse.quote(c['scientific_contract_path'], safe='/')
          contract_url=(
              f"{api}/contents/{contract_path}?ref="
              f"{urllib.parse.quote(c['frozen_ref'], safe='')}"
          )
          scientific=request(contract_url)
          if scientific.get('sha')!=c['scientific_contract_blob_sha']:
              raise SystemExit('frozen v2.7.2 scientific contract identity changed')

          def matches():
              p=request(
                  f"{api}/actions/workflows/{c['workflow_file']}/runs?"
                  "event=workflow_dispatch&per_page=100"
              )
              return [
                  r for r in p.get('workflow_runs',[])
                  if str(r.get('head_sha'))==c['implementation_sha']
                  and str(r.get('head_branch'))==c['frozen_ref']
                  and str(r.get('event'))=='workflow_dispatch'
              ]

          runs=matches(); dispatched=False
          if len(runs)>1:
              raise SystemExit(f"multiple frozen v2.7.2 known-truth runs exist: {len(runs)}")
          if not runs:
              request(
                  f"{api}/actions/workflows/{c['workflow_file']}/dispatches",
                  method='POST', payload={'ref':c['frozen_ref']},
              )
              dispatched=True
              for _ in range(24):
                  time.sleep(5); runs=matches()
                  if runs: break
          if len(runs)!=1:
              raise SystemExit(f"expected one frozen v2.7.2 run, found {len(runs)}")
          run=runs[0]
          event=json.load(open(os.environ['GITHUB_EVENT_PATH']))
          receipt={
              'purpose':'product_a_v2_7_2_known_truth_launch_receipt',
              'pull_request':int(event['pull_request']['number']),
              'implementation_sha':c['implementation_sha'],
              'frozen_ref':c['frozen_ref'],
              'workflow_file':c['workflow_file'],
              'scientific_contract_blob_sha':c['scientific_contract_blob_sha'],
              'dispatched_now':dispatched,
              'run_id':int(run['id']),
              'run_number':int(run['run_number']),
              'status':str(run['status']),
              'conclusion':run.get('conclusion'),
              'empirical_sealed_environment_read_allowed':False,
              'scientific_promotion_allowed':False,
              'product_b_unblocked':False,
          }
          Path('launch').mkdir()
          Path('launch/receipt.json').write_text(
              json.dumps(receipt,indent=2,sort_keys=True)+'\n'
          )
          print(json.dumps(receipt,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: product-a-v2-7-2-known-truth-launch-receipt
          path: launch/receipt.json
          retention-days: 90
