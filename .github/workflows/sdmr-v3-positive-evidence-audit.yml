name: sdmr-v3-positive-evidence-audit

on:
  push:
    branches:
      - 'design/sdmr-v3-process-identification'
    paths:
      - 'configs/sdmr_v3_positive_evidence_audit_v1_execute.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdmr-v3-positive-evidence-audit-v1
  cancel-in-progress: false

jobs:
  audit:
    if: github.ref == 'refs/heads/design/sdmr-v3-process-identification'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Validate positive-audit machinery
        run: |
          pytest -q \
            tests/test_process_id_positive_audit.py \
            tests/test_process_id_positive_audit_contract.py
      - name: Verify explicit audit activation marker
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          marker = json.loads(Path("configs/sdmr_v3_positive_evidence_audit_v1_execute.json").read_text())
          assert marker["purpose"] == "execute_sdmr_v3_positive_evidence_audit_v1"
          assert marker["branch"] == "design/sdmr-v3-process-identification"
          assert marker["single_activation"] is True
          assert marker["config_path"] == "configs/sdmr_v3_positive_evidence_audit_v1.json"
          PY
      - name: Run burned positive-evidence audit
        run: |
          python scripts/run_sdmr_v3_positive_evidence_audit.py \
            --config configs/sdmr_v3_positive_evidence_audit_v1.json \
            --outdir positive-audit-output
      - name: Upload positive-evidence audit
        uses: actions/upload-artifact@v4
        with:
          name: sdmr-v3-positive-evidence-audit-v1
          path: positive-audit-output/
          if-no-files-found: error
