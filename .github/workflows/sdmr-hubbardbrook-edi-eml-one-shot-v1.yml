name: SDMR Hubbard Brook versioned EDI EML schema source-only first (one-shot)

on:
  push:
    branches: [method/hubbardbrook-original-edi-metadata-gate-20261121]
    paths:
      - 'configs/hubbardbrook_edi_eml_source_once_v1.lock'

permissions:
  contents: read

jobs:
  first_three_pinned_EML_only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify fixed three source EML packages, code and test hashes
        run: |
          test "$(git hash-object configs/hubbardbrook_edi_tree_source_metadata_v1.json)" = "8aca2a50a44b983352213720388b41791cddc6ee"
          test "$(git hash-object scripts/hubbardbrook_edi_eml_source_metadata_v1.py)" = "a03d21c6249f251537fb839a5fd3ef1052eab176"
          test "$(git hash-object tests/test_hubbardbrook_edi_eml_source_metadata_v1.py)" = "06d52a745cc490894bb891c7a4dcb2c0a2b27b9a"
          python - <<'PY'
          from pathlib import Path
          fixed=Path('configs/hubbardbrook_edi_eml_source_once_v1.lock').read_text().splitlines()
          assert fixed==[
            'program=sdmr_hubbardbrook_original_EML_metadata_only_v1',
            'source_provider=Environmental_Data_Initiative_open_catalog_metadata_only',
            'package_versions=knb-lter-hbr.446.1,knb-lter-hbr.447.1,knb-lter-hbr.448.1',
            'source_sites=Watershed1,Watershed5,Watershed6_one_Hubbard_forest',
            'only_3_exact_version_EML_GETs=true',
            'no_CSV_or_original_entity_bytes_downloaded=true',
            'no_tree_status_date_stem_measurement_values_parsed=true',
            'no_independent_forest_replication_from_nested_watersheds=true',
            'no_full_source_SHA256_or_sampling_opportunity_admission=true',
            'M5_ProductA_unchanged_ProductB_blocked=true',
          ],"Hubbard EDI one-shot metadata scientific contract changed"
          PY
      - name: Run source-free EML XML, version and scientific-grain contract tests
        run: |
          python -m pip install 'pytest>=8,<10'
          python -m pytest -q tests/test_hubbardbrook_edi_eml_source_metadata_v1.py
      - name: Verify preflight never contacts real ecological source
        run: |
          python scripts/hubbardbrook_edi_eml_source_metadata_v1.py \
            --preflight-only \
            --out artifacts/hubbard_edi_metadata_preflight_v1.json
      - name: Once-only published EDI EML version XML metadata, NO data entities
        run: |
          python scripts/hubbardbrook_edi_eml_source_metadata_v1.py \
            --execute-lock configs/hubbardbrook_edi_eml_source_once_v1.lock \
            --out artifacts/hubbard_edi_metadata_result_v1.json
      - name: Archive source metadata schema or explicit typed STOP, never tree rows
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/hubbard_edi_metadata_result_v1.json')
          assert p.is_file() and p.stat().st_size>300
          x=json.loads(p.read_text())
          assert x['schema']=='sdmr.hubbard_brook_original_EML_source_first_receipt.v1'
          assert not x['preflight']
          assert x['original_forest_replicates']==1
          assert x['original_source_CSV_or_biological_rows_opened'] is False
          assert x['new_ecological_models_fit']==0
          assert not x['independent_empirical_process_test_performed']
          assert not x['Product_B_unblocked']
          r=x['result']
          assert r['status'] in (
            'three_watershed_original_EDI_EML_schema_metadata_only',
            'EDI_original_metadata_HTTP_STOP',
            'EDI_original_metadata_network_STOP',
            'EDI_original_metadata_schema_integrity_STOP',
          ),r['status']
          if r['status']=='three_watershed_original_EDI_EML_schema_metadata_only':
            assert r['n_metadata_schemas_verified']==3
            assert r['three_watersheds_within_one_physical_forest']
            assert not r['actual_tree_level_observation_eligibility_verified']
            assert r['original_data_files_downloaded']==0
            assert r['new_biological_responses_opened']==0
            assert r['new_process_models_fit']==0
            assert not r['Product_B_unblocked']
            assert all(not z['original_biological_rows_opened'] for z in r['verified_metadata_schemas'])
          print('Hubbard EDI first source metadata:',r['status'])
          PY
      - name: Upload only EML codebook metadata or STOP JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdmr-hubbardbrook-3version-original-EDI-EML-metadata-or-stop-v1
          path: |
            artifacts/hubbard_edi_metadata_preflight_v1.json
            artifacts/hubbard_edi_metadata_result_v1.json
          if-no-files-found: error
          retention-days: 90
