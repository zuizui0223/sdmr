name: sealed-answer-separator-v25-development

on:
  pull_request:
    paths:
      - 'src/sdmr/sealed_answer_separator_v25.py'
      - 'src/sdmr/sealed_answer_separator_v25_development.py'
      - 'configs/sealed_answer_separator_v25_development.json'
      - 'docs/SEALED_ANSWER_SEPARATOR_V25_CONTRACT.md'
      - 'tests/test_sealed_answer_separator_v25.py'
      - 'tests/test_sealed_answer_separator_v25_development.py'
      - '.github/workflows/sealed-answer-separator-v25-development.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e . pytest
      - run: >-
          pytest -q
          tests/test_sealed_answer_separator_v25.py
          tests/test_sealed_answer_separator_v25_development.py
          tests/test_separating_evidence_refinement_v24.py
          tests/test_separating_evidence_refinement_v24_boolean_regression.py

  family:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        family:
          - gaussian
          - asymmetric
          - soft_threshold
          - interaction
          - omitted_driver
          - observation_confounded
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e .
      - name: Download authoritative v23 context sets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p frozen
          gh api repos/zuizui0223/sdmr/actions/artifacts/10431279663/zip > v23.zip
          unzip -q v23.zip -d frozen
          test -f frozen/context_sets.csv
      - name: Run consumed family separator
        run: >-
          python -m sdmr.sealed_answer_separator_v25_development run-family
          --family ${{ matrix.family }}
          --context-sets frozen/context_sets.csv
          --output-dir evidence/${{ matrix.family }}
      - uses: actions/upload-artifact@v4
        with:
          name: sealed-answer-v25-${{ matrix.family }}
          path: evidence/${{ matrix.family }}/
          retention-days: 90

  aggregate:
    needs: family
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e .
      - name: Download authoritative v23 context sets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p frozen
          gh api repos/zuizui0223/sdmr/actions/artifacts/10431279663/zip > v23.zip
          unzip -q v23.zip -d frozen
      - uses: actions/download-artifact@v4
        with:
          pattern: sealed-answer-v25-*
          path: shards
      - name: Freeze truth-blind refinement
        run: >-
          python -m sdmr.sealed_answer_separator_v25_development aggregate
          --input-dir shards
          --context-sets frozen/context_sets.csv
          --output-dir final
      - name: Open known truth only after refinement is frozen
        run: >-
          python -m sdmr.sealed_answer_separator_v25_development score
          --refinement final/context_refinements.csv
          --output-dir final
      - uses: actions/upload-artifact@v4
        with:
          name: sealed-answer-v25-consumed-development-${{ github.sha }}
          path: final/
          retention-days: 90
