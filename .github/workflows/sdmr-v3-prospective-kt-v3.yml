name: sdmr-v3-prospective-kt-v3

on:
  push:
    branches:
      - 'design/sdmr-v3-process-identification'
    paths:
      - 'configs/sdmr_v3_prospective_kt_v3_activate.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdmr-v3-prospective-kt-v3
  cancel-in-progress: false

jobs:
  preflight:
    if: github.ref == 'refs/heads/design/sdmr-v3-process-identification'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Compile prospective machinery
        run: |
          python -m py_compile \
            scripts/run_sdmr_v3_prospective_kt_shard.py \
            scripts/aggregate_sdmr_v3_prospective_kt.py \
            src/sdmr/process_id/known_truth/prospective_kt.py
      - name: Validate frozen prospective contracts
        run: |
          pytest -q \
            tests/test_process_id_prospective_kt_v3_contract.py \
            tests/test_process_id_prospective_kt_gate.py
      - name: Verify activation receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("configs/sdmr_v3_prospective_kt_v3_activate.json")
          x=json.loads(p.read_text())
          assert x["purpose"]=="execute_sdmr_v3_prospective_known_truth_v3"
          assert x["branch"]=="design/sdmr-v3-process-identification"
          assert x["single_activation"] is True
          assert x["scientific_contract_blob_sha"]=="73bb1ac9e5b1357d4c278712176e65286bd3bb6b"
          assert x["execution_profile_blob_sha"]=="48f0e9dbcb8762b7e9f1eca6d9279382fc1feb0b"
          assert x["development_prerequisite_run"]==35997608669
          assert x["development_prerequisite_conclusion"]=="success"
          assert x["development_prerequisite_artifact_id"]==10806253612
          assert x["development_prerequisite_artifact_digest"]=="sha256:4a7174bdb701225de22c5735a80923df0a37944ec071f90f421662fc105e4847"
          assert x["approved_for_single_prospective_execution"] is True
          assert x["prospective_outcomes_opened_before_activation"] is False
          PY

  prospective:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        world:
          - unique_process
          - redundant_representation
          - shared_carrier
          - null_correlated
          - interaction
          - observation_confounded
          - omitted_driver
          - geographic_shift
        seed_block: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install -e '.[test]'
      - name: Run prospective shard
        run: |
          python scripts/run_sdmr_v3_prospective_kt_shard.py \
            --contract configs/sdmr_v3_prospective_kt_v3.json \
            --execution-profile configs/sdmr_v3_prospective_kt_v3_execution.json \
            --activation configs/sdmr_v3_prospective_kt_v3_activate.json \
            --world ${{ matrix.world }} \
            --seed-block ${{ matrix.seed_block }} \
            --outdir prospective-output
      - name: Upload prospective shard
        uses: actions/upload-artifact@v4
        with:
          name: prospective-v3-${{ matrix.world }}-block${{ matrix.seed_block }}
          path: prospective-output/
          if-no-files-found: error

  aggregate:
    needs: prospective
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install -e '.[test]'
      - name: Download prospective shards
        uses: actions/download-artifact@v4
        with:
          pattern: 'prospective-v3-*'
          path: prospective-shards
      - name: Aggregate prospective KT evidence
        run: |
          python scripts/aggregate_sdmr_v3_prospective_kt.py \
            --input-root prospective-shards \
            --contract configs/sdmr_v3_prospective_kt_v3.json \
            --execution-profile configs/sdmr_v3_prospective_kt_v3_execution.json \
            --activation configs/sdmr_v3_prospective_kt_v3_activate.json \
            --outdir prospective-aggregate \
            --expected-shards 32
      - name: Upload prospective terminal evidence
        uses: actions/upload-artifact@v4
        with:
          name: sdmr-v3-prospective-kt-v3
          path: prospective-aggregate/
          if-no-files-found: error
