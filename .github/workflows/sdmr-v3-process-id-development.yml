name: sdmr-v3-process-id-development

on:
  workflow_dispatch:
  push:
    branches:
      - 'design/sdmr-v3-process-identification'
    paths:
      - 'configs/sdmr_v3_process_id_development_v1_execute.json'

permissions:
  contents: read

concurrency:
  group: sdmr-v3-process-id-development-v1
  cancel-in-progress: false

jobs:
  development:
    if: github.ref == 'refs/heads/design/sdmr-v3-process-identification'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Validate development machinery
        run: |
          pytest -q \
            tests/test_process_id_development.py \
            tests/test_process_id_development_contract.py
      - name: Verify explicit activation marker
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          marker = json.loads(Path("configs/sdmr_v3_process_id_development_v1_execute.json").read_text())
          assert marker["purpose"] == "execute_sdmr_v3_process_id_development_v1"
          assert marker["branch"] == "design/sdmr-v3-process-identification"
          assert marker["single_activation"] is True
          assert marker["config_path"] == "configs/sdmr_v3_process_id_development_v1.json"
          PY
      - name: Run burned development denominator
        run: |
          python scripts/run_sdmr_v3_process_id_development.py \
            --config configs/sdmr_v3_process_id_development_v1.json \
            --outdir development-output
      - name: Upload development evidence
        uses: actions/upload-artifact@v4
        with:
          name: sdmr-v3-process-id-development-v1
          path: development-output/
          if-no-files-found: error
