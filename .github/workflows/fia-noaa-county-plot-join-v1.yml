name: fia-noaa-county-plot-join-v1

on:
  pull_request:
    paths:
      - 'experiments/fia_noaa_county_plot_source_v1.py'
      - 'tests/test_fia_noaa_county_plot_source_v1.py'
      - 'docs/FIA_NOAA_COUNTY_PLOT_JOIN_V1.md'
      - 'results/fia_noaa_county_climate_v1/**'
      - '.github/workflows/fia-noaa-county-plot-join-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
jobs:
  plot-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline tests
        run: |
          python -m pip install -e '.[test]'
          python -m pytest -q tests/test_fia_noaa_county_plot_source_v1.py
      - name: Join unchanged FIA PLOT identities to independently pinned NOAA monthly climate
        run: |
          python experiments/fia_noaa_county_plot_source_v1.py \
            --fia-plot evidence/fia_plot_condition_source_v1.json \
            --climate-csv results/fia_noaa_county_climate_v1/noaa_county_growing_months_1991_2025.csv \
            --climate-receipt results/fia_noaa_county_climate_v1/source_receipt.json \
            --output artifacts/fia_noaa_county_plot_join_v1.json
      - name: Preserve source-identity stops and complete structural denominators
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fia-noaa-county-plot-join-v1
          path: artifacts/fia_noaa_county_plot_join_v1.json
          if-no-files-found: warn
