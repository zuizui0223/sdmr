name: context-geometry-v17-development

on:
  pull_request:
    paths:
      - 'src/sdmr/context_geometry_v17.py'
      - 'src/sdmr/context_geometry_v17_development.py'
      - 'configs/context_geometry_v17_development.json'
      - 'tests/test_context_geometry_v17.py'
      - 'tests/test_context_geometry_v17_development.py'
      - '.github/workflows/context-geometry-v17-development.yml'
  workflow_dispatch:

concurrency:
  group: context-geometry-v17-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e . pytest
      - run: pytest -q tests/test_context_geometry_v17.py tests/test_context_geometry_v17_development.py

  family:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        family: [gaussian, asymmetric, soft_threshold, interaction, omitted_driver, observation_confounded]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e .
      - run: python -m sdmr.context_geometry_v17_development fit-family --family '${{ matrix.family }}' --output-dir output
      - uses: actions/upload-artifact@v4
        with:
          name: context-geometry-v17-${{ matrix.family }}-${{ github.sha }}
          path: output/context_geometry.csv
          retention-days: 90

  aggregate:
    needs: family
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: context-geometry-v17-*-${{ github.sha }}
          path: inputs
      - run: python -m sdmr.context_geometry_v17_development aggregate --input-dir inputs --output-dir development
      - uses: actions/upload-artifact@v4
        with:
          name: context-geometry-v17-development-${{ github.sha }}
          path: development/
          retention-days: 90
