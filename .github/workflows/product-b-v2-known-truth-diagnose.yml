name: product-b-v2-known-truth-diagnose

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/product-b-v2-known-truth-diagnose.yml'

permissions:
  contents: write
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Record all jobs from failed Product-B v2 run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']
          headers={
            'Authorization':f'Bearer {token}',
            'Accept':'application/vnd.github+json',
            'X-GitHub-Api-Version':'2022-11-28',
            'User-Agent':'sdmr-product-b-v2-diagnose',
          }
          def get(url):
            req=urllib.request.Request(url,headers=headers)
            with urllib.request.urlopen(req,timeout=60) as r: return json.loads(r.read())
          run_id=32345246380
          payload=get(f'https://api.github.com/repos/{repo}/actions/runs/{run_id}/jobs?per_page=100')
          rows=[]
          for j in payload.get('jobs',[]):
            rows.append({
              'id':int(j['id']), 'name':str(j['name']), 'status':str(j['status']),
              'conclusion':j.get('conclusion'),
              'failed_steps':[{'number':s.get('number'),'name':s.get('name'),'conclusion':s.get('conclusion')}
                              for s in j.get('steps',[]) if s.get('conclusion') in {'failure','cancelled','timed_out'}],
            })
          receipt={
            'purpose':'product_b_v2_known_truth_run_diagnosis',
            'run_id':run_id,
            'total_jobs':len(rows),
            'non_success_jobs':[r for r in rows if r['conclusion'] not in {'success','skipped'}],
            'all_jobs':rows,
          }
          path='configs/product_b_v2_known_truth_diagnosis.json'
          existing=None
          try: existing=get(f'https://api.github.com/repos/{repo}/contents/{path}?ref=main')
          except Exception: pass
          body={
            'message':'Record Product-B v2 known-truth failed job diagnosis',
            'content':base64.b64encode((json.dumps(receipt,indent=2,sort_keys=True)+'\n').encode()).decode(),
            'branch':'main',
          }
          if existing: body['sha']=existing['sha']
          data=json.dumps(body).encode()
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/{path}',data=data,headers=headers,method='PUT')
          with urllib.request.urlopen(req,timeout=60) as r: r.read()
          print(json.dumps(receipt['non_success_jobs'],indent=2))
          PY
