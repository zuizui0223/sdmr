name: product-a-performance-equivalence

on:
  pull_request:
    paths:
      - 'src/sdmr/robust_protocol.py'
      - 'src/sdmr/method.py'
      - 'src/sdmr/metrics.py'
      - 'src/sdmr/model.py'
      - 'tests/test_robust_protocol_parallel.py'
      - 'tests/test_method_modelspec_parallel.py'
      - 'tests/test_continuous_boyce.py'
      - '.github/workflows/product-a-performance-equivalence.yml'
  push:
    branches:
      - agent/nested-spatial-raster-benchmark
    paths:
      - 'src/sdmr/robust_protocol.py'
      - 'src/sdmr/method.py'
      - 'src/sdmr/metrics.py'
      - 'src/sdmr/model.py'
      - 'tests/test_robust_protocol_parallel.py'
      - 'tests/test_method_modelspec_parallel.py'
      - 'tests/test_continuous_boyce.py'
      - '.github/workflows/product-a-performance-equivalence.yml'

permissions:
  contents: read

concurrency:
  group: product-a-performance-equivalence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-semantics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Verify all performance changes preserve exact Product-A outputs
        run: |
          pytest -q \
            tests/test_robust_protocol_parallel.py \
            tests/test_method_modelspec_parallel.py \
            tests/test_continuous_boyce.py \
            tests/test_metrics.py
