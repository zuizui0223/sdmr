name: sdmr-v3-finite-probability-quality-audit

on:
  push:
    branches:
      - 'design/sdmr-v3-process-identification'
    paths:
      - 'configs/sdmr_v3_finite_probability_quality_audit_v1_execute.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdmr-v3-finite-probability-quality-audit-v1
  cancel-in-progress: false

jobs:
  audit:
    if: github.ref == 'refs/heads/design/sdmr-v3-process-identification'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Validate probability-quality audit machinery
        run: |
          pytest -q             tests/test_process_id_probability_audit.py             tests/test_process_id_probability_audit_contract.py             tests/test_process_id_evidence.py
      - name: Verify explicit activation marker
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          marker = json.loads(
              Path("configs/sdmr_v3_finite_probability_quality_audit_v1_execute.json").read_text()
          )
          assert marker["purpose"] == "execute_sdmr_v3_finite_probability_quality_audit_v1"
          assert marker["branch"] == "design/sdmr-v3-process-identification"
          assert marker["single_activation"] is True
          assert marker["config_path"] == "configs/sdmr_v3_finite_probability_quality_audit_v1.json"
          PY
      - name: Run finite probability-quality audit
        run: |
          python scripts/run_sdmr_v3_finite_probability_quality_audit.py             --config configs/sdmr_v3_finite_probability_quality_audit_v1.json             --outdir probability-quality-output
      - name: Upload probability-quality evidence
        uses: actions/upload-artifact@v4
        with:
          name: sdmr-v3-finite-probability-quality-audit-v1
          path: probability-quality-output/
          if-no-files-found: error
