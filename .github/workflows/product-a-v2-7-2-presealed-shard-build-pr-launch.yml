name: product-a-v2-7-2-presealed-shard-build-pr-launch

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'configs/product_a_v2_7_2_shard_build_pr_trigger.txt'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Dispatch at most one exact deterministic 216-shard build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.request
          from pathlib import Path
          from urllib.parse import quote
          c=json.load(open('configs/product_a_v2_7_2_shard_build_execution.json'))
          if c.get('execution_allowed') is not True:
              raise SystemExit('deterministic shard-build gate is closed')
          if not c.get('frozen_ref'):
              raise SystemExit('deterministic shard-build frozen ref is not pinned')
          if c.get('random_state')!=271 or c.get('total_M_shards')!=216:
              raise SystemExit('deterministic shard-build denominator changed')
          if c.get('probe_passed') is not True or int(c.get('probe_run_id') or 0)<=0 or int(c.get('probe_artifact_id') or 0)<=0 or not str(c.get('probe_artifact_digest') or '').startswith('sha256:'):
              raise SystemExit('successful deterministic probe is not pinned')
          if c.get('one_shot_required') is not True or c.get('sealed_environment_read_allowed') is not False:
              raise SystemExit('deterministic shard-build execution boundary changed')
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']; api=f'https://api.github.com/repos/{repo}'
          h={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'sdmr-v272-shard-build-launcher'}
          def request(url,*,method='GET',payload=None):
              data=None if payload is None else json.dumps(payload).encode(); req=urllib.request.Request(url,data=data,headers=h,method=method)
              with urllib.request.urlopen(req,timeout=60) as r:
                  raw=r.read(); return json.loads(raw) if raw else None
          branch=request(f"{api}/branches/{quote(c['frozen_ref'],safe='')}")
          resolved_sha=str(branch.get('commit',{}).get('sha',''))
          if len(resolved_sha)!=40:
              raise SystemExit('deterministic shard-build frozen ref did not resolve to one commit')
          def matches():
              data=request(f"{api}/actions/workflows/{c['workflow_file']}/runs?event=workflow_dispatch&per_page=100")
              return [r for r in data.get('workflow_runs',[]) if r.get('head_sha')==resolved_sha and r.get('head_branch')==c['frozen_ref'] and r.get('event')=='workflow_dispatch']
          runs=matches(); dispatched=False
          if len(runs)>1:
              raise SystemExit(f'multiple exact deterministic shard-build runs exist: {len(runs)}')
          if not runs:
              payload={'ref':c['frozen_ref'],'inputs':{
                  'expected_sha':resolved_sha,'expected_ref':c['frozen_ref'],
                  'probe_run_id':str(c['probe_run_id']),'probe_artifact_id':str(c['probe_artifact_id']),'probe_artifact_digest':c['probe_artifact_digest']}}
              request(f"{api}/actions/workflows/{c['workflow_file']}/dispatches",method='POST',payload=payload); dispatched=True
              for _ in range(24):
                  time.sleep(5); runs=matches()
                  if runs: break
          if len(runs)!=1:
              raise SystemExit(f'expected one exact deterministic shard-build run, found {len(runs)}')
          run=runs[0]; event=json.load(open(os.environ['GITHUB_EVENT_PATH']))
          receipt={
              'purpose':'product_a_v2_7_2_deterministic_shard_build_launch_receipt',
              'pull_request':int(event['pull_request']['number']),
              'implementation_sha':resolved_sha,'frozen_ref':c['frozen_ref'],'random_state':271,
              'probe_run_id':int(c['probe_run_id']),'probe_artifact_id':int(c['probe_artifact_id']),'probe_artifact_digest':c['probe_artifact_digest'],
              'dispatched_now':dispatched,'run_id':int(run['id']),'run_number':int(run['run_number']),'status':str(run['status']),'conclusion':run.get('conclusion'),
              'sealed_environment_read_allowed':False,'scientific_decision_generated':False,'scientific_promotion_allowed':False,'product_b_unblocked':False,
          }
          Path('launch').mkdir(); Path('launch/receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n'); print(json.dumps(receipt,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: product-a-v2-7-2-deterministic-shard-build-launch-receipt
          path: launch/receipt.json
          retention-days: 90
