name: product-a-v2-7-1-fresh-confirmation-pr-launch

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'configs/product_a_v2_7_1_fresh_confirmation_pr_trigger.txt'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Dispatch exactly one frozen fresh confirmation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.request
          from pathlib import Path

          execution=json.load(open('configs/product_a_v2_7_1_fresh_confirmation_execution_contract.json'))
          gate=json.load(open('configs/product_a_v2_7_1_fresh_empirical_source_gate.json'))
          required=gate['required_before_execution']
          if gate.get('gate_state')!='ready_for_one_shot_fresh_confirmation' or gate.get('execution_allowed') is not True:
              raise SystemExit('fresh confirmation gate is not open')
          for key in ('implementation_sha','frozen_ref','workflow_file'):
              if str(required.get(key))!=str(execution.get(key)):
                  raise SystemExit(f'fresh execution identity mismatch for {key}')
          if execution.get('requires_single_workflow_dispatch_run_for_frozen_identity') is not True:
              raise SystemExit('fresh execution contract does not require one-shot dispatch')

          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']
          api=f'https://api.github.com/repos/{repo}'
          headers={
              'Authorization':f'Bearer {token}',
              'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28',
              'User-Agent':'sdmr-v271-fresh-confirmation-launcher',
          }
          def request(url,*,method='GET',payload=None):
              data=None if payload is None else json.dumps(payload).encode()
              req=urllib.request.Request(url,data=data,headers=headers,method=method)
              with urllib.request.urlopen(req,timeout=60) as r:
                  raw=r.read(); return json.loads(raw) if raw else None
          def matches():
              p=request(f"{api}/actions/workflows/{execution['workflow_file']}/runs?event=workflow_dispatch&per_page=100")
              return [
                  r for r in p.get('workflow_runs',[])
                  if str(r.get('head_sha'))==execution['implementation_sha']
                  and str(r.get('head_branch'))==execution['frozen_ref']
                  and str(r.get('event'))=='workflow_dispatch'
              ]

          runs=matches(); dispatched=False
          if len(runs)>1:
              raise SystemExit(f"multiple frozen fresh-confirmation runs exist: {len(runs)}")
          if not runs:
              request(
                  f"{api}/actions/workflows/{execution['workflow_file']}/dispatches",
                  method='POST',
                  payload={'ref':execution['frozen_ref']},
              )
              dispatched=True
              for _ in range(24):
                  time.sleep(5); runs=matches()
                  if runs: break
          if len(runs)!=1:
              raise SystemExit(f"expected one frozen fresh-confirmation run, found {len(runs)}")
          run=runs[0]
          event=json.load(open(os.environ['GITHUB_EVENT_PATH']))
          receipt={
              'purpose':'product_a_v2_7_1_fresh_confirmation_launch_receipt',
              'pull_request':int(event['pull_request']['number']),
              'launcher_sha':os.environ['GITHUB_SHA'],
              'implementation_sha':execution['implementation_sha'],
              'frozen_ref':execution['frozen_ref'],
              'workflow_file':execution['workflow_file'],
              'dispatched_now':dispatched,
              'run_id':int(run['id']),
              'run_number':int(run['run_number']),
              'status':str(run['status']),
              'conclusion':run.get('conclusion'),
              'created_at':str(run['created_at']),
              'html_url':str(run['html_url']),
              'scientific_promotion_allowed':False,
              'product_b_unblocked':False,
              'post_outcome_retuning_allowed':False,
          }
          Path('launch').mkdir()
          Path('launch/receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print(json.dumps(receipt,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: product-a-v2-7-1-fresh-confirmation-launch-receipt
          path: launch/receipt.json
          retention-days: 90
