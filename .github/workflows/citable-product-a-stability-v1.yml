name: citable-product-a-stability-v1

on:
  workflow_run:
    workflows: ["citable-product-a-v1"]
    types: [completed]
  push:
    branches:
      - agent/nested-spatial-raster-benchmark
    paths:
      - 'configs/product_a_stability_v1_source.csv'

permissions:
  contents: read
  actions: read

concurrency:
  group: citable-product-a-stability-v1-${{ github.event.workflow_run.id || github.sha }}
  cancel-in-progress: false

jobs:
  stability:
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout current governance files
        uses: actions/checkout@v4
        with:
          ref: agent/nested-spatial-raster-benchmark
          path: governance
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Resolve exact successful Product-A v1 source run
        id: source
        run: |
          python - <<'PY'
          import csv
          import os
          from pathlib import Path

          event = os.environ['GITHUB_EVENT_NAME']
          output = Path(os.environ['GITHUB_OUTPUT'])
          if event == 'workflow_run':
              run_id = '${{ github.event.workflow_run.id }}'
              head_sha = '${{ github.event.workflow_run.head_sha }}'
          else:
              path = Path('governance/configs/product_a_stability_v1_source.csv')
              rows = list(csv.DictReader(path.open(encoding='utf-8')))
              if len(rows) != 1:
                  raise SystemExit('product_a_stability_v1_source.csv must contain exactly one row')
              run_id = str(rows[0].get('source_run_id', '')).strip()
              head_sha = str(rows[0].get('source_head_sha', '')).strip()
              if not run_id or not head_sha:
                  raise SystemExit('source_run_id and source_head_sha are required')
          with output.open('a', encoding='utf-8') as fh:
              fh.write(f'run_id={run_id}\n')
              fh.write(f'head_sha={head_sha}\n')
          print('source_run_id', run_id, 'source_head_sha', head_sha)
          PY
      - name: Checkout exact Product-A v1 analysis code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.head_sha }}
          path: analysis
      - name: Install frozen SDMR analysis dependencies
        working-directory: analysis
        run: python -m pip install -e '.[parquet]'
      - name: Download exact successful citable Product-A v1 artifact
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: citable-product-a-v1-*
          path: source_bundle
          merge-multiple: true
      - name: Verify DOI-backed source and index frozen M specifications
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          root = Path('source_bundle')
          result = root / 'citable_result'
          contract_path = result / 'citable_snapshot_contract.json'
          boundary_path = result / 'CITABLE_PILOT_BOUNDARY.txt'
          criteria_path = Path('governance/configs/product_a_promotion_criteria_v1.csv')
          for path in (contract_path, boundary_path, criteria_path):
              if not path.exists():
                  raise SystemExit(f'Missing required frozen evidence/criterion file: {path}')
          contract = json.loads(contract_path.read_text(encoding='utf-8'))
          if contract.get('protocol_version') != 'product_a_v1':
              raise SystemExit('Source artifact is not Product-A v1')
          if not str(contract.get('snapshot_doi', '')).strip():
              raise SystemExit('Source artifact has no snapshot DOI')
          if int(contract.get('chelsa_probe_failures', 1)) != 0:
              raise SystemExit('Source artifact did not pass full CHELSA preflight')
          if str(contract.get('citation_sha256_expected', '')).lower() != str(contract.get('citation_sha256_focal', '')).lower():
              raise SystemExit('Source artifact citation fingerprint does not match frozen snapshot contract')

          grid_path = result / 'pilot_grid_frozen.csv'
          occurrences = result / 'pilot_occurrences.csv'
          if not grid_path.exists() or not occurrences.exists():
              raise SystemExit('Source artifact lacks frozen grid or occurrence feature table')
          grid = pd.read_csv(grid_path)
          rows = []
          for name in grid['name'].astype(str):
              background = result / 'specifications' / name / 'background.csv'
              if not background.exists():
                  raise SystemExit(f'Missing frozen background feature table: {background}')
              rows.append({
                  'name': name,
                  'occurrences': '../source_bundle/citable_result/pilot_occurrences.csv',
                  'background': f'../source_bundle/citable_result/specifications/{name}/background.csv',
              })
          pd.DataFrame(rows).to_csv('analysis/stability_specifications.csv', index=False)
          PY
      - name: Run predeclared 15-run protocol stability grid
        working-directory: analysis
        run: |
          sdmr-protocol-stability \
            --specifications stability_specifications.csv \
            --manifest configs/chelsa_v2_1_plant_candidates.csv \
            --output-dir ../stability_result \
            --seeds '11,22,33,44,55' \
            --sealed-fractions '0.15,0.20,0.30' \
            --taxon-validation-fraction 0.25 \
            --vif-threshold 5 \
            --max-predictors 8 \
            --random-baseline-repeats 10
      - name: Freeze stability evidence contract
        if: always()
        run: |
          mkdir -p stability_result
          cp source_bundle/citable_result/citable_snapshot_contract.json stability_result/source_citable_snapshot_contract.json 2>/dev/null || true
          cp governance/configs/product_a_promotion_criteria_v1.csv stability_result/promotion_criteria_predeclared_before_stability.csv
          cat > stability_result/stability_inputs.txt <<EOF
          source_run_id=${{ steps.source.outputs.run_id }}
          source_head_sha=${{ steps.source.outputs.head_sha }}
          analysis_code_ref=${{ steps.source.outputs.head_sha }}
          seeds=11,22,33,44,55
          sealed_fractions=0.15,0.20,0.30
          taxon_validation_fraction=0.25
          promotion_criteria=governance/configs/product_a_promotion_criteria_v1.csv
          EOF
          cat > stability_result/STABILITY_BOUNDARY.txt <<'EOF'
          These stability runs reuse the exact DOI-backed occurrence/background/CHELSA feature evidence from Product-A v1.
          The SDMR analysis package is checked out at the exact Product-A v1 source head SHA. No GBIF or CHELSA data are re-fetched.
          Promotion thresholds were committed before these stability results existed.
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: citable-product-a-stability-v1-source-${{ steps.source.outputs.run_id }}
          path: stability_result/
          if-no-files-found: error
          retention-days: 90
