name: product-a-v2-7-1-fresh-promotion-pr-launch

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'configs/product_a_v2_7_1_fresh_promotion_pr_trigger.txt'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Dispatch exactly one frozen promotion after one admissible decision source exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.request
          from pathlib import Path

          execution=json.load(open('configs/product_a_v2_7_1_fresh_promotion_execution_contract.json'))
          if execution.get('requires_single_workflow_dispatch_run_for_frozen_identity') is not True:
              raise SystemExit('promotion execution contract is not one-shot')
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']; api=f'https://api.github.com/repos/{repo}'
          headers={
              'Authorization':f'Bearer {token}',
              'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28',
              'User-Agent':'sdmr-v271-fresh-promotion-launcher',
          }
          def request(url,*,method='GET',payload=None):
              data=None if payload is None else json.dumps(payload).encode()
              req=urllib.request.Request(url,data=data,headers=headers,method=method)
              with urllib.request.urlopen(req,timeout=60) as r:
                  raw=r.read(); return json.loads(raw) if raw else None
          def artifacts(run_id):
              result=[]; page=1
              while True:
                  data=request(f'{api}/actions/runs/{run_id}/artifacts?per_page=100&page={page}')
                  batch=data.get('artifacts',[]); result.extend(batch)
                  if len(batch)<100: break
                  page+=1
              return result

          primary=execution['primary_fresh_source']
          prun=request(f"{api}/actions/runs/{primary['run_id']}")
          if prun.get('head_sha')!=primary['implementation_sha'] or prun.get('head_branch')!=primary['frozen_ref'] or prun.get('event')!='workflow_dispatch':
              raise SystemExit('promotion primary source identity mismatch')
          primary_decisions=[
              a for a in artifacts(primary['run_id'])
              if a.get('name')==primary['decision_artifact_name'] and not a.get('expired')
          ]
          if len(primary_decisions)>1:
              raise SystemExit('multiple primary fresh decision artifacts are forbidden')

          cont=execution['technical_continuation_source']
          cruns=request(f"{api}/actions/workflows/{cont['workflow_file']}/runs?event=workflow_dispatch&per_page=100").get('workflow_runs',[])
          cruns=[
              r for r in cruns
              if r.get('head_sha')==cont['implementation_sha']
              and r.get('head_branch')==cont['frozen_ref']
              and r.get('event')=='workflow_dispatch'
          ]
          if len(cruns)>1:
              raise SystemExit('multiple frozen continuation runs are forbidden')
          continuation_decisions=[]
          if cruns:
              continuation_decisions=[
                  a for a in artifacts(cruns[0]['id'])
                  if a.get('name')==cont['decision_artifact_name'] and not a.get('expired')
              ]
              if len(continuation_decisions)>1:
                  raise SystemExit('multiple continuation fresh decision artifacts are forbidden')

          if primary_decisions:
              if continuation_decisions:
                  raise SystemExit('both primary and continuation decisions exist; promotion launch is ambiguous')
              source_kind='primary'; source_run_id=int(primary['run_id'])
          else:
              if prun.get('status')!='completed' or prun.get('conclusion')=='success':
                  raise SystemExit('no admissible fresh decision source exists yet')
              if len(cruns)!=1 or cruns[0].get('status')!='completed' or cruns[0].get('conclusion')!='success' or len(continuation_decisions)!=1:
                  raise SystemExit('primary failed without decision but frozen continuation decision is not ready')
              source_kind='technical_continuation'; source_run_id=int(cruns[0]['id'])

          def matches():
              payload=request(f"{api}/actions/workflows/{execution['workflow_file']}/runs?event=workflow_dispatch&per_page=100")
              return [
                  r for r in payload.get('workflow_runs',[])
                  if r.get('head_sha')==execution['implementation_sha']
                  and r.get('head_branch')==execution['frozen_ref']
                  and r.get('event')=='workflow_dispatch'
              ]
          runs=matches(); dispatched=False
          if len(runs)>1:
              raise SystemExit(f'multiple frozen promotion runs exist: {len(runs)}')
          if not runs:
              request(
                  f"{api}/actions/workflows/{execution['workflow_file']}/dispatches",
                  method='POST', payload={'ref':execution['frozen_ref']},
              )
              dispatched=True
              for _ in range(24):
                  time.sleep(5); runs=matches()
                  if runs: break
          if len(runs)!=1:
              raise SystemExit(f'expected exactly one frozen promotion run, found {len(runs)}')
          run=runs[0]; event=json.load(open(os.environ['GITHUB_EVENT_PATH']))
          receipt={
              'purpose':'product_a_v2_7_1_fresh_promotion_launch_receipt',
              'pull_request':int(event['pull_request']['number']),
              'launcher_sha':os.environ['GITHUB_SHA'],
              'implementation_sha':execution['implementation_sha'],
              'frozen_ref':execution['frozen_ref'],
              'workflow_file':execution['workflow_file'],
              'admissible_fresh_source_kind':source_kind,
              'admissible_fresh_source_run_id':source_run_id,
              'scientific_decision_value_read_by_launcher':False,
              'prediction_or_recovery_metric_value_read_by_launcher':False,
              'dispatched_now':dispatched,
              'run_id':int(run['id']),
              'run_number':int(run['run_number']),
              'status':str(run['status']),
              'created_at':str(run['created_at']),
              'product_b_unblocked':False,
          }
          Path('launch').mkdir()
          Path('launch/receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print(json.dumps(receipt,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: product-a-v2-7-1-fresh-promotion-launch-receipt
          path: launch/receipt.json
          if-no-files-found: error
          retention-days: 90
