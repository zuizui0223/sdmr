name: product-a-v2-5-calibration-preflight

on:
  pull_request:
    paths:
      - 'src/sdmr/v2_5_calibration_support.py'
      - 'configs/product_a_v2_5_calibration_support.json'
      - 'tests/test_v2_5_calibration_support.py'
      - '.github/workflows/product-a-v2-5-calibration-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pretruth-calibration-support:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package
        run: python -m pip install -e '.[test]'
      - name: Verify calibration support before fresh validation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from sdmr.v2_5_calibration_support import require_calibration_support

          path = Path('configs/product_a_v2_5_calibration_support.json')
          config = json.loads(path.read_text())
          audit = require_calibration_support(config)
          assert audit.complete
          assert audit.minimum_support_per_key == 2
          assert len(audit.required_validation_keys) == 9
          support = {(p, q): n for p, q, n in audit.support_counts}
          assert min(support.values()) >= 2
          assert support[('soil', 'optimum')] == 2
          assert support[('soil', 'lower_limit')] == 2
          assert support[('soil', 'upper_limit')] == 2
          assert config['opened_known_truth_seeds_excluded']['maximum'] == 423
          validation_seeds = {
              int(spec['seed'])
              for panel in config['panels']
              for spec in panel['validation']
          }
          calibration_seeds = {
              int(spec['seed'])
              for panel in config['panels']
              for spec in panel['calibration']
          }
          assert validation_seeds.isdisjoint(calibration_seeds)
          assert min(validation_seeds) > 423
          assert min(calibration_seeds) > 423
          print('v2.5 pretruth calibration support: PASS')
          print('required keys:', audit.required_validation_keys)
          print('minimum support:', min(support.values()))
          PY
