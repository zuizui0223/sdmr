name: product-a-v2-7-2-fresh-pr-launch

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'configs/product_a_v2_7_2_fresh_pr_trigger.txt'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Dispatch exactly one frozen v2.7.2 rank-2 empirical confirmation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.parse, urllib.request
          from pathlib import Path

          c=json.load(open('configs/product_a_v2_7_2_fresh_execution_contract.json'))
          if c.get('purpose')!='product_a_v2_7_2_fresh_empirical_execution_contract':
              raise SystemExit('wrong v2.7.2 empirical execution contract')
          if c.get('execution_source_frozen_before_rank2_empirical_outcome') is not True:
              raise SystemExit('v2.7.2 runtime was not frozen before empirical outcome')
          if c.get('requires_single_workflow_dispatch_run_for_frozen_identity') is not True:
              raise SystemExit('v2.7.2 empirical run is not one-shot')
          boundary=c['claim_boundary']
          if boundary.get('decision_itself_promotes_Product_A') is not False or boundary.get('product_b_unblocked') is not False:
              raise SystemExit('v2.7.2 execution contract crossed promotion boundary')

          gate=json.load(open('configs/product_a_v2_7_2_fresh_empirical_source_gate.json'))
          req=gate['required_before_execution']
          if gate.get('execution_allowed') is not True or gate.get('gate_state')!='ready_for_one_shot_rank2_empirical_confirmation':
              raise SystemExit('v2.7.2 empirical authorization gate is closed')
          if req.get('empirical_runtime_implementation_sha')!=c['implementation_sha']:
              raise SystemExit('authorized runtime SHA differs from frozen execution')
          if req.get('empirical_runtime_frozen_ref')!=c['frozen_ref']:
              raise SystemExit('authorized runtime ref differs from frozen execution')
          if req.get('workflow_file')!=c['workflow_file']:
              raise SystemExit('authorized workflow differs from frozen execution')
          if int(req.get('raw_source_receipt_artifact_id',0))!=int(c['frozen_inputs']['source_receipt_artifact_id']):
              raise SystemExit('source receipt artifact ID differs from frozen execution')
          if req.get('raw_source_receipt_artifact_digest')!=c['frozen_inputs']['source_receipt_artifact_digest']:
              raise SystemExit('source receipt artifact digest differs from frozen execution')

          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']; api=f'https://api.github.com/repos/{repo}'
          headers={
              'Authorization':f'Bearer {token}',
              'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28',
              'User-Agent':'sdmr-v272-fresh-launcher',
          }
          def request(url,*,method='GET',payload=None):
              data=None if payload is None else json.dumps(payload).encode()
              req_obj=urllib.request.Request(url,data=data,headers=headers,method=method)
              with urllib.request.urlopen(req_obj,timeout=60) as response:
                  raw=response.read(); return json.loads(raw) if raw else None
          def verify_blob(path,expected):
              quoted=urllib.parse.quote(path,safe='/')
              ref=urllib.parse.quote(c['frozen_ref'],safe='')
              payload=request(f'{api}/contents/{quoted}?ref={ref}')
              if payload.get('sha')!=expected:
                  raise SystemExit(f'frozen runtime blob changed: {path}')

          verify_blob('.github/workflows/product-a-v2-7-2-fresh-confirmation.yml',c['workflow_blob_sha'])
          frozen=c['frozen_inputs']
          verify_blob(frozen['scientific_contract_path'],frozen['scientific_contract_blob_sha'])
          verify_blob(frozen['runtime_design_path'],frozen['runtime_design_blob_sha'])
          verify_blob(frozen['source_gate_path'],frozen['source_gate_blob_sha_at_runtime_freeze'])
          verify_blob(frozen['source_receipt_path'],frozen['source_receipt_blob_sha'])

          def matches():
              payload=request(f"{api}/actions/workflows/{c['workflow_file']}/runs?event=workflow_dispatch&per_page=100")
              return [
                  run for run in payload.get('workflow_runs',[])
                  if str(run.get('head_sha'))==c['implementation_sha']
                  and str(run.get('head_branch'))==c['frozen_ref']
                  and str(run.get('event'))=='workflow_dispatch'
              ]

          runs=matches(); dispatched=False
          if len(runs)>1:
              raise SystemExit(f'multiple frozen v2.7.2 empirical runs exist: {len(runs)}')
          if not runs:
              request(
                  f"{api}/actions/workflows/{c['workflow_file']}/dispatches",
                  method='POST', payload={'ref':c['frozen_ref']},
              )
              dispatched=True
              for _ in range(24):
                  time.sleep(5); runs=matches()
                  if runs: break
          if len(runs)!=1:
              raise SystemExit(f'expected one frozen v2.7.2 empirical run, found {len(runs)}')
          run=runs[0]
          event=json.load(open(os.environ['GITHUB_EVENT_PATH']))
          receipt={
              'purpose':'product_a_v2_7_2_fresh_empirical_launch_receipt',
              'pull_request':int(event['pull_request']['number']),
              'implementation_sha':c['implementation_sha'],
              'frozen_ref':c['frozen_ref'],
              'workflow_file':c['workflow_file'],
              'source_run_id':int(frozen['source_run_id']),
              'source_receipt_artifact_id':int(frozen['source_receipt_artifact_id']),
              'dispatched_now':dispatched,
              'run_id':int(run['id']),
              'run_number':int(run['run_number']),
              'status':str(run['status']),
              'conclusion':run.get('conclusion'),
              'rank2_empirical_confirmation':True,
              'scientific_promotion_allowed':False,
              'product_b_unblocked':False,
          }
          Path('launch').mkdir()
          Path('launch/receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print(json.dumps(receipt,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: product-a-v2-7-2-fresh-empirical-launch-receipt
          path: launch/receipt.json
          retention-days: 90
