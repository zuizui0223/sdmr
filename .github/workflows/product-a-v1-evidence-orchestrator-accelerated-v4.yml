name: product-a-v1-evidence-orchestrator-accelerated-v4

on:
  push:
    branches:
      - agent/nested-spatial-raster-benchmark
    paths:
      - 'configs/product_a_v1_stability_engine_accelerated_v4.csv'
      - '.github/workflows/product-a-v1-evidence-orchestrator-accelerated-v4.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: product-a-v1-evidence-orchestrator-accelerated-v4
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      source_run_id: ${{ steps.contract.outputs.source_run_id }}
      source_run_head: ${{ steps.contract.outputs.source_run_head }}
      governance_sha: ${{ steps.contract.outputs.governance_sha }}
      engine_sha: ${{ steps.contract.outputs.engine_sha }}
      benchmark_jobs: ${{ steps.contract.outputs.benchmark_jobs }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind accelerated source and exact scientific governance
        id: contract
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import csv, json, os, time
          from pathlib import Path
          from urllib.request import Request, urlopen

          rows=list(csv.DictReader(Path('configs/product_a_v1_stability_engine_accelerated_v4.csv').open(encoding='utf-8')))
          if len(rows)!=1: raise SystemExit('accelerated v4 config must contain one row')
          row=rows[0]
          source_run=row['source_citable_run_id'].strip()
          source_head=row['source_run_head_sha'].strip()
          governance=row['scientific_governance_sha'].strip()
          engine=row['performance_engine_sha'].strip()
          equivalence=row['performance_equivalence_run_id'].strip()
          jobs=int(row['benchmark_jobs'])
          headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json'}
          repo=os.environ['GITHUB_REPOSITORY']
          def get_run(run_id):
              with urlopen(Request(f'https://api.github.com/repos/{repo}/actions/runs/{run_id}',headers=headers),timeout=60) as response:
                  return json.load(response)
          eq=get_run(equivalence)
          if eq.get('status')!='completed' or eq.get('conclusion')!='success' or str(eq.get('head_sha'))!=engine:
              raise SystemExit('performance engine lacks successful frozen equivalence proof')
          for _ in range(720):
              source=get_run(source_run)
              if str(source.get('head_sha'))!=source_head:
                  raise SystemExit('accelerated citable run head changed from frozen contract')
              print('accelerated_source',source_run,source.get('status'),source.get('conclusion'))
              if source.get('status')=='completed':
                  if source.get('conclusion')!='success':
                      raise SystemExit(f"accelerated citable source failed: {source.get('conclusion')}")
                  break
              time.sleep(30)
          else:
              raise SystemExit('accelerated citable source did not finish inside gate window')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              out.write(f'source_run_id={source_run}\n')
              out.write(f'source_run_head={source_head}\n')
              out.write(f'governance_sha={governance}\n')
              out.write(f'engine_sha={engine}\n')
              out.write(f'benchmark_jobs={jobs}\n')
          PY
      - name: Checkout frozen scientific governance
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.contract.outputs.governance_sha }}
          path: governance
      - name: Download accepted accelerated citable artifact
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.contract.outputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: citable-product-a-v1-accelerated-resume-*
          path: source_bundle
          merge-multiple: true
      - name: Require exact-semantics citable source and frozen governance
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          import pandas as pd
          root=Path('source_bundle/citable_result')
          contract=json.loads((root/'citable_snapshot_contract.json').read_text(encoding='utf-8'))
          spec=json.loads((root/'pilot_grid_specification.json').read_text(encoding='utf-8'))
          contrast=json.loads((root/'selector_contrast_contract.json').read_text(encoding='utf-8'))
          if contract.get('protocol_version')!='product_a_v1_leakage_safe_M_sensitivity_fixed_sources_accelerated_exact_semantics':
              raise SystemExit('wrong accelerated citable protocol')
          if contract.get('scientific_source_sha')!='${{ steps.contract.outputs.governance_sha }}':
              raise SystemExit('accelerated artifact scientific governance mismatch')
          if contract.get('execution_engine_sha')!='${{ steps.contract.outputs.engine_sha }}' or contract.get('exact_semantics_equivalence') is not True:
              raise SystemExit('accelerated artifact lacks exact-semantics engine proof')
          if contract.get('outer_sealed_before_M') is not True or contract.get('m_grid_as_sensitivity') is not True:
              raise SystemExit('accelerated source lacks strict M semantics')
          if spec.get('outer_sealed_before_M') is not True or spec.get('m_grid_as_sensitivity') is not True:
              raise SystemExit('accelerated grid lacks strict M semantics')
          if int(contract.get('chelsa_probe_failures',1))!=0:
              raise SystemExit('accelerated source CHELSA preflight failed')
          if contrast.get('cross_taxon_selection_data')!='discovery_taxa_only' or contrast.get('local_nested_auc_selection_data')!='validation_species_model_pool_only' or contrast.get('outer_sealed_used_for_selection') is not False:
              raise SystemExit('accelerated selector contrast leaks held-out evidence')
          expected=set(pd.read_csv('governance/configs/product_a_pilot_taxa_v1.csv')['scientific_name'].astype(str))
          gate=pd.read_csv(root/'species_gate.csv')
          eligible=set(gate.loc[gate['eligible'].astype(bool),'species'].astype(str))
          if eligible!=expected: raise SystemExit(f'accelerated source loses taxa: missing={sorted(expected-eligible)}')
          for name in ('product_a_promotion_criteria_v1.csv','product_a_differentiation_criteria_v1.csv'):
              if not (root/name).exists(): raise SystemExit(f'missing frozen criteria: {name}')
          print('accelerated_v4_source_gate_passed',len(expected),'taxa')
          PY

  stability_part:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        seed: [11,22,33,44,55]
        sealed_fraction: ['0.15','0.20','0.30']
    env:
      SDMR_BENCHMARK_JOBS: ${{ needs.source.outputs.benchmark_jobs }}
      SDMR_MODEL_SPEC_JOBS: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - name: Checkout exact-semantics performance engine
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.engine_sha }}
          path: engine
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install engine
        working-directory: engine
        run: python -m pip install -e '.[geo,parquet]'
      - name: Download accepted accelerated source artifact
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ needs.source.outputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: citable-product-a-v1-accelerated-resume-*
          path: source_bundle
          merge-multiple: true
      - name: Full split-specific rerun from same frozen evidence
        run: |
          cd engine
          sdmr-pilot-grid \
            --gbif-download "$GITHUB_WORKSPACE/source_bundle/citable_input/focal.parquet" \
            --gbif-download-key "accelerated-v4:${{ needs.source.outputs.source_run_id }}" \
            --target-group-download "$GITHUB_WORKSPACE/source_bundle/citable_input/target_group.parquet" \
            --target-group-download-key "accelerated-v4:${{ needs.source.outputs.source_run_id }}" \
            --checklist-key 'snapshot-interpreted:2026-08-01' \
            --taxa configs/product_a_pilot_taxa_v1.csv \
            --grid configs/product_a_buffer_specs_v1.csv \
            --manifest configs/chelsa_v2_1_plant_candidates.csv \
            --output-dir "$GITHUB_WORKSPACE/part_result" \
            --m-grid-as-sensitivity \
            --min-occurrences 80 \
            --min-unique-cells 50 \
            --gate-cell-size-degrees 0.05 \
            --spatial-test-fraction '${{ matrix.sealed_fraction }}' \
            --taxon-validation-fraction 0.25 \
            --vif-threshold 5 \
            --max-predictors 8 \
            --random-baseline-repeats 0 \
            --seed '${{ matrix.seed }}'
          sdmr-compare-evaluation \
            --product-a-dir "$GITHUB_WORKSPACE/part_result" \
            --manifest configs/chelsa_v2_1_plant_candidates.csv \
            --canonical-specification buffer_300km
      - name: Require strict split semantics and full panel
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          expected=set(pd.read_csv('engine/configs/product_a_pilot_taxa_v1.csv')['scientific_name'].astype(str))
          gate=pd.read_csv('part_result/species_gate.csv')
          eligible=set(gate.loc[gate['eligible'].astype(bool),'species'].astype(str))
          if eligible!=expected: raise SystemExit(f'split loses taxa: missing={sorted(expected-eligible)}')
          spec=json.loads(Path('part_result/pilot_grid_specification.json').read_text())
          contrast=json.loads(Path('part_result/selector_contrast_contract.json').read_text())
          if spec.get('outer_sealed_before_M') is not True or spec.get('m_grid_as_sensitivity') is not True: raise SystemExit('strict M semantics failed')
          if contrast.get('cross_taxon_selection_data')!='discovery_taxa_only' or contrast.get('local_nested_auc_selection_data')!='validation_species_model_pool_only' or contrast.get('outer_sealed_used_for_selection') is not False: raise SystemExit('selector leak')
          PY
      - name: Freeze part metadata
        if: always()
        run: |
          mkdir -p part_result
          python - <<'PY'
          import json
          from pathlib import Path
          Path('part_result/part_metadata.json').write_text(json.dumps({
            'source_run_id':'${{ needs.source.outputs.source_run_id }}',
            'scientific_governance_sha':'${{ needs.source.outputs.governance_sha }}',
            'performance_engine_sha':'${{ needs.source.outputs.engine_sha }}',
            'seed':int('${{ matrix.seed }}'),
            'sealed_fraction':float('${{ matrix.sealed_fraction }}'),
            'taxon_validation_fraction':0.25,
            'M_background_rebuilt_from_model_pool':True,
            'M_grid_treated_as_sensitivity_not_optimized':True,
            'raw_focal_reprocessed_for_split':True,
            'require_full_predeclared_taxon_panel':True,
            'random_baseline_repeats':0,
            'benchmark_jobs':int('${{ needs.source.outputs.benchmark_jobs }}'),
            'performance_changes_only':True,
          },indent=2,sort_keys=True),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-a-v1-stability-accelerated-v4-${{ matrix.seed }}-${{ matrix.sealed_fraction }}
          path: |
            part_result/part_metadata.json
            part_result/product_a_protocol_choice.txt
            part_result/pilot_grid_specification.json
            part_result/protocol_discovery_summary.csv
            part_result/protocol_validation_metrics.csv
            part_result/protocol_validation_summary.csv
            part_result/protocol_validation_paired_deltas.csv
            part_result/species_gate.csv
            part_result/selector_contrast_contract.json
            part_result/selector_contrast_choices.csv
            part_result/selector_contrast_transfer_summary.csv
            part_result/selector_contrast_paired_deltas.csv
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: [source,stability_part]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout frozen scientific governance code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.governance_sha }}
          path: governance
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen aggregation code
        run: python -m pip install -e governance
      - name: Download all stability parts
        uses: actions/download-artifact@v4
        with:
          pattern: product-a-v1-stability-accelerated-v4-*
          path: stability_parts
      - name: Aggregate without reselection
        run: |
          python governance/scripts/aggregate_leakage_safe_stability.py --parts-root stability_parts --output-dir stability_result
          python governance/scripts/aggregate_selector_contrast.py --parts-root stability_parts --output-dir stability_result
      - name: Download source criteria
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ needs.source.outputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: citable-product-a-v1-accelerated-resume-*
          path: source_bundle
          merge-multiple: true
      - name: Freeze aggregate governance
        run: |
          cp source_bundle/citable_result/citable_snapshot_contract.json stability_result/source_citable_snapshot_contract.json
          cp source_bundle/citable_result/product_a_promotion_criteria_v1.csv stability_result/promotion_criteria_predeclared_before_stability.csv
          cp source_bundle/citable_result/product_a_differentiation_criteria_v1.csv stability_result/differentiation_criteria_predeclared_before_stability.csv
          cat > stability_result/stability_inputs.txt <<EOF
          source_run_id=${{ needs.source.outputs.source_run_id }}
          scientific_governance_sha=${{ needs.source.outputs.governance_sha }}
          performance_engine_sha=${{ needs.source.outputs.engine_sha }}
          exact_semantics_equivalence=true
          seeds=11,22,33,44,55
          sealed_fractions=0.15,0.20,0.30
          taxon_validation_fraction=0.25
          M_grid_as_sensitivity=true
          full_taxon_panel_required=true
          random_baseline_repeats=0
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: product-a-v1-stability-accelerated-v4-aggregate
          path: stability_result/
          if-no-files-found: error
          retention-days: 90

  decide:
    needs: [source,aggregate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout frozen scientific decision code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.governance_sha }}
          path: governance
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen decision code
        run: python -m pip install -e governance
      - name: Download frozen aggregate
        uses: actions/download-artifact@v4
        with:
          name: product-a-v1-stability-accelerated-v4-aggregate
          path: stability_result
      - name: Apply frozen promotion criteria
        run: |
          python - <<'PY'
          import csv,subprocess
          from pathlib import Path
          c={r['criterion']:r['value'] for r in csv.DictReader(Path('stability_result/promotion_criteria_predeclared_before_stability.csv').open(encoding='utf-8'))}
          cmd=['sdmr-promote-protocol','--runs','stability_result/protocol_stability_runs.csv','--choice-stability','stability_result/protocol_choice_stability.csv','--paired-validation-deltas','stability_result/protocol_validation_paired_deltas.csv','--output-dir','decision_result/promotion','--min-protocol-selection-fraction',c['min_protocol_selection_fraction'],'--min-runs-selected',c['min_runs_selected'],'--min-m-spec-win-fraction',c['min_m_spec_win_fraction'],'--min-mean-delta-presence-rank',c['min_mean_delta_presence_rank'],'--min-positive-pair-fraction',c['min_positive_pair_fraction'],'--min-pairs-per-comparator',c['min_pairs_per_comparator'],'--required-comparators',c['required_comparators']]
          r=subprocess.run(cmd,check=False)
          if r.returncode not in (0,2): raise SystemExit(r.returncode)
          print('promotion_exit_code',r.returncode)
          PY
      - name: Apply frozen AUC/Boyce/local-nested differentiation gate
        run: |
          sdmr-assess-differentiation --summary stability_result/selector_contrast_comparator_summary.csv --criteria stability_result/differentiation_criteria_predeclared_before_stability.csv --output-dir decision_result/differentiation
      - name: Write final scientific decision
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          promo=pd.read_csv('decision_result/promotion/promotion_assessment.csv').iloc[0].to_dict()
          diff=json.loads(Path('decision_result/differentiation/product_a_differentiation_result.json').read_text())
          if bool(promo['promoted']) and bool(diff['passes_all_required_comparators']): status='promoted_and_transfer_advantage_supported'
          elif bool(promo['promoted']): status='promoted_but_no_demonstrated_advantage_over_conventional_selectors'
          else: status='promotion_not_met'
          Path('decision_result/product_a_final_decision.json').write_text(json.dumps({
            'status':status,
            'product_a_promoted':bool(promo['promoted']),
            'transfer_advantage_supported':bool(diff['passes_all_required_comparators']),
            'source_run_id':'${{ needs.source.outputs.source_run_id }}',
            'scientific_governance_sha':'${{ needs.source.outputs.governance_sha }}',
            'performance_engine_sha':'${{ needs.source.outputs.engine_sha }}',
            'interpretation':'No post-hoc threshold relaxation; non-promotion and non-differentiation are valid outcomes.'
          },indent=2,sort_keys=True),encoding='utf-8')
          print(status)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: product-a-v1-final-decision-accelerated-v4
          path: decision_result/
          if-no-files-found: error
          retention-days: 90
