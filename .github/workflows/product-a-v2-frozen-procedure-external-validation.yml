name: product-a-v2-frozen-procedure-external-validation

on:
  pull_request:
    paths:
      - 'src/sdmr/prepared_frozen_procedure_validation_cli.py'
      - 'src/sdmr/sealed_evaluation_status.py'
      - 'src/sdmr/prepared_taxon_transfer_eligible_cli.py'
      - 'src/sdmr/prepared_taxon_transfer_cli.py'
      - 'src/sdmr/prepared_recovery_procedure_cli.py'
      - 'src/sdmr/recovery_procedure_fit.py'
      - 'src/sdmr/empirical_audit_space.py'
      - 'tests/test_sealed_evaluation_status.py'
      - 'configs/product_a_v2_empirical_transfer_all12_taxa.csv'
      - 'configs/chelsa_v2_1_plant_candidates.csv'
      - '.github/workflows/product-a-v2-frozen-procedure-external-validation.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: product-a-v2-frozen-procedure-external-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  external-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      STRICT_CACHE_RUN_ID: '31870747020'
      STRICT_CACHE_ARTIFACT_ID: '9244072277'
      ALL12_ELIGIBILITY_RUN_ID: '32023510869'
      ALL12_ELIGIBILITY_ARTIFACT_ID: '9286243005'
      ALL12_ELIGIBILITY_DIGEST: 'sha256:a595dfb687d51c87c0a10c62d75ef5bf2ab02738fea6b1aefa18901edda71d05'
      FROZEN_CORE_RUN_ID: '32022583250'
      FROZEN_CORE_ARTIFACT_ID: '9286108773'
      FROZEN_CORE_DIGEST: 'sha256:2773f7ff530139a6559feed705f453815f5e22c14b205b0117adeb2376e624ef'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package
        run: python -m pip install -e '.[test]'
      - name: Unit-test explicit sealed availability states
        run: pytest -q tests/test_sealed_evaluation_status.py
      - name: Download strict frozen feature cache
        run: |
          rm -rf prepared_feature_cache strict_cache.zip
          mkdir -p prepared_feature_cache
          curl --fail --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$STRICT_CACHE_ARTIFACT_ID/zip" \
            --output strict_cache.zip
          unzip -q strict_cache.zip -d prepared_feature_cache
          test -f prepared_feature_cache/feature_cache_contract.json
      - name: Download immutable all-12 model-free eligibility artifact
        run: |
          rm -rf eligibility_all12 eligibility_all12.zip
          mkdir -p eligibility_all12
          curl --fail --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ALL12_ELIGIBILITY_ARTIFACT_ID/zip" \
            --output eligibility_all12.zip
          unzip -q eligibility_all12.zip -d eligibility_all12
          test -f eligibility_all12/taxon_transfer_spatial_eligibility_contract.json
          test -f eligibility_all12/eligible_taxon_roles.csv
      - name: Download immutable frozen core-procedure artifact
        run: |
          rm -rf frozen_core frozen_core.zip
          mkdir -p frozen_core
          curl --fail --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$FROZEN_CORE_ARTIFACT_ID/zip" \
            --output frozen_core.zip
          unzip -q frozen_core.zip -d frozen_core
          test -f frozen_core/product_a_v2_eligible_taxon_transfer_contract.json
          test -f frozen_core/frozen_discovery_selectors.csv
      - name: Run frozen-procedure external validation
        run: |
          rm -rf frozen_external_validation
          python -m sdmr.prepared_frozen_procedure_validation_cli \
            --prepared-dir prepared_feature_cache \
            --manifest configs/chelsa_v2_1_plant_candidates.csv \
            --candidate-taxa configs/product_a_v2_empirical_transfer_all12_taxa.csv \
            --eligibility-dir eligibility_all12 \
            --frozen-procedure-dir frozen_core \
            --output-dir frozen_external_validation \
            --selector canonical_ecology \
            --canonical-spec buffer_300km \
            --procedure-profile core_l2 \
            --inner-folds 2 \
            --outer-folds 2 \
            --max-predictors 4 \
            --seed 20260814 \
            --source-run-id "$STRICT_CACHE_RUN_ID" \
            --source-artifact-id "$STRICT_CACHE_ARTIFACT_ID" \
            --eligibility-run-id "$ALL12_ELIGIBILITY_RUN_ID" \
            --eligibility-artifact-id "$ALL12_ELIGIBILITY_ARTIFACT_ID" \
            --eligibility-artifact-digest "$ALL12_ELIGIBILITY_DIGEST" \
            --frozen-procedure-run-id "$FROZEN_CORE_RUN_ID" \
            --frozen-procedure-artifact-id "$FROZEN_CORE_ARTIFACT_ID" \
            --frozen-procedure-artifact-digest "$FROZEN_CORE_DIGEST"
      - name: Verify frozen-procedure external-validation contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          import pandas as pd

          root = Path('frozen_external_validation')
          contract = json.loads((root / 'product_a_v2_frozen_procedure_external_validation_contract.json').read_text())
          fit = pd.read_csv(root / 'validation_final_fit_status.csv')
          sealed = pd.read_csv(root / 'validation_outer_sealed.csv')
          provenance = pd.read_csv(root / 'validation_taxon_provenance.csv')

          assert contract['scientific_promotion_run'] is False
          assert contract['selector'] == 'canonical_ecology'
          assert contract['frozen_procedure'] == 'predictive_forward|logit_l2_C1_degree2'
          assert contract['frozen_procedure_selected_before_this_validation'] is True
          assert contract['procedure_reselection_in_external_validation'] is False
          assert contract['target_validation_taxa'] == ['Arabidopsis thaliana', 'Pinus sylvestris', 'Larrea tridentata']
          assert set(contract['fresh_relative_to_source_artifact']) == {'Arabidopsis thaliana', 'Pinus sylvestris'}
          assert contract['previously_exposed_in_source_validation'] == ['Larrea tridentata']
          assert contract['original_panel_index_by_species']['Arabidopsis thaliana'] == 0
          assert contract['original_panel_index_by_species']['Pinus sylvestris'] == 2
          assert contract['original_panel_index_by_species']['Larrea tridentata'] == 6
          assert contract['original_panel_indices_preserved_for_spatial_seeds'] is True
          assert contract['eligibility_applied_before_candidate_model_fitting'] is True
          assert contract['validation_sealed_opened_after_all_validation_fit_attempts'] is True
          assert contract['validation_results_can_change_frozen_procedure'] is False
          assert contract['no_post_validation_fallback_procedure'] is True
          assert contract['sealed_evaluation_unavailability_is_explicit_abstention'] is True
          assert contract['candidate_predictor_universe_size'] == 43
          assert contract['outer_sealed_before_M'] is True
          assert contract['m_grid_as_sensitivity'] is True
          assert contract['hidden_truth_used'] is False
          assert contract['source_run_id'] == '31870747020'
          assert contract['source_artifact_id'] == '9244072277'
          assert contract['eligibility_run_id'] == '32023510869'
          assert contract['eligibility_artifact_id'] == '9286243005'
          assert contract['eligibility_artifact_digest'] == 'sha256:a595dfb687d51c87c0a10c62d75ef5bf2ab02738fea6b1aefa18901edda71d05'
          assert contract['frozen_procedure_run_id'] == '32022583250'
          assert contract['frozen_procedure_artifact_id'] == '9286108773'
          assert contract['frozen_procedure_artifact_digest'] == 'sha256:2773f7ff530139a6559feed705f453815f5e22c14b205b0117adeb2376e624ef'

          assert set(fit['species']) == set(contract['target_validation_taxa'])
          assert fit.groupby('species')['perturbation'].nunique().eq(3).all()
          assert fit['procedure'].dropna().eq(contract['frozen_procedure']).all()
          assert set(provenance.loc[~provenance['source_validation_exposed'].astype(bool), 'species']) == {'Arabidopsis thaliana', 'Pinus sylvestris'}
          assert set(provenance.loc[provenance['source_validation_exposed'].astype(bool), 'species']) == {'Larrea tridentata'}

          n_success = int(fit['final_fit_status'].eq('success').sum())
          assert len(sealed) == n_success
          allowed = {
              'complete',
              'abstain_prediction_evaluation_unavailable',
              'abstain_prediction_metric_nonfinite',
              'partial_prediction_only_ecological_recovery_unavailable',
          }
          assert set(sealed['sealed_evaluation_status']).issubset(allowed)
          for row in sealed.itertuples(index=False):
              if row.sealed_evaluation_status == 'complete':
                  assert np.isfinite(row.presence_rank)
                  assert np.isfinite(row.niche_overlap_schoener_d_pc12)
                  assert np.isfinite(row.centroid_distance)
                  assert np.isfinite(row.breadth_log_sd_error)
                  assert np.isfinite(row.quantile_profile_error)
              if row.sealed_evaluation_status == 'abstain_prediction_evaluation_unavailable':
                  assert row.n_complete_sealed_presence_for_model < 2 or row.n_complete_sealed_background_for_model < 2

          forbidden = {'true_suitability', 'truth_surface_rank', 'driver_process_f1'}
          assert not forbidden.intersection(sealed.columns)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: product-a-v2-frozen-procedure-external-validation
          path: frozen_external_validation/
          if-no-files-found: error
          retention-days: 90
