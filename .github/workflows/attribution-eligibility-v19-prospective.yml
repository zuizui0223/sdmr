name: attribution-eligibility-v19-prospective

on:
  pull_request:
    paths:
      - 'src/sdmr/attribution_eligibility_v19.py'
      - 'src/sdmr/attribution_eligibility_v19_prospective.py'
      - 'configs/attribution_eligibility_v19_classifier.json'
      - 'configs/attribution_eligibility_v19_prospective.json'
      - 'tests/test_attribution_eligibility_v19.py'
      - '.github/workflows/attribution-eligibility-v19-prospective.yml'
  workflow_dispatch:

concurrency:
  group: attribution-eligibility-v19-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e . pytest
      - run: pytest -q tests/test_attribution_eligibility_v19.py

  pretruth-predict:
    needs: gate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        family: [gaussian, asymmetric, soft_threshold, interaction, omitted_driver, observation_confounded]
        process: [temperature, water, seasonality, noise]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e .
      - name: Generate pretruth geometry and frozen eligibility prediction
        run: >-
          python -m sdmr.attribution_eligibility_v19_prospective predict-shard
          --family '${{ matrix.family }}'
          --process '${{ matrix.process }}'
          --output-dir 'pretruth/${{ matrix.family }}__${{ matrix.process }}'
      - uses: actions/upload-artifact@v4
        with:
          name: v19-pretruth-${{ matrix.family }}-${{ matrix.process }}-${{ github.sha }}
          path: pretruth/
          retention-days: 90

  truth-open:
    needs: pretruth-predict
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        family: [gaussian, asymmetric, soft_threshold, interaction, omitted_driver, observation_confounded]
        process: [temperature, water]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e .
      - name: Open fresh context-status truth after all predictions are frozen
        run: >-
          python -m sdmr.attribution_eligibility_v19_prospective truth-shard
          --family '${{ matrix.family }}'
          --process '${{ matrix.process }}'
          --output-dir 'truth/${{ matrix.family }}__${{ matrix.process }}'
      - uses: actions/upload-artifact@v4
        with:
          name: v19-truth-${{ matrix.family }}-${{ matrix.process }}-${{ github.sha }}
          path: truth/
          retention-days: 90

  terminal:
    needs: [pretruth-predict, truth-open]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: v19-pretruth-*-${{ github.sha }}
          path: collected/pretruth
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: v19-truth-*-${{ github.sha }}
          path: collected/truth
          merge-multiple: true
      - name: Terminal prospective decision
        run: >-
          python -m sdmr.attribution_eligibility_v19_prospective terminal
          --prediction-dir collected/pretruth
          --truth-dir collected/truth
          --output-dir terminal
      - uses: actions/upload-artifact@v4
        with:
          name: v19-prospective-terminal-${{ github.sha }}
          path: terminal/
          retention-days: 90
