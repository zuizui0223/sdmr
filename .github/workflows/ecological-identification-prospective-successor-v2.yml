name: ecological-identification-prospective-successor-v2

on:
  push:
    branches: [main]
    paths:
      - configs/ecological_identification_learner_validation_successor_v2_trigger.txt

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  BLIS_NUM_THREADS: "1"

jobs:
  fit-family:
    name: fit successor r${{ matrix.replicate }} ${{ matrix.family }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        replicate: [1, 2]
        family:
          - gaussian
          - asymmetric
          - soft_threshold
          - interaction
          - omitted_driver
          - observation_confounded
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install -e '.[test]'
      - name: Fit frozen successor nontruth family denominator
        run: |
          python -m sdmr.prospective_identification_successor_v2 fit-family \
            --family '${{ matrix.family }}' \
            --replicate '${{ matrix.replicate }}' \
            --output-dir 'out/r${{ matrix.replicate }}-${{ matrix.family }}'
      - name: Upload successor nontruth family artifact
        uses: actions/upload-artifact@v4
        with:
          name: prospective-identification-successor-v2-r${{ matrix.replicate }}-${{ matrix.family }}
          path: out/r${{ matrix.replicate }}-${{ matrix.family }}
          retention-days: 30
          if-no-files-found: error

  terminal-evaluator:
    name: successor terminal truth evaluator
    needs: fit-family
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install -e '.[test]'
      - name: Download all frozen successor nontruth artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: prospective-identification-successor-v2-r*
          path: inputs
          merge-multiple: false
      - name: Normalize intentionally empty audit CSVs
        run: |
          find inputs -type f -name '*.csv' -size -2c -print0 | while IFS= read -r -d '' file; do
            printf '__empty__\n' > "$file"
          done
      - name: Open process truth and evaluate unchanged successor criteria
        run: |
          python -m sdmr.prospective_identification_successor_v2 evaluate \
            --input-dir inputs \
            --output-dir decision
          cat decision/scientific_decision.json
      - name: Upload successor terminal decision or technical terminal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prospective-identification-successor-v2-decision
          path: decision
          retention-days: 90
          if-no-files-found: error
