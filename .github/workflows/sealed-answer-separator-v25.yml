name: sealed-answer-separator-v25

on:
  pull_request:
    paths:
      - 'src/sdmr/sealed_answer_separator_v25.py'
      - 'tests/test_sealed_answer_separator_v25.py'
      - '.github/workflows/sealed-answer-separator-v25.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e . pytest
      - run: pytest -q tests/test_sealed_answer_separator_v25.py
