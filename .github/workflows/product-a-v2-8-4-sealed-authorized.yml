name: Product-A v2.8.4 authorized sealed one-shot

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: product-a-v2-8-4-authorized-sealed-one-shot
  cancel-in-progress: false

jobs:
  authorization-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      authorization_digest: ${{ steps.freeze.outputs.authorization_digest }}
      caller_sha256: ${{ steps.freeze.outputs.caller_sha256 }}
      reusable_sha256: ${{ steps.freeze.outputs.reusable_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - id: freeze
        name: Verify final no-value-read recovery authorization before calling sealed workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_REF: ${{ github.ref }}
          CURRENT_EVENT: ${{ github.event_name }}
          CURRENT_SHA: ${{ github.sha }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          CURRENT_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import time
          import urllib.request
          from pathlib import Path

          expected_ref='refs/heads/frozen/product-a-v2-8-4-sealed-v1-no-value-read-recovery-1'
          implementation_ref='a12816a774f23e86ae52902cef6e2e47c61bd852'
          first_run_id=33309627503
          second_run_id=33311324330
          first_sha='ba12f96be48545819a72fc714f083cd5c00520ad'
          second_sha='586700d531fb815fa452e3a8ca31f4c97e070443'
          first_ref='frozen/product-a-v2-8-4-sealed-v1'
          second_ref='frozen/product-a-v2-8-4-sealed-v1-pre-read-recovery-1'
          workflow_path='.github/workflows/product-a-v2-8-4-sealed-reusable.yml'
          caller_workflow_path='.github/workflows/product-a-v2-8-4-sealed-authorized.yml'
          caller_path=Path(caller_workflow_path)
          auth_path=Path('configs/product_a_v2_8_4_sealed_execution_authorization.json')

          if os.environ['CURRENT_REF'] != expected_ref or os.environ['CURRENT_EVENT'] != 'workflow_dispatch':
              raise SystemExit('Product-A v2.8.4 final sealed recovery is frozen-ref/manual-dispatch only')
          if os.environ['CURRENT_RUN_ATTEMPT'] != '1':
              raise SystemExit('Product-A v2.8.4 final sealed recovery forbids same-run job retry')
          actual=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          if actual != os.environ['CURRENT_SHA']:
              raise SystemExit('Product-A v2.8.4 final recovery caller checkout identity changed')

          auth=json.loads(auth_path.read_text(encoding='utf-8'))
          if auth.get('authorized_ref') != expected_ref or auth.get('one_shot') is not True:
              raise SystemExit('Product-A v2.8.4 final recovery authorization ref/one-shot identity changed')
          if int(auth.get('operational_attempt',-1)) != 3:
              raise SystemExit('Product-A v2.8.4 final recovery operational attempt changed')
          recovery=auth.get('post_entry_no_value_read_recovery',{})
          expected_recovery={
              'authorized':True,
              'prior_workflow_run_id':second_run_id,
              'prior_workflow_run_attempt':1,
              'prior_head_sha':second_sha,
              'prior_head_ref':'refs/heads/'+second_ref,
              'prior_run_conclusion':'failure',
              'prior_failure_fingerprint':"ModuleNotFoundError: No module named 'rasterio'",
              'prior_sealed_read_entered':True,
              'prior_sealed_environment_read':False,
              'prior_sealed_audit_completed':False,
              'prior_terminal_scientific_decision_exists':False,
              'prior_scientific_evidence_reused_or_reinterpreted':False,
              'additional_scientific_attempt_created':False,
              'recovery_change_scope':'hash_locked_geo_extension_and_rasterio_import_gate_only',
          }
          for key,value in expected_recovery.items():
              if recovery.get(key) != value:
                  raise SystemExit(f'Product-A v2.8.4 final recovery identity changed: {key}')
          if auth.get('implementation_identity',{}).get('runtime_ref') != implementation_ref:
              raise SystemExit('Product-A v2.8.4 final recovery implementation ref changed')

          embedded=auth.pop('authorization_receipt_digest')
          canonical=json.dumps(auth,sort_keys=True,separators=(',',':')).encode()
          if hashlib.sha256(canonical).hexdigest() != embedded:
              raise SystemExit('Product-A v2.8.4 final recovery authorization digest changed')
          caller_sha=hashlib.sha256(caller_path.read_bytes().replace(b'\r\n',b'\n')).hexdigest()
          if caller_sha != auth['authorized_caller']['newline_canonical_sha256']:
              raise SystemExit('Product-A v2.8.4 final recovery caller workflow changed')
          reusable=subprocess.check_output(['git','show',f'{implementation_ref}:{workflow_path}']).replace(b'\r\n',b'\n')
          reusable_sha=hashlib.sha256(reusable).hexdigest()
          if reusable_sha != auth['implementation_identity']['sealed_reusable_workflow_sha256']:
              raise SystemExit('Product-A v2.8.4 final recovery reusable workflow changed')

          headers={
              'Authorization':f"Bearer {os.environ['GH_TOKEN']}",
              'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28',
          }
          api=f"https://api.github.com/repos/{os.environ['REPOSITORY']}"

          def get_json(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=30) as response:
                  return json.load(response)

          runs_url=(
              f'{api}/actions/workflows/product-a-v2-8-4-sealed-authorized.yml/runs'
              '?event=workflow_dispatch&per_page=100'
          )
          runs=None
          for _ in range(30):
              candidate=get_json(runs_url)
              rows=list(candidate.get('workflow_runs',[]))
              ids={int(row['id']) for row in rows}
              expected_ids={first_run_id,second_run_id,int(os.environ['CURRENT_RUN_ID'])}
              if int(candidate.get('total_count',-1)) == 3 and len(rows) == 3 and ids == expected_ids:
                  runs=candidate
                  break
              if int(candidate.get('total_count',-1)) > 3 or len(rows) > 3:
                  raise SystemExit(f'Product-A v2.8.4 sealed dispatch count exceeded final boundary: {sorted(ids)}')
              time.sleep(2)
          if runs is None:
              raise SystemExit('Product-A v2.8.4 exact three-run final recovery identity did not materialize')

          by_id={int(row['id']):row for row in runs['workflow_runs']}
          expected_runs={
              first_run_id:{
                  'event':'workflow_dispatch','status':'completed','conclusion':'failure',
                  'head_branch':first_ref,'head_sha':first_sha,'path':caller_workflow_path,
                  'run_attempt':1,'run_number':1,
              },
              second_run_id:{
                  'event':'workflow_dispatch','status':'completed','conclusion':'failure',
                  'head_branch':second_ref,'head_sha':second_sha,'path':caller_workflow_path,
                  'run_attempt':1,'run_number':2,
              },
              int(os.environ['CURRENT_RUN_ID']):{
                  'event':'workflow_dispatch','head_branch':expected_ref.removeprefix('refs/heads/'),
                  'head_sha':os.environ['CURRENT_SHA'],'path':caller_workflow_path,
                  'run_attempt':1,'run_number':3,
              },
          }
          for run_id,expected in expected_runs.items():
              for key,value in expected.items():
                  if by_id[run_id].get(key) != value:
                      raise SystemExit(f'Product-A v2.8.4 run identity changed: {run_id} {key}')

          first_jobs=get_json(f'{api}/actions/runs/{first_run_id}/jobs?per_page=100')
          first_job_by_id={int(row['id']):row for row in first_jobs.get('jobs',[])}
          first_expected_jobs={
              99252220557:('authorization-preflight','success'),
              99252233545:('sealed / authorization-and-receipt-preflight','failure'),
              99252247454:('sealed / sealed-part','skipped'),
              99252247966:('sealed / aggregate-decision','skipped'),
          }
          if int(first_jobs.get('total_count',-1)) != 4 or set(first_job_by_id) != set(first_expected_jobs):
              raise SystemExit(f'Product-A v2.8.4 first-run job denominator changed: {sorted(first_job_by_id)}')
          for job_id,(name,conclusion) in first_expected_jobs.items():
              row=first_job_by_id[job_id]
              if row.get('name') != name or row.get('conclusion') != conclusion:
                  raise SystemExit(f'Product-A v2.8.4 first-run job identity changed: {job_id}')
          first_artifacts=get_json(f'{api}/actions/runs/{first_run_id}/artifacts?per_page=100')
          if int(first_artifacts.get('total_count',-1)) != 0 or first_artifacts.get('artifacts'):
              raise SystemExit('Product-A v2.8.4 first failed run unexpectedly has artifacts')

          second_jobs=get_json(f'{api}/actions/runs/{second_run_id}/jobs?per_page=100')
          second_job_by_id={int(row['id']):row for row in second_jobs.get('jobs',[])}
          second_expected_jobs={
              99256796636:('authorization-preflight','success'),
              99256808858:('sealed / authorization-and-receipt-preflight','success'),
              99256889933:('sealed / sealed-part (2026082201, 33155966119)','failure'),
              99256889980:('sealed / sealed-part (2026082202, 33155969410)','failure'),
              99256889947:('sealed / sealed-part (2026082203, 33155971954)','failure'),
              99257003805:('sealed / aggregate-decision','skipped'),
          }
          if int(second_jobs.get('total_count',-1)) != 6 or set(second_job_by_id) != set(second_expected_jobs):
              raise SystemExit(f'Product-A v2.8.4 second-run job denominator changed: {sorted(second_job_by_id)}')
          for job_id,(name,conclusion) in second_expected_jobs.items():
              row=second_job_by_id[job_id]
              if row.get('name') != name or row.get('conclusion') != conclusion:
                  raise SystemExit(f'Product-A v2.8.4 second-run job identity changed: {job_id}')
          preflight_steps={str(step.get('name')):str(step.get('conclusion')) for step in second_job_by_id[99256808858].get('steps',[])}
          if preflight_steps.get('Validate all three reviewed receipt artifacts and build truth-blind input gate') != 'success':
              raise SystemExit('Product-A v2.8.4 second-run receipt barrier changed')
          for job_id in (99256889933,99256889980,99256889947):
              steps={str(step.get('name')):str(step.get('conclusion')) for step in second_job_by_id[job_id].get('steps',[])}
              if steps.get('Verify exactly 15 receipt-pinned input artifacts before any download') != 'success':
                  raise SystemExit(f'Product-A v2.8.4 second-run input denominator changed: {job_id}')
              if steps.get('Enter the one-shot sealed read and finalize this part') != 'failure':
                  raise SystemExit(f'Product-A v2.8.4 second-run failure step changed: {job_id}')

          second_artifacts=get_json(f'{api}/actions/runs/{second_run_id}/artifacts?per_page=100')
          artifact_by_id={int(row['id']):row for row in second_artifacts.get('artifacts',[])}
          expected_artifacts={
              9732069061:('product-a-v2-8-4-sealed-preflight',2961,'sha256:7518179ecca4d562a08c844bbc27917796cb173b078fcb49b646c973c592977d'),
              9732079692:('product-a-v2-8-4-sealed-state-2026082201',4736,'sha256:dc40265b995c8f698cfd43d8a6ce195ae931493df4b1c4dd741da2bd21cdca61'),
              9732079619:('product-a-v2-8-4-sealed-state-2026082202',4725,'sha256:faa997c032c86feaf6f99c112e27224ca612609d3200a81e8c7beb13845eae7b'),
              9732081137:('product-a-v2-8-4-sealed-state-2026082203',4739,'sha256:b4e8a95abf3457deb2a3eec30ead9ab94cda2d6dfe45c049fc1bca6b14a1a6b7'),
          }
          if int(second_artifacts.get('total_count',-1)) != 4 or set(artifact_by_id) != set(expected_artifacts):
              raise SystemExit(f'Product-A v2.8.4 second-run artifact denominator changed: {sorted(artifact_by_id)}')
          for artifact_id,(name,size,digest) in expected_artifacts.items():
              row=artifact_by_id[artifact_id]
              if row.get('name') != name or int(row.get('size_in_bytes',-1)) != size or row.get('digest') != digest or row.get('expired') is not False:
                  raise SystemExit(f'Product-A v2.8.4 second-run artifact identity changed: {artifact_id}')

          policy=auth.get('one_shot_dispatch_policy',{})
          expected_policy={
              'exact_workflow_dispatch_run_count_after_recovery_dispatch':3,
              'both_prior_failure_runs_are_exactly_pinned':True,
              'current_recovery_run_must_be_the_only_third_dispatch':True,
              'fourth_workflow_dispatch_run_forbidden':True,
              'failed_job_retry_within_recovery_run_allowed':False,
          }
          if policy != expected_policy:
              raise SystemExit('Product-A v2.8.4 final recovery dispatch policy changed')

          execution=auth['execution_boundary']
          for key in ('sealed_workflow_implemented_and_reviewed','sealed_execution_authorization_exists','sealed_execution_allowed','workflow_dispatch_allowed'):
              if execution.get(key) is not True:
                  raise SystemExit(f'Product-A v2.8.4 final sealed recovery authorization closed: {key}')
          for key in ('sealed_ecological_outcomes_read','scientific_promotion_allowed','product_b_unblocked'):
              if execution.get(key) is not False:
                  raise SystemExit(f'Product-A v2.8.4 final sealed recovery crossed boundary: {key}')

          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as handle:
              handle.write(f'authorization_digest={embedded}\n')
              handle.write(f'caller_sha256={caller_sha}\n')
              handle.write(f'reusable_sha256={reusable_sha}\n')
          PY

  sealed:
    needs: authorization-preflight
    uses: zuizui0223/sdmr/.github/workflows/product-a-v2-8-4-sealed-reusable.yml@a12816a774f23e86ae52902cef6e2e47c61bd852
    with:
      implementation_ref: a12816a774f23e86ae52902cef6e2e47c61bd852
      reusable_workflow_sha256: ${{ needs.authorization-preflight.outputs.reusable_sha256 }}
      authorization_commit_sha: ${{ github.sha }}
      caller_workflow_sha256: ${{ needs.authorization-preflight.outputs.caller_sha256 }}
      sealed_authorization_receipt_digest: ${{ needs.authorization-preflight.outputs.authorization_digest }}
    secrets: inherit
