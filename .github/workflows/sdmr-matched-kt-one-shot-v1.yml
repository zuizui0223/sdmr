name: SDMR matched known-truth split v1 one-shot prospective
on:
  push:
    branches: [development/sdmr-matched-kt-split-v1]
    paths:
      - 'configs/sdmr_matched_kt_split_activate.lock'
permissions:
  contents: read
  actions: read
concurrency:
  group: sdmr-matched-kt-prospective-v1
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen numeric packages
        run: |
          python -m pip install -e '.[test,parquet]'
          python -m pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0
      - name: Enforce one-shot source freeze before accessing seeds
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          c=json.loads(Path('configs/sdmr_matched_kt_split_v1.json').read_text())
          e=json.loads(Path('configs/sdmr_matched_kt_split_execution_v1.json').read_text())
          assert c['status']=='preregistered_before_any_new_seed_outcome'
          assert c['seeds']==[91001,91002,91003]
          assert len(c['worlds'])==8
          assert c['denominators']['world_seed_cases']==24
          assert c['denominators']['finite_fits']==2016
          assert e['status']=='frozen_source_before_target_outcomes'
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','HEAD^^')==e['code_frozen_commit']
          assert git('diff-tree','--no-commit-id','--name-only','-r','HEAD^').splitlines()==['configs/sdmr_matched_kt_split_execution_v1.json']
          paths=git('diff-tree','--no-commit-id','--name-only','-r','HEAD').splitlines()
          assert paths==['configs/sdmr_matched_kt_split_activate.lock'],paths
          for path,sha in e['blob_sha'].items():
              assert git('hash-object',path)==sha,path
          print('No prospective target seed has been opened before this frozen one-shot run')
          PY
          pytest -q tests/test_matched_kt_core.py tests/test_matched_kt_aggregate.py
  case:
    needs: preflight
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        seed: [91001, 91002, 91003]
        world: [unique_process, redundant_representation, shared_carrier, null_correlated, interaction, observation_confounded, omitted_driver, geographic_shift]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -e '.[parquet]'
          python -m pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0
      - name: Fit frozen learners before truth opening (declared world × seed)
        run: >-
          python experiments/matched_kt_split_v1.py
          --config configs/sdmr_matched_kt_split_v1.json
          --world ${{ matrix.world }}
          --seed ${{ matrix.seed }}
          --output-dir results/case
          --prospective
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdmr-matched-kt-case-${{ matrix.world }}-${{ matrix.seed }}
          path: results/case/
          if-no-files-found: warn
          retention-days: 90
  aggregate:
    needs: [preflight, case]
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -e '.[test,parquet]'
          python -m pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0
      - uses: actions/download-artifact@v4
        with:
          pattern: sdmr-matched-kt-case-*
          path: results/case_parts
          merge-multiple: false
      - name: Independently evaluate entire frozen denominator
        run: >-
          python experiments/matched_kt_aggregate_v1.py
          --input-root results/case_parts
          --config configs/sdmr_matched_kt_split_v1.json
          --output results/aggregate.json
      - name: Ensure this study does not silently promote original M5 or v5
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('configs/sdmr_matched_kt_split_v1.json').read_text())
          a=json.loads(Path('results/aggregate.json').read_text())
          assert a['status']=='complete_scientific_outcome_not_promotion'
          assert a['original_v5_promotion']=='failed_closed'
          assert a['no_threshold_changes'] and a['no_favorable_seed_selection']
          assert len(a['source_receipts'])==24
          assert a['declared_fit_count']==2016
          assert a['summary']['paired_world_seed_cases']==24
          assert a['summary']['oracle_target_cells']==144
          for mode in ('random_cell','spatial'):
              assert a['summary'][mode]['denominator']==144
          print('All 24 cases and 144 reference cells retained. No original-v5 rescue.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sdmr-matched-kt-v1-prospective-summary
          path: results/aggregate.json
          if-no-files-found: error
          retention-days: 90
