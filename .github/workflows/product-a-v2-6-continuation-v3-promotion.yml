name: product-a-v2-6-continuation-v3-promotion

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - name: Validate frozen continuation v3 promotion contract
        run: |
          pytest -q tests/test_v2_6_continuation_v3_promotion.py
          python - <<'PY'
          from sdmr.v2_6_continuation_v3_promotion import load_continuation_v3_promotion_contract
          c=load_continuation_v3_promotion_contract('configs/product_a_v2_6_continuation_v3_promotion_contract.json')
          assert c['contract_frozen_before_continuation_v3_sealed_outcome'] is True
          assert c['new_postoutcome_scientific_thresholds'] is False
          PY
      - name: Verify exact sources and download frozen decisions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/cont3_run_id
          import json, os, urllib.request
          from sdmr.v2_6_continuation_v3_promotion import load_continuation_v3_promotion_contract
          c=load_continuation_v3_promotion_contract('configs/product_a_v2_6_continuation_v3_promotion_contract.json')
          src=c['independent_empirical_continuation_v3_source']
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'sdmr-v26-cont3-promotion'}
          api=f'https://api.github.com/repos/{repo}'
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=60) as r:
                  return json.loads(r.read())
          kt=get(f'{api}/actions/artifacts/9364873176')
          assert kt['name']=='product-a-v2-6-fresh-validation-decision'
          assert kt.get('digest')=='sha256:78cda9c4c1e8a0ddab8371bf324d214cc9b8a76d1ebd65ad562da6de5913e3ba'
          assert int(kt['workflow_run']['id'])==32251711573
          p=get(f"{api}/actions/workflows/{src['workflow_file']}/runs?event=workflow_dispatch&per_page=100")
          matches=[r for r in p.get('workflow_runs',[]) if str(r.get('head_sha'))==src['implementation_sha'] and str(r.get('head_branch'))==src['frozen_ref'] and str(r.get('event'))=='workflow_dispatch']
          if len(matches)!=1: raise SystemExit(f'expected exactly one cont3 run, found {len(matches)}')
          run=matches[0]
          if run.get('status')!='completed' or run.get('conclusion')!='success':
              raise SystemExit(f'cont3 run is not successful: {run.get("status")}/{run.get("conclusion")}')
          artifacts=[]
          for page in range(1,5):
              q=get(f"{api}/actions/runs/{run['id']}/artifacts?per_page=100&page={page}")
              batch=q.get('artifacts',[]); artifacts.extend(batch)
              if len(batch)<100: break
          found=[a for a in artifacts if a.get('name')==src['artifact_name'] and not a.get('expired')]
          if len(found)!=1: raise SystemExit(f'expected one cont3 decision artifact, found {len(found)}')
          print(int(run['id']))
          PY
          CONT3_RUN_ID=$(cat /tmp/cont3_run_id)
          mkdir -p sources/a_known_truth sources/a_empirical
          gh run download 32251711573 --repo "$GITHUB_REPOSITORY" --name product-a-v2-6-fresh-validation-decision --dir sources/a_known_truth
          gh run download "$CONT3_RUN_ID" --repo "$GITHUB_REPOSITORY" --name product-a-v2-6-independent-empirical-confirmation-decision-continuation-v2 --dir sources/a_empirical
      - name: Apply frozen promotion gate only
        run: |
          python -m sdmr.v2_6_continuation_v3_promotion \
            --contract configs/product_a_v2_6_continuation_v3_promotion_contract.json \
            --known-truth-dir sources/a_known_truth \
            --empirical-continuation-dir sources/a_empirical \
            --output-dir promotion
          cat promotion/decision.csv
          cat promotion/contract.json
      - uses: actions/upload-artifact@v4
        with:
          name: product-a-v2-6-continuation-v3-promotion-decision
          path: promotion/
          retention-days: 90
