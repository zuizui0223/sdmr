name: product-a-v1-target-cache

on:
  push:
    branches:
      - agent/nested-spatial-raster-benchmark
    paths:
      - 'configs/product_a_v1_target_cache_trigger.txt'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: product-a-v1-target-cache
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install cloud dependencies
        run: python -m pip install -e '.[cloud,parquet]'
      - name: Read frozen snapshot contract
        run: |
          python - <<'PY'
          import csv, os
          from pathlib import Path
          rows = list(csv.DictReader(Path('configs/gbif_snapshot_v1.csv').open(encoding='utf-8')))
          if len(rows) != 1:
              raise SystemExit('expected exactly one frozen snapshot row')
          row = rows[0]
          for key in ('snapshot_date','snapshot_doi','citation_sha256'):
              if not str(row.get(key,'')).strip():
                  raise SystemExit(f'snapshot contract missing {key}')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f"SNAPSHOT_DATE={row['snapshot_date'].strip()}\n")
              env.write(f"SNAPSHOT_DOI={row['snapshot_doi'].strip()}\n")
              env.write(f"CITATION_SHA256={row['citation_sha256'].strip().lower()}\n")
          PY
      - name: Materialize global minimal Plantae sampling-effort footprint
        run: |
          mkdir -p target_cache
          sdmr-gbif-target-footprint \
            --snapshot-date "$SNAPSHOT_DATE" \
            --snapshot-doi "$SNAPSHOT_DOI" \
            --region us-east-1 \
            --grid-cell-degrees 0.05 \
            --output target_cache/target_group.parquet \
            --provenance target_cache/target_group.provenance.csv
      - name: Verify target-group contract and record cache manifest
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          import pandas as pd

          path = Path('target_cache/target_group.parquet')
          prov_path = Path('target_cache/target_group.provenance.csv')
          citation_path = Path('target_cache/target_group.parquet.citation.txt')
          if not path.exists() or not prov_path.exists() or not citation_path.exists():
              raise SystemExit('target-group cache is incomplete')
          sha = hashlib.sha256(path.read_bytes()).hexdigest()
          citation_sha = hashlib.sha256(citation_path.read_bytes()).hexdigest()
          prov = pd.read_csv(prov_path).iloc[0].to_dict()
          if str(prov.get('sha256','')).lower() != sha:
              raise SystemExit('target-group provenance SHA mismatch')
          if citation_sha != os.environ['CITATION_SHA256']:
              raise SystemExit('target-group citation SHA mismatch')
          if str(prov.get('snapshot_citation_sha256','')).lower() != citation_sha:
              raise SystemExit('target-group provenance citation SHA mismatch')
          if str(prov.get('cloud_provider','')).lower() != 'aws':
              raise SystemExit('target-group cache must use hardened AWS transport')
          if str(prov.get('sampling_mode','')) != 'global_one_per_grid_cell_sampling_footprint':
              raise SystemExit('target-group cache is not the focal-independent global footprint')
          if abs(float(prov.get('one_per_grid_cell_degrees',0)) - 0.05) > 1e-12:
              raise SystemExit('target-group footprint grid differs from frozen 0.05-degree contract')
          df = pd.read_parquet(path, columns=['species'])
          manifest = {
              'protocol_source': 'product_a_v1_global_target_group_footprint',
              'snapshot_date': os.environ['SNAPSHOT_DATE'],
              'snapshot_doi': os.environ['SNAPSHOT_DOI'],
              'citation_sha256': citation_sha,
              'target_sha256': sha,
              'target_query_sha256': str(prov.get('query_sha256','')),
              'target_rows': int(len(df)),
              'target_species': int(df['species'].nunique()),
              'sampling_mode': str(prov.get('sampling_mode','')),
              'one_per_grid_cell_degrees': float(prov.get('one_per_grid_cell_degrees')),
              'source_independent_of_focal_occurrences': True,
              'cloud_provider': str(prov.get('cloud_provider','')),
              'http_keep_alive': prov.get('http_keep_alive'),
              'http_retries': prov.get('http_retries'),
              'http_retry_wait_ms': prov.get('http_retry_wait_ms'),
              'http_retry_backoff': prov.get('http_retry_backoff'),
              'http_timeout': prov.get('http_timeout'),
          }
          Path('target_cache/target_cache_manifest.json').write_text(json.dumps(manifest, indent=2, sort_keys=True), encoding='utf-8')
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: product-a-v1-target-cache-${{ env.SNAPSHOT_DATE }}
          path: target_cache/
          if-no-files-found: error
          retention-days: 90
