name: attribution-eligibility-v18-development

on:
  pull_request:
    paths:
      - 'src/sdmr/attribution_eligibility_v18_development.py'
      - 'configs/attribution_eligibility_v18_development.json'
      - 'tests/test_attribution_eligibility_v18_development.py'
      - '.github/workflows/attribution-eligibility-v18-development.yml'
  workflow_dispatch:

concurrency:
  group: attribution-eligibility-v18-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e . pytest
      - run: pytest -q tests/test_attribution_eligibility_v18_development.py tests/test_context_geometry_v17.py tests/test_context_geometry_v17_development.py

  evaluate:
    needs: gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e .
      - name: Generate frozen v17 geometry for all consumed families
        shell: bash
        run: |
          set -euo pipefail
          families=(gaussian asymmetric soft_threshold interaction omitted_driver observation_confounded)
          for family in "${families[@]}"; do
            python -m sdmr.attribution_eligibility_v18_development fit-family \
              --family "$family" \
              --output-dir "inputs/$family"
          done
      - name: Aggregate v18 eligibility evaluation
        run: python -m sdmr.attribution_eligibility_v18_development aggregate --input-dir inputs --output-dir development
      - uses: actions/upload-artifact@v4
        with:
          name: attribution-eligibility-v18-development-${{ github.sha }}
          path: development/
          retention-days: 90
