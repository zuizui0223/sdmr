name: density-ratio-v4-concordance-diagnostic

on:
  pull_request:
    paths:
      - 'src/sdmr/density_ratio_concordance_diagnostic.py'
      - 'configs/density_ratio_concordance_diagnostic.json'
      - '.github/workflows/density-ratio-concordance-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  VECLIB_MAXIMUM_THREADS: '1'
  BLIS_NUM_THREADS: '1'

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package
        run: python -m pip install -e '.[test]'
      - name: Download fixed v4 development artifact
        uses: actions/download-artifact@v4
        with:
          name: density-ratio-process-challenge-v4-development-only
          path: v4-input
          repository: zuizui0223/sdmr
          run-id: 34024183605
          github-token: ${{ github.token }}
      - name: Run all-changed-cell concordance diagnostic
        run: python -m sdmr.density_ratio_concordance_diagnostic --process-file v4-input/process_evaluation.csv --output-dir concordance
      - name: Show concordance decision
        run: cat concordance/concordance_decision.json
      - name: Upload concordance diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: density-ratio-v4-concordance-diagnostic-only
          path: concordance/
          retention-days: 30
          if-no-files-found: error
