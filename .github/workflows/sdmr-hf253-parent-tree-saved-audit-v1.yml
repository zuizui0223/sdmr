name: HF253 parent-tree original saved-source arithmetic audit (zero source GET)

on:
  pull_request:
    paths:
      - 'scripts/audit_hf253_hf453_parent_tree_saved_v1.py'
      - 'tests/test_audit_hf253_hf453_parent_tree_saved_v1.py'
      - 'evidence/hf253_hf453_parent_tree_grain_v1.json'
      - 'evidence/hf253_hf453_original_stem_tag_crosswalk_v2.json'
      - '.github/workflows/sdmr-hf253-parent-tree-saved-audit-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-only-reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test saved-source unit counts and fail-closed mutations with no original GET
        run: |
          python -m pip install 'pytest>=8,<10'
          python -m pytest -q tests/test_audit_hf253_hf453_parent_tree_saved_v1.py
      - name: Independently recompute original stem-parent source identity arithmetic
        run: |
          python scripts/audit_hf253_hf453_parent_tree_saved_v1.py \
            --parent evidence/hf253_hf453_parent_tree_grain_v1.json \
            --crosswalk evidence/hf253_hf453_original_stem_tag_crosswalk_v2.json \
            --out artifacts/hf253_parent_source_saved_arithmetic_v1.json
      - name: Retain only source-checkpoint arithmetic with zero biology
        run: |
          python - <<'PY'
          import json
          d=json.load(open('artifacts/hf253_parent_source_saved_arithmetic_v1.json'))
          assert d['status']=='source_only_original_unit_arithmetic_reconciled'
          assert d['n_original_stem_tags']==30808
          assert d['n_distinct_parent_tree_id_candidates']==27688
          assert d['n_extra_stems_vs_parent_ids']==3120
          assert d['n_parent_tree_ids_with_multiple_matched_stems']==2331
          assert d['n_stem_tags_in_multistem_parent_ids']==5451
          assert d['n_stems_in_fiveplus_parent_ids']==285
          assert not d['original_HF253_CSV_opened']
          assert not d['original_HF453_CSV_opened']
          assert not d['biological_values_opened']
          assert d['models_fit']==0
          assert not d['new_biological_or_causal_claim']
          assert not d['independent_forest_replication']
          assert not d['Product_B_unblocked']
          PY
      - name: Archive evidence consistency only, not a second source opening
        uses: actions/upload-artifact@v4
        with:
          name: sdmr-hf253-parent-source-counts-arithmetic-only-v1
          path: artifacts/hf253_parent_source_saved_arithmetic_v1.json
          if-no-files-found: error
          retention-days: 90
