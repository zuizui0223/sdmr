name: product-a-v1-evidence-orchestrator-v3

on:
  push:
    branches:
      - agent/nested-spatial-raster-benchmark
    paths:
      - 'configs/product_a_v1_stability_engine_v3.csv'
      - '.github/workflows/product-a-v1-evidence-orchestrator-v3.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: product-a-v1-evidence-orchestrator-v3
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      source_run_id: ${{ steps.contract.outputs.source_run_id }}
      source_sha: ${{ steps.contract.outputs.source_sha }}
      engine_sha: ${{ steps.contract.outputs.engine_sha }}
      benchmark_jobs: ${{ steps.contract.outputs.benchmark_jobs }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind v3 execution contract and require proven exact-semantics engine
        id: contract
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import csv, json, os, time
          from pathlib import Path
          from urllib.request import Request, urlopen

          rows = list(csv.DictReader(Path('configs/product_a_v1_stability_engine_v3.csv').open(encoding='utf-8')))
          if len(rows) != 1:
              raise SystemExit('v3 stability engine config must contain exactly one row')
          row = rows[0]
          source_run = row['source_citable_run_id'].strip()
          source_sha = row['source_analysis_sha'].strip()
          engine_sha = row['performance_engine_sha'].strip()
          equivalence_run = row['performance_equivalence_run_id'].strip()
          jobs = int(row['benchmark_jobs'])
          if jobs < 1:
              raise SystemExit('benchmark_jobs must be >=1')

          headers = {
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
          }
          repo = os.environ['GITHUB_REPOSITORY']
          def get_run(run_id):
              url = f'https://api.github.com/repos/{repo}/actions/runs/{run_id}'
              with urlopen(Request(url, headers=headers), timeout=60) as response:
                  return json.load(response)

          eq = get_run(equivalence_run)
          if str(eq.get('head_sha')) != engine_sha:
              raise SystemExit('performance equivalence run did not test the frozen engine SHA')
          if eq.get('status') != 'completed' or eq.get('conclusion') != 'success':
              raise SystemExit('performance equivalence run is not successful')

          source = None
          for _ in range(720):
              source = get_run(source_run)
              print('source_run', source_run, source.get('status'), source.get('conclusion'))
              if str(source.get('head_sha')) != source_sha:
                  raise SystemExit('source citable run head differs from frozen source SHA')
              if source.get('status') == 'completed':
                  if source.get('conclusion') != 'success':
                      raise SystemExit(f"source citable run failed: {source.get('conclusion')}")
                  break
              time.sleep(30)
          else:
              raise SystemExit('source citable run did not finish inside v3 gate window')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f'source_run_id={source_run}\n')
              out.write(f'source_sha={source_sha}\n')
              out.write(f'engine_sha={engine_sha}\n')
              out.write(f'benchmark_jobs={jobs}\n')
          PY
      - name: Checkout source governance
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.contract.outputs.source_sha }}
          path: governance
      - name: Download accepted citable source artifact
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.contract.outputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: citable-product-a-v1-*
          path: source_bundle
          merge-multiple: true
      - name: Gate frozen scientific source and criteria
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          import pandas as pd

          root = Path('source_bundle/citable_result')
          contract = json.loads((root/'citable_snapshot_contract.json').read_text(encoding='utf-8'))
          spec = json.loads((root/'pilot_grid_specification.json').read_text(encoding='utf-8'))
          contrast = json.loads((root/'selector_contrast_contract.json').read_text(encoding='utf-8'))
          taxa = Path('governance/configs/product_a_pilot_taxa_v1.csv')
          taxa_sha = hashlib.sha256(taxa.read_bytes()).hexdigest()
          if contract.get('protocol_version') != 'product_a_v1_leakage_safe_M_sensitivity_fixed_sources':
              raise SystemExit('wrong source protocol version')
          if contract.get('outer_sealed_before_M') is not True or contract.get('m_grid_as_sensitivity') is not True:
              raise SystemExit('source lacks sealed-before-M / M-sensitivity semantics')
          if spec.get('outer_sealed_before_M') is not True or spec.get('m_grid_as_sensitivity') is not True:
              raise SystemExit('source grid lacks strict semantics')
          if contract.get('target_focal_taxa_excluded_pre_split') is not True:
              raise SystemExit('source target did not exclude focal taxa pre-split')
          if int(contract.get('target_excluded_taxa_count', 0)) != 12:
              raise SystemExit('source target excluded wrong focal-taxon count')
          if str(contract.get('target_excluded_taxa_sha256','')).lower() != taxa_sha:
              raise SystemExit('source target exclusion fingerprint mismatch')
          if int(contract.get('chelsa_probe_failures', 1)) != 0:
              raise SystemExit('source CHELSA preflight did not pass')
          if contrast.get('cross_taxon_selection_data') != 'discovery_taxa_only':
              raise SystemExit('source cross-taxon selection used validation taxa')
          if contrast.get('local_nested_auc_selection_data') != 'validation_species_model_pool_only':
              raise SystemExit('source local nested AUC escaped model pool')
          if contrast.get('outer_sealed_used_for_selection') is not False:
              raise SystemExit('source selector used outer sealed evidence')
          source_criteria = root/'product_a_promotion_criteria_v1.csv'
          if hashlib.sha256(source_criteria.read_bytes()).hexdigest() != str(contract.get('promotion_criteria_sha256','')).lower():
              raise SystemExit('source promotion criteria SHA mismatch')
          expected = set(pd.read_csv(taxa)['scientific_name'].astype(str))
          gate = pd.read_csv(root/'species_gate.csv')
          eligible = set(gate.loc[gate['eligible'].astype(bool), 'species'].astype(str))
          if eligible != expected:
              raise SystemExit(f'source lacks full predeclared panel: missing={sorted(expected-eligible)}')
          print('v3 source gate passed', len(expected), 'taxa')
          PY

  stability_part:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        seed: [11, 22, 33, 44, 55]
        sealed_fraction: ['0.15', '0.20', '0.30']
    env:
      SDMR_BENCHMARK_JOBS: ${{ needs.source.outputs.benchmark_jobs }}
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - name: Checkout exact-semantics performance engine
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.engine_sha }}
          path: engine
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install performance-equivalent engine
        working-directory: engine
        run: python -m pip install -e '.[geo,parquet]'
      - name: Download exact accepted source artifact
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ needs.source.outputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: citable-product-a-v1-*
          path: source_bundle
          merge-multiple: true
      - name: Rebuild full split with exact-semantics acceleration
        run: |
          cd engine
          sdmr-pilot-grid \
            --gbif-download "$GITHUB_WORKSPACE/source_bundle/citable_input/focal.parquet" \
            --gbif-download-key "v3-source:${{ needs.source.outputs.source_run_id }}" \
            --target-group-download "$GITHUB_WORKSPACE/source_bundle/citable_input/target_group.parquet" \
            --target-group-download-key "v3-source:${{ needs.source.outputs.source_run_id }}" \
            --checklist-key 'snapshot-interpreted:2026-08-01' \
            --taxa configs/product_a_pilot_taxa_v1.csv \
            --grid configs/product_a_buffer_specs_v1.csv \
            --manifest configs/chelsa_v2_1_plant_candidates.csv \
            --output-dir "$GITHUB_WORKSPACE/part_result" \
            --m-grid-as-sensitivity \
            --min-occurrences 80 \
            --min-unique-cells 50 \
            --gate-cell-size-degrees 0.05 \
            --spatial-test-fraction '${{ matrix.sealed_fraction }}' \
            --taxon-validation-fraction 0.25 \
            --vif-threshold 5 \
            --max-predictors 8 \
            --random-baseline-repeats 0 \
            --seed '${{ matrix.seed }}'
          sdmr-compare-evaluation \
            --product-a-dir "$GITHUB_WORKSPACE/part_result" \
            --manifest configs/chelsa_v2_1_plant_candidates.csv \
            --canonical-specification buffer_300km
      - name: Require full panel and strict selector semantics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          expected = set(pd.read_csv('engine/configs/product_a_pilot_taxa_v1.csv')['scientific_name'].astype(str))
          gate = pd.read_csv('part_result/species_gate.csv')
          eligible = set(gate.loc[gate['eligible'].astype(bool), 'species'].astype(str))
          if eligible != expected:
              raise SystemExit(f'v3 split loses taxa: missing={sorted(expected-eligible)}')
          spec = json.loads(Path('part_result/pilot_grid_specification.json').read_text(encoding='utf-8'))
          contrast = json.loads(Path('part_result/selector_contrast_contract.json').read_text(encoding='utf-8'))
          if spec.get('outer_sealed_before_M') is not True or spec.get('m_grid_as_sensitivity') is not True:
              raise SystemExit('v3 split violates sealed-before-M/M-sensitivity')
          if contrast.get('cross_taxon_selection_data') != 'discovery_taxa_only':
              raise SystemExit('v3 cross-taxon selector used validation taxa')
          if contrast.get('local_nested_auc_selection_data') != 'validation_species_model_pool_only':
              raise SystemExit('v3 local nested AUC escaped model pool')
          if contrast.get('outer_sealed_used_for_selection') is not False:
              raise SystemExit('v3 selector used outer sealed evidence')
          PY
      - name: Freeze v3 part metadata
        if: always()
        run: |
          mkdir -p part_result
          python - <<'PY'
          import json
          from pathlib import Path
          Path('part_result/part_metadata.json').write_text(json.dumps({
              'source_run_id': '${{ needs.source.outputs.source_run_id }}',
              'source_head_sha': '${{ needs.source.outputs.source_sha }}',
              'performance_engine_sha': '${{ needs.source.outputs.engine_sha }}',
              'performance_equivalence_run_id': '31868704833',
              'seed': int('${{ matrix.seed }}'),
              'sealed_fraction': float('${{ matrix.sealed_fraction }}'),
              'taxon_validation_fraction': 0.25,
              'M_background_rebuilt_from_model_pool': True,
              'M_grid_treated_as_sensitivity_not_optimized': True,
              'raw_focal_reprocessed_for_split': True,
              'require_full_predeclared_taxon_panel': True,
              'random_baseline_repeats': 0,
              'benchmark_jobs': int('${{ needs.source.outputs.benchmark_jobs }}'),
              'performance_changes_only': True,
          }, indent=2, sort_keys=True), encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-a-v1-stability-v3-${{ matrix.seed }}-${{ matrix.sealed_fraction }}
          path: |
            part_result/part_metadata.json
            part_result/product_a_protocol_choice.txt
            part_result/pilot_grid_specification.json
            part_result/protocol_discovery_summary.csv
            part_result/protocol_validation_metrics.csv
            part_result/protocol_validation_summary.csv
            part_result/protocol_validation_paired_deltas.csv
            part_result/species_gate.csv
            part_result/selector_contrast_contract.json
            part_result/selector_contrast_choices.csv
            part_result/selector_contrast_transfer_summary.csv
            part_result/selector_contrast_paired_deltas.csv
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: [source, stability_part]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout frozen source governance code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.source_sha }}
          path: governance
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen aggregation/governance code
        run: python -m pip install -e governance
      - name: Download all v3 frozen parts
        uses: actions/download-artifact@v4
        with:
          pattern: product-a-v1-stability-v3-*
          path: stability_parts
      - name: Aggregate without reselection
        run: |
          python governance/scripts/aggregate_leakage_safe_stability.py \
            --parts-root stability_parts \
            --output-dir stability_result
          python governance/scripts/aggregate_selector_contrast.py \
            --parts-root stability_parts \
            --output-dir stability_result
      - name: Download accepted source artifact and freeze source criteria
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ needs.source.outputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: citable-product-a-v1-*
          path: source_bundle
          merge-multiple: true
      - name: Record immutable v3 governance
        run: |
          cp source_bundle/citable_result/citable_snapshot_contract.json stability_result/source_citable_snapshot_contract.json
          cp source_bundle/citable_result/product_a_promotion_criteria_v1.csv stability_result/promotion_criteria_predeclared_before_stability.csv
          cp governance/configs/product_a_differentiation_criteria_v1.csv stability_result/differentiation_criteria_predeclared_before_stability.csv
          cat > stability_result/stability_inputs.txt <<EOF
          source_run_id=${{ needs.source.outputs.source_run_id }}
          source_head_sha=${{ needs.source.outputs.source_sha }}
          performance_engine_sha=${{ needs.source.outputs.engine_sha }}
          performance_equivalence_run_id=31868704833
          exact_semantics_equivalence=passed
          benchmark_jobs=${{ needs.source.outputs.benchmark_jobs }}
          random_baseline_repeats=0
          seeds=11,22,33,44,55
          sealed_fractions=0.15,0.20,0.30
          taxon_validation_fraction=0.25
          M_grid_as_sensitivity=true
          full_taxon_panel_required=true
          final_governance_code=source_head
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: product-a-v1-stability-v3-aggregate
          path: stability_result/
          if-no-files-found: error
          retention-days: 90

  decide:
    needs: [source, aggregate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout frozen source decision code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.source_sha }}
          path: governance
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source decision code
        run: python -m pip install -e governance
      - name: Download frozen aggregate
        uses: actions/download-artifact@v4
        with:
          name: product-a-v1-stability-v3-aggregate
          path: stability_result
      - name: Apply source-frozen promotion criteria
        run: |
          python - <<'PY'
          import csv, subprocess
          from pathlib import Path
          criteria = {r['criterion']: r['value'] for r in csv.DictReader(Path('stability_result/promotion_criteria_predeclared_before_stability.csv').open(encoding='utf-8'))}
          cmd = [
              'sdmr-promote-protocol',
              '--runs', 'stability_result/protocol_stability_runs.csv',
              '--choice-stability', 'stability_result/protocol_choice_stability.csv',
              '--paired-validation-deltas', 'stability_result/protocol_validation_paired_deltas.csv',
              '--output-dir', 'decision_result/promotion',
              '--min-protocol-selection-fraction', criteria['min_protocol_selection_fraction'],
              '--min-runs-selected', criteria['min_runs_selected'],
              '--min-m-spec-win-fraction', criteria['min_m_spec_win_fraction'],
              '--min-mean-delta-presence-rank', criteria['min_mean_delta_presence_rank'],
              '--min-positive-pair-fraction', criteria['min_positive_pair_fraction'],
              '--min-pairs-per-comparator', criteria['min_pairs_per_comparator'],
              '--required-comparators', criteria['required_comparators'],
          ]
          result = subprocess.run(cmd, check=False)
          if result.returncode not in (0, 2):
              raise SystemExit(result.returncode)
          print('promotion_exit_code', result.returncode)
          PY
      - name: Apply predeclared AUC/Boyce/local-nested differentiation gate
        run: |
          sdmr-assess-differentiation \
            --summary stability_result/selector_contrast_comparator_summary.csv \
            --criteria stability_result/differentiation_criteria_predeclared_before_stability.csv \
            --output-dir decision_result/differentiation
      - name: Write final Product-A decision handoff
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          promo = pd.read_csv('decision_result/promotion/promotion_assessment.csv').iloc[0].to_dict()
          diff = json.loads(Path('decision_result/differentiation/product_a_differentiation_result.json').read_text(encoding='utf-8'))
          if bool(promo['promoted']) and bool(diff['passes_all_required_comparators']):
              status = 'promoted_and_transfer_advantage_supported'
          elif bool(promo['promoted']):
              status = 'promoted_but_no_demonstrated_advantage_over_conventional_selectors'
          else:
              status = 'promotion_not_met'
          Path('decision_result/product_a_final_decision.json').write_text(json.dumps({
              'status': status,
              'product_a_promoted': bool(promo['promoted']),
              'transfer_advantage_supported': bool(diff['passes_all_required_comparators']),
              'source_run_id': '${{ needs.source.outputs.source_run_id }}',
              'source_head_sha': '${{ needs.source.outputs.source_sha }}',
              'performance_engine_sha': '${{ needs.source.outputs.engine_sha }}',
              'performance_equivalence_run_id': '31868704833',
              'interpretation': 'No threshold was relaxed after confirmatory results; non-promotion/non-differentiation are valid outcomes.'
          }, indent=2, sort_keys=True), encoding='utf-8')
          print(status)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: product-a-v1-final-decision-v3
          path: decision_result/
          if-no-files-found: error
          retention-days: 90
