name: Product A real positive focal parallel

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/product-a-real-positive-focal-parallel.yml'
      - 'scripts/run_real_positive_control_endpoint.py'
      - 'configs/product_a_real_positive_control_taxa_v1.csv'
      - 'configs/product_a_real_positive_control_contract_v1.json'
      - 'configs/product_a_real_positive_control_manifest_v1.csv'
      - 'src/sdmr/fresh_focal_parallel.py'
      - 'src/sdmr/real_positive_control.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: product-a-real-positive-focal-parallel-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focal-chunk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chunk: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install exact snapshot transport dependencies
        run: python -m pip install -e '.[cloud,parquet]'
      - name: Materialize disjoint snapshot shard chunk
        run: |
          mkdir -p focal_part
          python -m sdmr.fresh_focal_parallel chunk \
            --snapshot-date '2026-08-01' \
            --snapshot-doi '10.15468/dl.fs3btq' \
            --region 'ap-southeast-2' \
            --taxa configs/product_a_real_positive_control_taxa_v1.csv \
            --chunk-index '${{ matrix.chunk }}' \
            --chunk-count 8 \
            --output focal_part/partial.parquet \
            --metadata focal_part/metadata.json
      - uses: actions/upload-artifact@v4
        with:
          name: real-positive-focal-chunk-${{ matrix.chunk }}-${{ github.sha }}
          path: focal_part/
          retention-days: 30
          if-no-files-found: error

  aggregate:
    needs: focal-chunk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install exact snapshot transport dependencies
        run: python -m pip install -e '.[cloud,parquet]'
      - uses: actions/download-artifact@v4
        with:
          pattern: real-positive-focal-chunk-*-${{ github.sha }}
          path: focal_parts
      - name: Aggregate disjoint chunks without row deduplication
        run: |
          python -m sdmr.fresh_focal_parallel aggregate \
            --parts-root focal_parts \
            --snapshot-date '2026-08-01' \
            --snapshot-doi '10.15468/dl.fs3btq' \
            --citation-sha256 '022a524b59c4c037b28f252c08294e0f22c5eb7b3bce5c52a0a5fc6016f17050' \
            --region 'ap-southeast-2' \
            --taxa configs/product_a_real_positive_control_taxa_v1.csv \
            --output-dir focal_bundle
          test -s focal_bundle/focal.parquet
          test -s focal_bundle/focal.provenance.csv
          test -s focal_bundle/focal_source_manifest.json
          cat focal_bundle/focal_source_manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: real-positive-focal-parallel-${{ github.sha }}
          path: focal_bundle/
          retention-days: 90
          if-no-files-found: error

  endpoint:
    needs: aggregate
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SDMR_RASTER_LAYER_JOBS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install citable empirical dependencies
        run: python -m pip install -e '.[cloud,geo,parquet,test]'
      - name: Re-verify frozen endpoint contract
        run: |
          pytest -q tests/test_real_positive_control.py
          sdmr-chelsa \
            --manifest configs/product_a_real_positive_control_manifest_v1.csv \
            --output-dir endpoint_preflight \
            --probe \
            --require-probe-success
      - uses: actions/download-artifact@v4
        with:
          name: real-positive-focal-parallel-${{ github.sha }}
          path: focal_bundle
      - name: Download frozen global Plantae target-group cache
        uses: actions/download-artifact@v4
        with:
          run-id: 31859498088
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: product-a-v1-target-cache-parallel-2026-08-01
          path: target_source
      - name: Run frozen real positive-control endpoint
        run: |
          python scripts/run_real_positive_control_endpoint.py \
            --focal-parquet focal_bundle/focal.parquet \
            --target-parquet target_source/target_group.parquet \
            --contract configs/product_a_real_positive_control_contract_v1.json \
            --output-root real_positive_control
          cat real_positive_control/result/real_positive_control_decision.json
          cat real_positive_control/result/real_positive_control_taxon_results.csv
          cat real_positive_control/result/real_positive_control_aggregated_scores.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-a-real-positive-control-parallel-${{ github.sha }}
          path: |
            focal_bundle/
            endpoint_preflight/
            real_positive_control/
          retention-days: 90
          if-no-files-found: error
