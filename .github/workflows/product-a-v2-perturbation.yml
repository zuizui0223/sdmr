name: product-a-v2-perturbation

on:
  pull_request:
    paths:
      - 'src/sdmr/known_truth_perturbation.py'
      - 'src/sdmr/known_truth_perturbation_experiment.py'
      - 'src/sdmr/known_truth_replicated_observation_experiment.py'
      - 'src/sdmr/niche_recovery_perturbation.py'
      - 'src/sdmr/replicated_observation_gate.py'
      - 'src/sdmr/observation_process.py'
      - 'src/sdmr/observation_corrected_recovery.py'
      - 'src/sdmr/niche_recovery_cv.py'
      - 'src/sdmr/niche_recovery_selection.py'
      - 'src/sdmr/model.py'
      - '.github/workflows/product-a-v2-perturbation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-a-v2-perturbation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package
        run: python -m pip install -e '.[test]'
      - name: Compare baseline and replicated observation correction
        run: |
          mkdir -p perturbation_result
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          from sdmr.known_truth_experiment import _summarize_truth, _truth_ranks
          from sdmr.known_truth_perturbation import DEFAULT_KNOWN_TRUTH_PERTURBATIONS
          from sdmr.known_truth_perturbation_experiment import run_known_truth_perturbation_experiment
          from sdmr.known_truth_replicated_observation_experiment import (
              run_known_truth_replicated_observation_experiment,
          )

          kwargs = dict(
              families=('observation_confounded', 'interaction', 'omitted_driver'),
              seeds=(1, 2, 3),
              perturbations=DEFAULT_KNOWN_TRUTH_PERTURBATIONS,
              n_cells=2800,
              n_occurrences=250,
              n_target_group=900,
              n_spatial_blocks=6,
              inner_folds=3,
              min_background=60,
          )
          base_choices, base_truth, _, base_metrics, base_failures = run_known_truth_perturbation_experiment(
              **kwargs,
              observation_correction=False,
          )
          repl_choices, repl_truth, _, repl_metrics, signal_summary = (
              run_known_truth_replicated_observation_experiment(**kwargs)
          )

          # Conventional AUC is outside the ecological target correction and must
          # choose the same candidate in both branches.
          base_auc = base_choices.loc[
              base_choices['selector'].eq('canonical_auc'),
              ['scenario','seed','candidate']
          ]
          repl_auc = repl_choices.loc[
              repl_choices['selector'].eq('canonical_auc'),
              ['scenario','seed','candidate']
          ]
          auc_check = base_auc.merge(
              repl_auc, on=['scenario','seed'], suffixes=('_base','_replicated')
          )
          if len(auc_check) != 9 or not auc_check['candidate_base'].eq(
              auc_check['candidate_replicated']
          ).all():
              raise RuntimeError(
                  'canonical AUC changed when only the ecological observation target changed'
              )
          auc_check.to_csv('perturbation_result/canonical_auc_invariance.csv', index=False)

          # Put baseline and replicated-correction ecological selectors in one
          # hidden-truth league. Keep only one AUC row.
          repl_choices_no_auc = repl_choices.loc[
              ~repl_choices['selector'].eq('canonical_auc')
          ].copy()
          choices = pd.concat([base_choices, repl_choices_no_auc], ignore_index=True)

          def strip_truth_ranks(frame):
              drop = [
                  c for c in frame.columns
                  if c.startswith('truth_rank__')
                  or c in {
                      'truth_worst_metric_rank', 'truth_mean_metric_rank',
                      'truth_best_worst_rank', 'truth_best_mean_rank',
                      'truth_selector_win', 'truth_best_selectors',
                  }
              ]
              return frame.drop(columns=drop, errors='ignore')

          repl_truth_no_auc = repl_truth.loc[
              ~repl_truth['selector'].eq('canonical_auc')
          ].copy()
          truth = pd.concat(
              [strip_truth_ranks(base_truth), strip_truth_ranks(repl_truth_no_auc)],
              ignore_index=True,
          )
          truth = _truth_ranks(truth)
          summary = _summarize_truth(truth)

          base_choices.to_csv('perturbation_result/baseline_selector_choices.csv', index=False)
          repl_choices.to_csv('perturbation_result/replicated_selector_choices.csv', index=False)
          choices.to_csv('perturbation_result/joint_selector_choices.csv', index=False)
          truth.to_csv('perturbation_result/joint_truth_evaluation.csv', index=False)
          summary.to_csv('perturbation_result/joint_selector_truth_summary.csv', index=False)
          base_metrics.to_csv('perturbation_result/baseline_candidate_fold_metrics.csv', index=False)
          repl_metrics.to_csv('perturbation_result/replicated_effective_candidate_fold_metrics.csv', index=False)
          signal_summary.to_csv('perturbation_result/observation_signal_summary.csv', index=False)
          base_failures.to_csv('perturbation_result/baseline_selection_failures.csv', index=False)

          scenario_summary = (
              truth.groupby(['scenario','selector'], as_index=False)
              .agg(
                  n_cases=('seed','size'),
                  truth_co_win_fraction=('truth_selector_win','mean'),
                  mean_truth_overlap=('niche_overlap_schoener_d_pc12','mean'),
                  mean_centroid_distance=('centroid_distance','mean'),
                  mean_breadth_error=('breadth_log_sd_error','mean'),
                  mean_quantile_error=('quantile_profile_error','mean'),
                  mean_truth_surface_rank=('truth_surface_rank','mean'),
                  mean_truth_surface_nrmse=('truth_surface_nrmse','mean'),
                  mean_response_curve_error=('response_curve_error','mean'),
                  mean_optimum_error=('optimum_error','mean'),
                  mean_lower_limit_error=('lower_limit_error','mean'),
                  mean_upper_limit_error=('upper_limit_error','mean'),
                  mean_driver_process_f1=('driver_process_f1','mean'),
                  mean_truth_worst_rank=('truth_worst_metric_rank','mean'),
                  mean_truth_mean_rank=('truth_mean_metric_rank','mean'),
              )
          )
          scenario_summary.to_csv(
              'perturbation_result/scenario_selector_truth_summary.csv', index=False
          )

          gate_cases = (
              signal_summary.groupby(['scenario','seed'], as_index=False)
              .agg(
                  global_correction_active=('global_correction_active','first'),
                  n_active_signal_perturbations=('n_active_signal_perturbations','first'),
                  n_signal_perturbations=('n_signal_perturbations','first'),
                  min_signal_auc=('observation_signal_mean_auc','min'),
                  min_signal_lower_bound=('observation_signal_lower_bound','min'),
                  mean_signal_auc=('observation_signal_mean_auc','mean'),
              )
          )
          gate_cases.to_csv('perturbation_result/observation_global_gate_cases.csv', index=False)

          coverage = (
              choices.groupby('selector', as_index=False)
              .agg(n_selected_cases=('seed','size'))
          )
          coverage['expected_cases'] = 9
          coverage['selection_coverage'] = coverage['n_selected_cases'] / 9
          coverage.to_csv('perturbation_result/selector_coverage.csv', index=False)

          contract = {
              'purpose': 'development_replicated_observation_target_correction_under_exogenous_perturbations',
              'families': ['observation_confounded','interaction','omitted_driver'],
              'seeds': [1,2,3],
              'perturbations': [spec.name for spec in DEFAULT_KNOWN_TRUTH_PERTURBATIONS],
              'joint_selectors': [
                  'canonical_auc',
                  'canonical_niche_recovery',
                  'perturbation_robust_niche_recovery',
                  'canonical_replicated_observation_niche_recovery',
                  'replicated_observation_perturbation_robust_niche_recovery',
              ],
              'prediction_gate': 'candidate_must_pass_absolute_auc_adequacy_in_every_perturbation',
              'observation_signal_local_gate': 'mean_nuisance_auc>=0.51_and_mean_minus_1sem>=0.50_training_only_spatial_cv',
              'observation_signal_global_gate': 'correction_admitted_only_if_local_gate_passes_in_every_predeclared_perturbation',
              'global_gate_changes_no_numeric_auc_threshold': True,
              'global_gate_failure_action': 'exact_identity_occurrence_weights_and_uncorrected_ecological_selection_evidence',
              'model_ecological_surface': 'candidate_observation_predictors_marginalized_over_training_background',
              'corrected_occurrence_target': 'candidate_independent_training_only_observation_density_ratio_inverse_odds',
              'observation_weight_predictors': ['recording_bias'],
              'observation_weight_truncation': '99th_percentile_of_training_focal_inverse_odds',
              'background_information_barrier': 'outer_presence_blocks_fixed_before_background_model_pool_occurrences_only_define_access_radius',
              'ecological_aggregation': 'within_perturbation_axis_ranks_then_worst_perturbation_pareto_minimax',
              'raw_metrics_never_pooled_across_M_or_domain': True,
              'weighted_super_score': False,
              'hidden_truth_used_during_selection': False,
              'uncorrected_target_retained_as_negative_control': True,
          }
          Path('perturbation_result/contract.json').write_text(
              json.dumps(contract, indent=2, sort_keys=True), encoding='utf-8'
          )

          print('Joint selector truth summary:')
          print(summary.to_string(index=False))
          print('\nBy scenario:')
          print(scenario_summary.to_string(index=False))
          print('\nGlobal observation gate cases:')
          print(gate_cases.to_string(index=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: product-a-v2-perturbation-development
          path: perturbation_result/
          if-no-files-found: error
          retention-days: 90
