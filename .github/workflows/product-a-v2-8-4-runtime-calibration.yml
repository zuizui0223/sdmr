name: Product-A v2.8.4 presealed runtime calibration

on:
  push:
    branches:
      - design/product-a-v2-8-4-runtime-calibration
    paths:
      - .github/workflows/product-a-v2-8-4-runtime-calibration.yml
      - configs/product_a_v2_8_4_runtime_calibration_contract.json
      - configs/product_a_v2_8_4_runtime_successor_contract.json
      - src/sdmr/v2_8_4_presealed_runtime.py
      - src/sdmr/v2_8_4_runtime_calibration.py
      - tests/test_product_a_v2_8_4_runtime_calibration.py

permissions:
  contents: read
  actions: read

concurrency:
  group: product-a-v2-8-4-runtime-calibration
  cancel-in-progress: false

env:
  CALIBRATION_CONTRACT: configs/product_a_v2_8_4_runtime_calibration_contract.json
  RUNTIME_DESIGN: configs/product_a_v2_8_4_runtime_successor_contract.json
  SCIENTIFIC_CONTRACT: configs/product_a_v2_8_3_fresh_confirmation_contract.json
  PROCESS_REGISTRY: configs/product_a_empirical_process_registry_v1.csv
  TAXON_REGISTRY: configs/product_a_v2_8_2_fresh_confirmation_taxa.csv
  CALIBRATION_EXECUTION_ID: product-a-v2-8-4-runtime-calibration-only-v1
  CALIBRATION_TAXON: Poa annua
  CALIBRATION_TAXON_INDEX: '6'
  CALIBRATION_PART_SEED: '2026082201'

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
          cache: pip
      - name: Install the calibration environment
        run: |
          python -m pip install --disable-pip-version-check \
            'numpy==2.3.5' 'pandas==2.2.3' 'scipy==1.17.0' \
            'scikit-learn==1.8.0' 'pyarrow==21.0.0' 'pytest==8.4.2'
          python -m pip install --disable-pip-version-check --no-deps -e .
      - name: Verify exact presealed calibration scope and source artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import hashlib, json, os, urllib.request
          from pathlib import Path
          from sdmr.v2_8_4_runtime_calibration import load_contract

          path=Path(os.environ['CALIBRATION_CONTRACT'])
          c=load_contract(path)
          if os.environ['GITHUB_EVENT_NAME']!='push' or os.environ['GITHUB_REF_NAME']!='design/product-a-v2-8-4-runtime-calibration':
              raise SystemExit('v2.8.4 calibration trigger boundary changed')
          workload=c['workload']
          for key in ('runtime_implementation','calibration_module','workflow','runtime_design','scientific_contract','process_registry','taxon_registry'):
              p=Path(workload[f'{key}_path'])
              actual=hashlib.sha256(p.read_bytes()).hexdigest()
              if actual!=workload[f'{key}_sha256']:
                  raise SystemExit(f'v2.8.4 calibration input changed: {p}')
          source=c['source_materialization']
          request=urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/artifacts/{source['artifact_id']}",
              headers={
                  'Authorization':f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept':'application/vnd.github+json',
                  'X-GitHub-Api-Version':'2022-11-28',
                  'User-Agent':'sdmr-v284-runtime-calibration',
              },
          )
          with urllib.request.urlopen(request,timeout=60) as response:
              artifact=json.loads(response.read())
          expected={
              'id':source['artifact_id'],
              'name':source['artifact_name'],
              'digest':source['artifact_digest'],
              'size_in_bytes':source['artifact_size_bytes'],
              'expired':False,
          }
          for key,value in expected.items():
              if artifact.get(key)!=value:
                  raise SystemExit(f'v2.8.4 calibration source artifact changed: {key}')
          if int(artifact['workflow_run']['id'])!=int(source['workflow_run_id']):
              raise SystemExit('v2.8.4 calibration source run changed')
          print(json.dumps({'calibration_id':c['calibration_id'],'cells':workload['cell_count'],'source_artifact':expected},indent=2,sort_keys=True))
          PY
      - name: Run runtime calibration contract tests
        run: python -m pytest -q tests/test_product_a_v2_8_4_runtime_calibration.py tests/test_product_a_v2_8_4_group_equivalence.py --disable-warnings

  precompute:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
          cache: pip
      - name: Install the calibration environment
        run: |
          python -m pip install --disable-pip-version-check \
            'numpy==2.3.5' 'pandas==2.2.3' 'scipy==1.17.0' \
            'scikit-learn==1.8.0' 'pyarrow==21.0.0' 'pytest==8.4.2'
          python -m pip install --disable-pip-version-check --no-deps -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: v283-fresh-part-2026082201
          path: calibration-input/part
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: '33036252432'
      - name: Verify model-pool-only materialization and prepare shared truth-blind state
        run: |
          python - <<'PY'
          import json
          c=json.load(open('calibration-input/part/contract.json'))
          if c.get('purpose')!='product_a_v2_7_2_fresh_part_model_pool_materialization':
              raise SystemExit('wrong v2.8.4 calibration materialization')
          if int(c.get('seed',-1))!=2026082201:
              raise SystemExit('v2.8.4 calibration part seed changed')
          for key in ('sealed_occurrence_raster_values_extracted','sealed_background_raster_values_extracted'):
              if c.get(key) is not False:
                  raise SystemExit(f'v2.8.4 calibration source crossed sealed barrier: {key}')
          PY
          python -m sdmr.v2_8_4_presealed_runtime precompute \
            --runtime-design "$RUNTIME_DESIGN" \
            --scientific-contract "$SCIENTIFIC_CONTRACT" \
            --process-registry "$PROCESS_REGISTRY" \
            --part-dir calibration-input/part \
            --scientific-execution-id "$CALIBRATION_EXECUTION_ID" \
            --taxon "$CALIBRATION_TAXON" \
            --taxon-index "$CALIBRATION_TAXON_INDEX" \
            --part-seed "$CALIBRATION_PART_SEED" \
            --output-dir precompute
          python - <<'PY'
          import json
          c=json.load(open('precompute/contract.json'))
          if c.get('available') is not True:
              raise SystemExit(f"v2.8.4 runtime calibration precompute unavailable: {c.get('unavailable_reason')}")
          for key in ('sealed_occurrence_environment_read','sealed_occurrence_used_for_selection','sealed_occurrence_used_for_process_status','candidate_scores_used_for_partition_or_audit_selection','scientific_promotion_allowed','product_b_unblocked'):
              if c.get(key) is not False:
                  raise SystemExit(f'v2.8.4 calibration precompute crossed barrier: {key}')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v284-runtime-calibration-precompute
          path: precompute/
          if-no-files-found: error
          retention-days: 30
          compression-level: 1

  group:
    needs: precompute
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        M: [buffer_150km, buffer_300km, buffer_500km]
        evaluation_group: [base, thermal, water, seasonality_phenology, energy_productivity, snow, wind]
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
          cache: pip
      - name: Install the calibration environment
        run: |
          python -m pip install --disable-pip-version-check \
            'numpy==2.3.5' 'pandas==2.2.3' 'scipy==1.17.0' \
            'scikit-learn==1.8.0' 'pyarrow==21.0.0' 'pytest==8.4.2'
          python -m pip install --disable-pip-version-check --no-deps -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: v283-fresh-part-2026082201
          path: calibration-input/part
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: '33036252432'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: v284-runtime-calibration-precompute
          path: precompute
      - name: Run one predeclared group and retain technical receipt only
        env:
          CALIBRATION_M: ${{ matrix.M }}
          CALIBRATION_GROUP: ${{ matrix.evaluation_group }}
        run: |
          set -euo pipefail
          mkdir -p environment receipt group-output
          python -m sdmr.v2_8_4_runtime_calibration environment \
            --contract "$CALIBRATION_CONTRACT" \
            --output environment/receipt.json
          START=$(date +%s)
          set +e
          timeout --signal=TERM --kill-after=30s 240m \
            python -m sdmr.v2_8_4_presealed_runtime evaluate-group \
              --runtime-design "$RUNTIME_DESIGN" \
              --scientific-contract "$SCIENTIFIC_CONTRACT" \
              --process-registry "$PROCESS_REGISTRY" \
              --part-dir calibration-input/part \
              --precompute-dir precompute \
              --scientific-execution-id "$CALIBRATION_EXECUTION_ID" \
              --taxon "$CALIBRATION_TAXON" \
              --taxon-index "$CALIBRATION_TAXON_INDEX" \
              --part-seed "$CALIBRATION_PART_SEED" \
              --M "$CALIBRATION_M" \
              --evaluation-group "$CALIBRATION_GROUP" \
              --attempt-ordinal 0 \
              --output-dir group-output
          RC=$?
          set -e
          END=$(date +%s)
          python -m sdmr.v2_8_4_runtime_calibration group-receipt \
            --contract "$CALIBRATION_CONTRACT" \
            --group-output-dir group-output \
            --environment-receipt environment/receipt.json \
            --M "$CALIBRATION_M" \
            --evaluation-group "$CALIBRATION_GROUP" \
            --return-code "$RC" \
            --wall-elapsed-seconds "$((END-START))" \
            --output receipt/receipt.json
          python - <<'PY'
          import json
          r=json.load(open('receipt/receipt.json'))
          print(json.dumps({k:r.get(k) for k in ('M','evaluation_group','status','wall_elapsed_seconds','environment_digest','receipt_digest')},indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v284-runtime-calibration-receipt-${{ matrix.M }}-${{ matrix.evaluation_group }}
          path: receipt/receipt.json
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: group
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - name: Install the calibration environment
        run: |
          python -m pip install --disable-pip-version-check \
            'numpy==2.3.5' 'pandas==2.2.3' 'scipy==1.17.0' \
            'scikit-learn==1.8.0' 'pyarrow==21.0.0' 'pytest==8.4.2'
          python -m pip install --disable-pip-version-check --no-deps -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: v284-runtime-calibration-receipt-*
          path: receipts
      - name: Aggregate the exact truth-blind 21-cell denominator
        run: |
          python -m sdmr.v2_8_4_runtime_calibration aggregate \
            --contract "$CALIBRATION_CONTRACT" \
            --receipts-root receipts \
            --output decision/decision.json
          python -m json.tool decision/decision.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: product-a-v2-8-4-runtime-calibration-decision
          path: decision/decision.json
          if-no-files-found: error
          retention-days: 90
      - name: Propagate calibration engineering failure only
        run: |
          python - <<'PY'
          import json
          d=json.load(open('decision/decision.json'))
          if d['status']=='engineering_failure':
              raise SystemExit('v2.8.4 runtime calibration had an engineering failure')
          print('runtime calibration terminal status:',d['status'])
          PY
