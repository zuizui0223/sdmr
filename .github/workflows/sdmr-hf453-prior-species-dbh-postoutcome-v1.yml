name: HF453 prior species-size-health confounding v1 (post-outcome one-shot)

# Starts ONLY when a fresh exact execute lock is committed on this branch.
# Original HF453 death/CP outcome was already opened. This is exploratory,
# within one forest, NOT an independent prospective ecological confirmation.
on:
  push:
    branches: [research/hf453-cp-confounding-postoutcome-20261120]
    paths:
      - 'configs/hf453_prior_species_size_postoutcome_v1_once.lock'

permissions:
  contents: read

jobs:
  single-forest-postoutcome-prior-covariates:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frozen config, code, synthetic tests and exact scientific lock before source GET
        run: |
          test "$(git hash-object configs/hf453_prior_species_size_postoutcome_v1.json)" = "5ecb3f10f3e581d756677995f3f5563485899ed3"
          test "$(git hash-object scripts/hf453_prior_species_size_confounding_postoutcome_v1.py)" = "423a0e71dc7f0bd109e26395df8596f4225f2260"
          test "$(git hash-object tests/test_hf453_prior_species_size_confounding_postoutcome_v1.py)" = "5a5c69aa70aad025aa06355f251993d278a293e3"
          python - <<'PY'
          from pathlib import Path
          lock=Path('configs/hf453_prior_species_size_postoutcome_v1_once.lock').read_text()
          expected="\n".join([
            'program=sdmr_hf453_prior_species_size_health_postoutcome_v1',
            'role=post_HF453_Y_opening_exploration_not_independent_replication',
            'HF453_original_sha256=0b5fd6072fc5a5b5a315dca4609e3023a85430e5e24a96a2cfa3307a0d431e74',
            'HF253_original_sha256=bb48448b8a2cd920fcac7df21a352a0c70174652f11d76423b03770a565ce2e7',
            'primary=2021_to_2022_source_coded_DC_DS_after_A_AU',
            'baseline=2019_sp_log1p_dbh_plus_2021_AU',
            'added_predictor=2021_prior_CP_binary_1_2_vs_3_4_5',
            'folds=GroupKFold_5_original_HF253_tree.id',
            'metric=parent_equal_OOF_log_loss_baseline_minus_plus_CP',
            'strata=2019_sp_x_four_dbh_bins_x_2021_AU',
            'min_strata_CP=10_primary_1_sensitivity',
            'missing_next_DN_not_auto_dead_or_alive',
            'no_original_microdata_archive_or_tree_ID_output=true',
            'no_causal_or_biome_transfer_claim=true',
            'M5_ProductA_unchanged_ProductB_blocked=true',
          ])+"\n"
          assert lock==expected, 'first original source analysis protocol changed'
          PY
      - name: Run frozen synthetic source-free method gates before any real Y or old covariate access
        run: |
          python -m pip install -e '.[test]'
          python -m pytest -q \
            tests/test_hf453_prior_species_size_confounding_postoutcome_v1.py \
            tests/test_observation_partial_identification_v1.py \
            tests/test_hf253_hf453_parent_tree_grain_source_v1.py
      - name: No-source preflight; source status unchanged
        run: |
          python scripts/hf453_prior_species_size_confounding_postoutcome_v1.py \
            --config configs/hf453_prior_species_size_postoutcome_v1.json \
            --preflight-only \
            --out artifacts/hf453_prior_covariates_preflight_v1.json
          python - <<'PY'
          import json
          d=json.load(open('artifacts/hf453_prior_covariates_preflight_v1.json'))
          assert d['preflight']
          assert d['result']['status']=='source_free_scientific_preflight_only'
          assert not d['no_new_independent_ecological_replication'] is False
          assert d['not_SDMR_productA_M5_repromotion']
          assert not d['Product_B_unblocked']
          PY
      - name: Exactly once freeze-pinned two original sources, fit the preregistered parent-grouped models
        run: |
          python scripts/hf453_prior_species_size_confounding_postoutcome_v1.py \
            --config configs/hf453_prior_species_size_postoutcome_v1.json \
            --execute-lock configs/hf453_prior_species_size_postoutcome_v1_once.lock \
            --out artifacts/hf453_prior_covariates_postoutcome_v1.json
      - name: Require complete source receipts, original denominator and scientific non-promotion
        run: |
          python - <<'PY'
          import json,math
          from pathlib import Path
          path=Path('artifacts/hf453_prior_covariates_postoutcome_v1.json')
          assert path.is_file() and path.stat().st_size>800
          x=json.loads(path.read_text())
          assert x['schema']=='sdmr.hf453_prior_species_size_postoutcome_v1'
          assert x['postoutcome_exploratory_analysis'] and x['one_forest_only']
          assert x['original_HF453_Y_previously_opened']
          assert x['no_new_independent_ecological_replication']
          assert x['no_causal_process_identified']
          assert not x['Product_B_unblocked']
          r=x['result']
          assert r['status']=='postoutcome_fixed_prior_covariate_exploration_completed'
          src=r['source_integrity']
          assert src['HF453_original_sha256']=='0b5fd6072fc5a5b5a315dca4609e3023a85430e5e24a96a2cfa3307a0d431e74'
          assert src['HF253_original_sha256']=='bb48448b8a2cd920fcac7df21a352a0c70174652f11d76423b03770a565ce2e7'
          assert src['HF253_original_bytes']==12687409
          n=r['full_original_source_cohort_eligibility']
          assert n['baseline_alive']==21846
          assert n['next_known_dead']==461
          assert n['next_unknown']==5
          assert n['start_CP_unknown']==4
          assert n['low_CP_N']==10452 and n['high_CP_N']==11390
          assert n['n_original_parent_tree_IDs']==27688
          assert n['n_complete_prior_covariates_in_both_CP']+n['eligible_joint_prior_covariates_missing']==21842
          s=r['strict_CP_common_support_standardization']
          assert s['n_complete_prior_stems_all']==n['n_complete_prior_covariates_in_both_CP']
          assert s['n_in_strata_with_both_CP_groups_eligible']+s['n_excluded_from_fixed_overlap']==s['n_complete_prior_stems_all']
          assert s['not_a_statistical_confidence_interval'] and s['not_causal']
          q=r['primary_parent_holdout_predictive_information']
          assert q['status'] in ('postoutcome_parent_grouped_OOF_description_only',
                                 'unavailable_no_known_binary_status',
                                 'unavailable_class_or_parent_diversity',
                                 'unavailable_frozen_fold_training_class_too_small',
                                 'STOP_frozen_logistic_not_converged')
          if q['status']=='postoutcome_parent_grouped_OOF_description_only':
            assert q['n_folds']==5
            assert q['grouping']=='original_2019_tree.id'
            assert sum(f['n_scored_stems'] for f in q['fold_reports'])==q['n_original_scored_stem_events']
            assert sum(f['n_scored_parent_trees'] for f in q['fold_reports'])==q['n_distinct_test_parent_trees']
            assert all(f['n_training_parent_tree_overlap']==0 for f in q['fold_reports'])
            assert math.isfinite(q['delta_logloss_baseline_minus_plus_CP'])
            assert q['no_biome_or_geographic_transfer_claim']
          assert r['no_raw_identifiers_species_rows_or_individual_outcomes_exported']
          assert r['no_causal_light_competition_or_forest_transfer_claim']
          assert not r['Product_B_unblocked']
          print('HF453 fixed postoutcome result: strictly one forest, original Y unchanged')
          PY
      - name: Archive only aggregate exploratory result and response-free preflight
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdmr-hf453-prior-sp-dbh-health-postoutcome-v1
          path: |
            artifacts/hf453_prior_covariates_postoutcome_v1.json
            artifacts/hf453_prior_covariates_preflight_v1.json
          if-no-files-found: error
          retention-days: 90
