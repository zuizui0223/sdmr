name: product-a-v2-1-preoutcome-discovery-ablation

on:
  pull_request:
    paths:
      - 'src/sdmr/model_pool_predictor_admissibility.py'
      - 'src/sdmr/candidate_outer_fold_evidence.py'
      - 'src/sdmr/v2_1_preoutcome_discovery_experiment.py'
      - 'tests/test_model_pool_predictor_admissibility.py'
      - 'tests/test_candidate_outer_fold_evidence.py'
      - 'configs/product_a_v2_empirical_transfer_stage1_taxa.csv'
      - 'configs/chelsa_v2_1_plant_candidates.csv'
      - '.github/workflows/product-a-v2-1-preoutcome-discovery-ablation.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: product-a-v2-1-preoutcome-discovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preoutcome-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      STRICT_CACHE_RUN_ID: '31870747020'
      STRICT_CACHE_ARTIFACT_ID: '9244072277'
      ELIGIBILITY_RUN_ID: '32021964464'
      ELIGIBILITY_ARTIFACT_ID: '9285693372'
      ELIGIBILITY_ARTIFACT_DIGEST: 'sha256:c2570fe285d70d38740c524bbeb4a6b06d1aa645e7d8d581fa21ead1bc0d1840'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package
        run: python -m pip install -e '.[test]'
      - name: Unit-test pre-outcome gates
        run: |
          pytest -q \
            tests/test_model_pool_predictor_admissibility.py \
            tests/test_candidate_outer_fold_evidence.py
      - name: Download strict frozen feature cache
        run: |
          rm -rf prepared_feature_cache strict_cache.zip
          mkdir -p prepared_feature_cache
          curl --fail --location \
            --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 900 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$STRICT_CACHE_ARTIFACT_ID/zip" \
            --output strict_cache.zip
          unzip -q strict_cache.zip -d prepared_feature_cache
          test -f prepared_feature_cache/feature_cache_contract.json
      - name: Download immutable model-free eligibility artifact
        run: |
          rm -rf taxon_transfer_eligibility eligibility.zip
          mkdir -p taxon_transfer_eligibility
          curl --fail --location \
            --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 300 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ELIGIBILITY_ARTIFACT_ID/zip" \
            --output eligibility.zip
          unzip -q eligibility.zip -d taxon_transfer_eligibility
          test -f taxon_transfer_eligibility/taxon_transfer_spatial_eligibility_contract.json
          test -f taxon_transfer_eligibility/eligible_taxon_roles.csv
      - name: Run sealed-blind v2.1 discovery ablation
        run: |
          rm -rf v2_1_preoutcome
          python -m sdmr.v2_1_preoutcome_discovery_experiment \
            --prepared-dir prepared_feature_cache \
            --manifest configs/chelsa_v2_1_plant_candidates.csv \
            --candidate-taxa configs/product_a_v2_empirical_transfer_stage1_taxa.csv \
            --eligibility-dir taxon_transfer_eligibility \
            --output-dir v2_1_preoutcome \
            --canonical-spec buffer_300km \
            --procedure-profile core_l2 \
            --inner-folds 2 \
            --outer-folds 2 \
            --max-predictors 4 \
            --minimum-predictor-coverage 0.95 \
            --seed 20260814 \
            --source-run-id "$STRICT_CACHE_RUN_ID" \
            --source-artifact-id "$STRICT_CACHE_ARTIFACT_ID" \
            --eligibility-run-id "$ELIGIBILITY_RUN_ID" \
            --eligibility-artifact-id "$ELIGIBILITY_ARTIFACT_ID" \
            --eligibility-artifact-digest "$ELIGIBILITY_ARTIFACT_DIGEST"
      - name: Verify no sealed or validation outcome crossed the development barrier
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          root = Path('v2_1_preoutcome')
          contract = json.loads((root / 'product_a_v2_1_preoutcome_contract.json').read_text())
          coverage = pd.read_csv(root / 'model_pool_predictor_coverage.csv')
          taxon_predictors = pd.read_csv(root / 'taxon_admissible_predictors.csv')
          status = pd.read_csv(root / 'benchmark_status.csv')
          metrics = pd.read_csv(root / 'procedure_fold_metrics.csv')
          selectors = pd.read_csv(root / 'development_selectors.csv')

          assert contract['scientific_promotion_run'] is False
          assert contract['old_external_sealed_outcomes_read'] is False
          assert contract['sealed_rows_returned_to_experiment'] is False
          assert contract['development_evidence'] == 'discovery_taxa_model_pool_only'
          assert contract['source_run_id'] == '31870747020'
          assert contract['source_artifact_id'] == '9244072277'
          assert contract['eligibility_run_id'] == '32021964464'
          assert contract['eligibility_artifact_id'] == '9285693372'
          assert contract['eligibility_artifact_digest'] == 'sha256:c2570fe285d70d38740c524bbeb4a6b06d1aa645e7d8d581fa21ead1bc0d1840'
          assert contract['discovery_taxa'] == ['Nothofagus pumilio', 'Eucalyptus pauciflora']
          assert contract['validation_taxa_loaded'] == []
          assert contract['candidate_predictor_gate']['minimum_coverage'] == 0.95
          assert contract['candidate_predictor_gate']['required_across_all_M'] is True
          assert contract['candidate_outer_fold_gate']['expected_outer_folds'] == 2
          assert contract['candidate_outer_fold_gate']['missing_fold_is_explicit_evidence_insufficiency'] is True
          assert contract['hidden_truth_used'] is False
          assert contract['n_declared_procedures'] == 24

          assert set(coverage['species']) == {'Nothofagus pumilio', 'Eucalyptus pauciflora'}
          assert set(coverage['perturbation']) == {'buffer_150km','buffer_300km','buffer_500km'}
          assert set(taxon_predictors['species']) == {'Nothofagus pumilio', 'Eucalyptus pauciflora'}
          counts = taxon_predictors.set_index('species')['n_admissible_predictors'].to_dict()
          assert counts['Nothofagus pumilio'] == 32
          assert counts['Eucalyptus pauciflora'] == 34
          for species, group in coverage.groupby('species'):
              swe = group.loc[group['predictor'].eq('swe')]
              assert len(swe) == 3
              assert not swe['eligible_all_perturbations'].any()

          assert set(status['species']) == {'Nothofagus pumilio', 'Eucalyptus pauciflora'}
          assert set(status['perturbation']) == {'buffer_150km','buffer_300km','buffer_500km'}
          assert len(status) == 6
          assert set(status['status']).issubset({'success','abstain_no_evaluable_outer_folds'})
          assert set(metrics['species']).issubset({'Nothofagus pumilio', 'Eucalyptus pauciflora'})
          assert set(metrics['perturbation']).issubset({'buffer_150km','buffer_300km','buffer_500km'})
          assert metrics['candidate'].nunique() <= 24
          assert set(selectors['selector']) == {'canonical_auc','canonical_ecology','robust_ecology'}
          assert selectors['status'].apply(lambda x: x == 'selected' or str(x).startswith('abstain_')).all()

          forbidden = {
              'true_suitability','truth_surface_rank','driver_process_f1',
              'n_sealed_presence','n_sealed_background','sealed_evaluation_status'
          }
          for frame in (coverage, taxon_predictors, status, metrics, selectors):
              assert not forbidden.intersection(frame.columns)

          # Complete-fold ledgers must be emitted whenever model metrics exist.
          if not metrics.empty:
              for name in ('canonical_prediction','canonical_ecology','all_prediction','all_ecology'):
                  assert (root / f'outer_evidence_cells__{name}.csv').exists()
                  assert (root / f'outer_evidence_candidates__{name}.csv').exists()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: product-a-v2-1-preoutcome-discovery-ablation
          path: v2_1_preoutcome/
          if-no-files-found: error
          retention-days: 90
