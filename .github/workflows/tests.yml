name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  core:
    name: core-py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install core test dependencies
        run: python -m pip install -e '.[test]'
      - name: Compile package
        run: python -m compileall -q src
      - name: Run tests
        run: pytest -q

  geo:
    name: geo-rasterio-py3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install geo test dependencies
        run: python -m pip install -e '.[test,geo]'
      - name: Run tests with raster extraction enabled
        run: pytest -q
