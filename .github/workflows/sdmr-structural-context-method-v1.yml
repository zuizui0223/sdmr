name: SDMR Structural context method — synthetic only

on:
  pull_request:
    paths:
      - 'src/sdmr/contextual_structure_evidence.py'
      - 'src/sdmr/structural_selection_counterexample_v1.py'
      - 'tests/test_structural_selection_counterexample_v1.py'
      - 'tests/test_contextual_structure_evidence.py'
      - 'src/sdmr/structural_context_oracle.py'
      - 'tests/test_structural_context_oracle.py'
      - 'src/sdmr/structural_known_truth_v1.py'
      - 'tests/test_structural_known_truth_v1.py'
      - 'src/sdmr/structural_process_gate_v1.py'
      - 'tests/test_structural_process_gate_v1.py'
      - 'src/sdmr/structural_process_benchmarks_v1.py'
      - 'tests/test_structural_process_benchmarks_v1.py'
      - 'experiments/structural_known_truth_prospective_v1.py'
      - 'configs/structural_process_kt_prospective_v1.json'
      - 'tests/test_structural_process_kt_prospective_preflight_v1.py'
      - 'docs/SDMR_STRUCTURAL_KT_PROSPECTIVE_PREFREEZE_V1.md'
      - '.github/workflows/sdmr-structural-kt-prospective-v1.yml'
      - 'experiments/structural_known_truth_development_v1.py'
      - 'docs/SDMR_STRUCTURAL_KT_DEVELOPMENT_V1.md'
      - 'docs/SDMR_STRUCTURAL_CONTEXT_BRIDGE_V1.md'
      - '.github/workflows/sdmr-structural-context-method-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and tests (no field source download)
        run: python -m pip install -e '.[test]'
      - name: Verify new typed structure layer and existing many-to-many closure
        run: |
          python -m pytest -q tests/test_contextual_structure_evidence.py tests/test_structural_context_oracle.py tests/test_process_information_closure.py tests/test_structural_known_truth_v1.py tests/test_structural_process_gate_v1.py tests/test_structural_process_benchmarks_v1.py tests/test_structural_process_kt_prospective_preflight_v1.py tests/test_structural_selection_counterexample_v1.py
      - name: Verify prospective contract schema without opening any unused seed
        run: |
          python experiments/structural_known_truth_prospective_v1.py --contract configs/structural_process_kt_prospective_v1.json --preflight-only
      - name: Burned-seed source-free structural development diagnostic
        run: |
          python experiments/structural_known_truth_development_v1.py --seeds 1201 1202 1203 --output artifacts/structural_kt_development_v1.json
          python - <<'PY'
          import json
          d=json.load(open('artifacts/structural_kt_development_v1.json'))
          assert d['n_cases']==24
          assert d['promotion']=='not_authorized'
          assert d['empirical_data_opened'] is False
          assert d['prospective_seeds_opened'] is False
          assert len(d['worlds'])==8 and len(d['seeds'])==3
          assert all(not c['causal_process_identified'] and not c['empirical_promotion_authorized'] for c in d['cases'])
          assert all(c['process_state'] in ('contributory_information_candidate','unresolved','unavailable') for c in d['cases'])
          assert len(d['comparators'])==4
          assert all(c['n_cases']==24 for c in d['comparators'])
          assert d['comparators'][-1]['true_positive_calls']==9
          assert d['comparators'][-1]['false_positive_calls']==0
          print('Worlds: 8; development cases: 24; prospective: unopened')
          PY
      - name: Archive nonpromotable development metrics
        uses: actions/upload-artifact@v4
        with:
          name: sdmr-structural-kt-development-only-v1
          path: artifacts/structural_kt_development_v1.json
          if-no-files-found: error
      - name: Ensure canonical frozen evidence not modified by this branch
        run: |
          python - <<'PY'
          from pathlib import Path
          assert Path("docs/SDMR_STRUCTURAL_CONTEXT_BRIDGE_V1.md").is_file()
          s = Path("src/sdmr/contextual_structure_evidence.py").read_text()
          for marker in ("retrospective_diagnostic_only", "shared_source_not_independent_replication", "future endpoint may only use prior predictors"):
              assert marker in s
          print("Synthetic-only bridge gate passed; no biological response accessed")
          PY
