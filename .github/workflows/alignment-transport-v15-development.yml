name: alignment-transport-v15-development

on:
  pull_request:
    paths:
      - 'src/sdmr/alignment_transport.py'
      - 'src/sdmr/alignment_transport_v15_development.py'
      - 'src/sdmr/alignment_transport_v15_aggregate.py'
      - 'configs/alignment_transport_v15_development.json'
      - 'configs/alignment_transport_v15_focus_manifest.csv'
      - 'tests/test_alignment_transport.py'
      - 'tests/test_alignment_transport_v15_development.py'
      - '.github/workflows/alignment-transport-v15-development.yml'
  workflow_dispatch:

concurrency:
  group: alignment-transport-v15-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: read

env:
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e . pytest
      - run: pytest -q tests/test_alignment_transport.py tests/test_alignment_transport_v15_development.py

  family:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        family: [gaussian, asymmetric, soft_threshold, interaction, omitted_driver, observation_confounded]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e .
      - run: python -m sdmr.alignment_transport_v15_development fit-family --family '${{ matrix.family }}' --output-dir output
      - uses: actions/upload-artifact@v4
        with:
          name: alignment-transport-v15-${{ matrix.family }}-${{ github.sha }}
          path: output/
          retention-days: 90

  aggregate:
    needs: family
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: alignment-transport-v15-*-${{ github.sha }}
          path: inputs
      - run: python -m sdmr.alignment_transport_v15_aggregate --input-dir inputs --output-dir development
      - uses: actions/upload-artifact@v4
        with:
          name: alignment-transport-v15-development-${{ github.sha }}
          path: development/
          retention-days: 90
