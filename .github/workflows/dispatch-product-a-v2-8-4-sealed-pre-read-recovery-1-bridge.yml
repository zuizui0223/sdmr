name: Dispatch authorized Product-A v2.8.4 sealed pre-read recovery bridge

on:
  push:
    branches:
      - ops/dispatch-v284-sealed-pre-read-recovery-1
    paths:
      - .github/workflows/dispatch-product-a-v2-8-4-sealed-pre-read-recovery-1-bridge.yml

permissions:
  actions: write
  contents: read

concurrency:
  group: dispatch-product-a-v2-8-4-sealed-pre-read-recovery-1-bridge
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.repository == 'zuizui0223/sdmr' && github.ref == 'refs/heads/ops/dispatch-v284-sealed-pre-read-recovery-1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify exact recovery authorization and create only the second workflow_dispatch event
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_WORKFLOW: product-a-v2-8-4-sealed-authorized.yml
          TARGET_PATH: .github/workflows/product-a-v2-8-4-sealed-authorized.yml
          AUTH_PATH: configs/product_a_v2_8_4_sealed_execution_authorization.json
          TARGET_REF: frozen/product-a-v2-8-4-sealed-v1-pre-read-recovery-1
          TARGET_SHA: 586700d531fb815fa452e3a8ca31f4c97e070443
          TARGET_CALLER_SHA256: 308f49bc23027bb1fcb4bd4d5fab3f1deb2b9f52ada509737ca81f853799be95
          TARGET_AUTH_DIGEST: 6d60e52b6ffdd8e020d1a124248520759e03d5f1e939d27dd486f980270185b8
          TARGET_IMPLEMENTATION_REF: 6c075e1ebc13713c15ceaffd94fd4c4e61eb75ad
          PRIOR_RUN_ID: '33309627503'
          PRIOR_SHA: ba12f96be48545819a72fc714f083cd5c00520ad
          PRIOR_REF: frozen/product-a-v2-8-4-sealed-v1
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ['GH_TOKEN']
          repo = os.environ['REPOSITORY']
          workflow = os.environ['TARGET_WORKFLOW']
          workflow_path = os.environ['TARGET_PATH']
          auth_path = os.environ['AUTH_PATH']
          target_ref = os.environ['TARGET_REF']
          target_sha = os.environ['TARGET_SHA']
          caller_sha = os.environ['TARGET_CALLER_SHA256']
          auth_digest = os.environ['TARGET_AUTH_DIGEST']
          implementation_ref = os.environ['TARGET_IMPLEMENTATION_REF']
          prior_run_id = int(os.environ['PRIOR_RUN_ID'])
          prior_sha = os.environ['PRIOR_SHA']
          prior_ref = os.environ['PRIOR_REF']
          api = f'https://api.github.com/repos/{repo}'
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'sdmr-v284-sealed-pre-read-recovery-dispatch-bridge',
          }

          def request_json(url, *, method='GET', payload=None):
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(url, data=data, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      raw = response.read()
                      parsed = json.loads(raw) if raw else None
                      return int(response.status), parsed
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode('utf-8', errors='replace')
                  raise RuntimeError(
                      f'GitHub API {method} {url} failed: {exc.code} {body}'
                  ) from exc

          # The recovery branch must be an immutable pointer to the reviewed
          # recovery authorization merge.
          ref_url = f"{api}/git/ref/heads/{urllib.parse.quote(target_ref, safe='/')}"
          _, ref_payload = request_json(ref_url)
          observed_sha = str((ref_payload.get('object') or {}).get('sha', ''))
          if observed_sha != target_sha:
              raise SystemExit(
                  f'frozen recovery ref changed: expected={target_sha} observed={observed_sha}'
              )

          def content_bytes(path):
              url = (
                  f"{api}/contents/{path}"
                  f"?ref={urllib.parse.quote(target_ref, safe='')}"
              )
              _, payload = request_json(url)
              return base64.b64decode(payload['content'])

          caller_raw = content_bytes(workflow_path)
          observed_caller_sha = hashlib.sha256(
              caller_raw.replace(b'\r\n', b'\n')
          ).hexdigest()
          if observed_caller_sha != caller_sha:
              raise SystemExit(
                  f'recovery caller hash changed: expected={caller_sha} observed={observed_caller_sha}'
              )

          auth = json.loads(content_bytes(auth_path).decode('utf-8'))
          embedded = str(auth.get('authorization_receipt_digest', ''))
          auth_body = dict(auth)
          auth_body.pop('authorization_receipt_digest', None)
          observed_auth_digest = hashlib.sha256(
              json.dumps(auth_body, sort_keys=True, separators=(',', ':')).encode()
          ).hexdigest()
          if embedded != auth_digest or observed_auth_digest != auth_digest:
              raise SystemExit('recovery authorization digest changed')
          if auth.get('authorized_ref') != f'refs/heads/{target_ref}':
              raise SystemExit('recovery authorization target ref changed')
          if int(auth.get('operational_attempt', -1)) != 2:
              raise SystemExit('recovery authorization operational attempt changed')
          if auth.get('implementation_identity', {}).get('runtime_ref') != implementation_ref:
              raise SystemExit('recovery implementation ref changed')
          recovery = auth.get('pre_read_recovery', {})
          if recovery.get('authorized') is not True:
              raise SystemExit('pre-read recovery is not authorized')
          if int(recovery.get('prior_workflow_run_id', -1)) != prior_run_id:
              raise SystemExit('prior pre-read failure run changed')
          if recovery.get('prior_sealed_read_entered') is not False:
              raise SystemExit('recovery cannot follow sealed-read entry')
          if recovery.get('prior_sealed_ecological_outcomes_read') is not False:
              raise SystemExit('recovery cannot follow sealed outcome read')

          workflow_segment = urllib.parse.quote(workflow, safe='')
          runs_url = (
              f'{api}/actions/workflows/{workflow_segment}/runs'
              '?event=workflow_dispatch&per_page=100'
          )
          _, before = request_json(runs_url)
          before_rows = list(before.get('workflow_runs', []))
          if int(before.get('total_count', -1)) != 1 or len(before_rows) != 1:
              ids = [int(row['id']) for row in before_rows]
              raise SystemExit(
                  f'recovery dispatch requires exactly one prior run: total={before.get("total_count")} ids={ids}'
              )
          prior = before_rows[0]
          prior_expected = {
              'id': prior_run_id,
              'event': 'workflow_dispatch',
              'status': 'completed',
              'conclusion': 'failure',
              'head_branch': prior_ref,
              'head_sha': prior_sha,
              'path': workflow_path,
              'run_attempt': 1,
              'run_number': 1,
          }
          for key, expected in prior_expected.items():
              observed = prior.get(key)
              if observed != expected:
                  raise SystemExit(
                      f'prior run identity mismatch for {key}: expected={expected!r} observed={observed!r}'
                  )

          dispatch_url = f'{api}/actions/workflows/{workflow_segment}/dispatches'
          status, dispatch_response = request_json(
              dispatch_url,
              method='POST',
              payload={'ref': target_ref},
          )
          if status not in (200, 204):
              raise SystemExit(f'unexpected recovery dispatch status: {status}')
          returned_id = None
          if isinstance(dispatch_response, dict) and dispatch_response.get('workflow_run_id') is not None:
              returned_id = int(dispatch_response['workflow_run_id'])

          rows = None
          for _ in range(60):
              _, after = request_json(runs_url)
              candidate = list(after.get('workflow_runs', []))
              ids = {int(row['id']) for row in candidate}
              if int(after.get('total_count', -1)) == 2 and len(candidate) == 2 and prior_run_id in ids:
                  rows = candidate
                  break
              if int(after.get('total_count', -1)) > 2 or len(candidate) > 2:
                  raise SystemExit(
                      f'third workflow dispatch materialized: total={after.get("total_count")} ids={sorted(ids)}'
                  )
              time.sleep(2)
          if rows is None:
              raise SystemExit('recovery workflow_dispatch did not materialize within 120 seconds')

          fresh = [row for row in rows if int(row['id']) != prior_run_id]
          if len(fresh) != 1:
              raise SystemExit('recovery run identity is not unique')
          observed = fresh[0]
          run_id = int(observed['id'])
          checks = {
              'event': 'workflow_dispatch',
              'head_branch': target_ref,
              'head_sha': target_sha,
              'path': workflow_path,
              'run_attempt': 1,
              'run_number': 2,
          }
          for key, expected in checks.items():
              if observed.get(key) != expected:
                  raise SystemExit(
                      f'recovery run identity mismatch for {key}: expected={expected!r} observed={observed.get(key)!r}'
                  )
          if returned_id is not None and returned_id != run_id:
              raise SystemExit(
                  f'dispatch response/run-list ID mismatch: {returned_id} vs {run_id}'
              )

          print(f'V284_SEALED_RECOVERY_RUN_ID={run_id}')
          print(f'V284_SEALED_RECOVERY_RUN_URL={observed["html_url"]}')
          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a', encoding='utf-8') as handle:
                  handle.write('## Product-A v2.8.4 sealed pre-read recovery dispatched\n\n')
                  handle.write(f'- run ID: `{run_id}`\n')
                  handle.write(f'- prior failed run ID: `{prior_run_id}`\n')
                  handle.write(f'- frozen recovery ref: `{target_ref}`\n')
                  handle.write(f'- frozen recovery SHA: `{target_sha}`\n')
                  handle.write('- target workflow_dispatch count after dispatch: `2`\n')
                  handle.write('- third dispatch allowed: `false`\n')
          PY
