name: fia-climate-density-one-snapshot-v4

on:
  pull_request:
    paths:
      - 'experiments/fia_climate_density_one_snapshot_v4.py'
      - 'experiments/fia_climate_density_growth_v1.py'
      - 'tests/test_fia_climate_density_one_snapshot_v4.py'
      - 'tests/test_fia_climate_density_growth_v1.py'
      - 'docs/FIA_CLIMATE_DENSITY_ONE_SNAPSHOT_V4.md'
      - '.github/workflows/fia-climate-density-one-snapshot-v4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixed-first-exploratory-response:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research and validation dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2,<4' 'pytest>=8,<10'
      - name: Offline model and source boundaries
        run: |
          python -m pytest -q \
             tests/test_fia_climate_tree_source_gate_v3.py \
             tests/test_fia_climate_density_growth_v1.py \
             tests/test_fia_climate_density_one_snapshot_v4.py
      - name: Acquire once, freeze source identities, then open selected growth on same ZIP bytes only
        run: |
          python experiments/fia_climate_density_one_snapshot_v4.py \
            --noaa-csv results/fia_noaa_county_climate_v1/noaa_county_growing_months_1991_2025.csv \
            --noaa-receipt results/fia_noaa_county_climate_v1/source_receipt.json \
            --output-dir artifacts/fia_climate_density_snapshot_v4
      - name: Keep complete source-only, outcome and failed-state receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fia-climate-density-one-snapshot-v4
          path: artifacts/fia_climate_density_snapshot_v4/
          if-no-files-found: warn
