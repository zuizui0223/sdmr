name: citable-product-a-v1

on:
  push:
    branches:
      - agent/nested-spatial-raster-benchmark
    paths:
      - 'configs/product_a_v1_target_cache.csv'
      - 'configs/product_a_v1_rerun_trigger.txt'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: citable-product-a-v1
  cancel-in-progress: true

jobs:
  product-a-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install fixed-source Product-A dependencies
        run: python -m pip install -e '.[geo,parquet]'

      - name: Read and bind frozen focal/target contracts
        id: contracts
        run: |
          python - <<'PY'
          import csv, os
          from pathlib import Path

          def one(path):
              rows = list(csv.DictReader(Path(path).open(encoding='utf-8')))
              if len(rows) != 1:
                  raise SystemExit(f'{path} must contain exactly one data row')
              return rows[0]

          snapshot = one('configs/gbif_snapshot_v1.csv')
          focal = one('configs/product_a_v1_focal_cache.csv')
          target = one('configs/product_a_v1_target_cache.csv')
          date = snapshot['snapshot_date'].strip()
          doi = snapshot['snapshot_doi'].strip().lower()
          citation = snapshot['citation_sha256'].strip().lower()
          for label, row in [('focal', focal), ('target', target)]:
              if row['snapshot_date'].strip() != date or row['snapshot_doi'].strip().lower() != doi:
                  raise SystemExit(f'{label} cache does not match frozen snapshot date/DOI')
              if row['citation_sha256'].strip().lower() != citation:
                  raise SystemExit(f'{label} cache citation SHA does not match frozen snapshot')

          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'SNAPSHOT_DATE={date}\n')
              env.write(f'SNAPSHOT_DOI={snapshot["snapshot_doi"].strip()}\n')
              env.write(f'CITATION_SHA256={citation}\n')
              env.write(f'FOCAL_SHA256={focal["focal_sha256"].strip().lower()}\n')
              env.write(f'FOCAL_QUERY_SHA256={focal["focal_query_sha256"].strip().lower()}\n')
              env.write(f'TARGET_SHA256={target["target_sha256"].strip().lower()}\n')
              env.write(f'TARGET_QUERY_SHA256={target["target_query_sha256"].strip().lower()}\n')
              env.write('SEED=20260814\n')
              env.write('SPATIAL_TEST_FRACTION=0.20\n')
              env.write('TAXON_VALIDATION_FRACTION=0.25\n')
              env.write('MIN_OCCURRENCES=80\n')
              env.write('MIN_UNIQUE_CELLS=50\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f'focal_run_id={focal["source_run_id"].strip()}\n')
              out.write(f'focal_artifact={focal["artifact_name"].strip()}\n')
              out.write(f'target_run_id={target["source_run_id"].strip()}\n')
              out.write(f'target_artifact={target["artifact_name"].strip()}\n')
          print('snapshot', date, doi)
          print('focal source', focal['source_run_id'], focal['artifact_name'])
          print('target source', target['source_run_id'], target['artifact_name'])
          PY

      - name: Preflight all 43 active CHELSA rasters
        run: |
          sdmr-chelsa \
            --manifest configs/chelsa_v2_1_plant_candidates.csv \
            --output-dir citable_preflight \
            --probe \
            --require-probe-success

      - name: Download frozen focal source artifact
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.contracts.outputs.focal_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ steps.contracts.outputs.focal_artifact }}
          path: focal_bundle

      - name: Download frozen target-group source artifact
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.contracts.outputs.target_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ steps.contracts.outputs.target_artifact }}
          path: target_bundle

      - name: Verify both fixed source artifacts before analysis
        run: |
          mkdir -p citable_input citable_result
          cp focal_bundle/citable_input/focal.parquet citable_input/focal.parquet
          cp focal_bundle/citable_input/focal.provenance.csv citable_input/focal.provenance.csv
          cp focal_bundle/citable_input/focal.parquet.citation.txt citable_input/focal.parquet.citation.txt
          cp target_bundle/target_group.parquet citable_input/target_group.parquet
          cp target_bundle/target_group.provenance.csv citable_input/target_group.provenance.csv
          cp target_bundle/target_group.parquet.citation.txt citable_input/target_group.parquet.citation.txt
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          import pandas as pd

          def sha(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          checks = [
              ('focal', 'FOCAL_SHA256', 'FOCAL_QUERY_SHA256'),
              ('target_group', 'TARGET_SHA256', 'TARGET_QUERY_SHA256'),
          ]
          for label, file_env, query_env in checks:
              path = Path(f'citable_input/{label}.parquet')
              prov_path = Path(f'citable_input/{label}.provenance.csv')
              citation_path = Path(f'citable_input/{label}.parquet.citation.txt')
              actual = sha(path)
              if actual != os.environ[file_env]:
                  raise SystemExit(f'{label} file SHA mismatch: {actual}')
              prov = pd.read_csv(prov_path).iloc[0]
              if str(prov.get('sha256','')).lower() != actual:
                  raise SystemExit(f'{label} provenance file SHA mismatch')
              if str(prov.get('query_sha256','')).lower() != os.environ[query_env]:
                  raise SystemExit(f'{label} query SHA mismatch')
              citation = sha(citation_path)
              if citation != os.environ['CITATION_SHA256']:
                  raise SystemExit(f'{label} citation SHA mismatch')
              if str(prov.get('snapshot_citation_sha256','')).lower() != citation:
                  raise SystemExit(f'{label} provenance citation SHA mismatch')
              if str(prov.get('snapshot_date','')) != os.environ['SNAPSHOT_DATE']:
                  raise SystemExit(f'{label} snapshot date mismatch')
              if str(prov.get('snapshot_doi','')).lower() != os.environ['SNAPSHOT_DOI'].lower():
                  raise SystemExit(f'{label} snapshot DOI mismatch')
              frame = pd.read_parquet(path)
              print(label, 'rows', len(frame), 'species', frame['species'].nunique() if 'species' in frame else None)
          PY

      - name: Run leakage-safe M-robust Product-A benchmark
        run: |
          SOURCE_KEY="fixed-snapshot:${SNAPSHOT_DATE}:${SNAPSHOT_DOI}"
          sdmr-pilot-grid \
            --gbif-download citable_input/focal.parquet \
            --gbif-download-key "$SOURCE_KEY" \
            --target-group-download citable_input/target_group.parquet \
            --target-group-download-key "$SOURCE_KEY" \
            --checklist-key "snapshot-interpreted:${SNAPSHOT_DATE}" \
            --taxa configs/product_a_pilot_taxa_v1.csv \
            --grid configs/product_a_buffer_specs_v1.csv \
            --manifest configs/chelsa_v2_1_plant_candidates.csv \
            --output-dir citable_result \
            --m-grid-as-sensitivity \
            --min-occurrences "$MIN_OCCURRENCES" \
            --min-unique-cells "$MIN_UNIQUE_CELLS" \
            --gate-cell-size-degrees 0.05 \
            --spatial-test-fraction "$SPATIAL_TEST_FRACTION" \
            --taxon-validation-fraction "$TAXON_VALIDATION_FRACTION" \
            --vif-threshold 5 \
            --max-predictors 8 \
            --random-baseline-repeats 10 \
            --seed "$SEED"

      - name: Contrast canonical-M AUC/Boyce selection against SDMR transfer selection
        run: |
          sdmr-compare-evaluation \
            --product-a-dir citable_result \
            --manifest configs/chelsa_v2_1_plant_candidates.csv \
            --canonical-specification buffer_300km

      - name: Require full panel and strict information barrier
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          expected = set(pd.read_csv('configs/product_a_pilot_taxa_v1.csv')['scientific_name'].astype(str))
          gate = pd.read_csv('citable_result/species_gate.csv')
          eligible = set(gate.loc[gate['eligible'].astype(bool), 'species'].astype(str))
          if eligible != expected:
              raise SystemExit(f'Product-A split loses predeclared taxa: missing={sorted(expected-eligible)}, extra={sorted(eligible-expected)}')
          spec = json.loads(Path('citable_result/pilot_grid_specification.json').read_text(encoding='utf-8'))
          if spec.get('outer_sealed_before_M') is not True:
              raise SystemExit('sealed occurrence assignment did not precede M/background construction')
          if spec.get('m_grid_as_sensitivity') is not True:
              raise SystemExit('M was optimized instead of treated as sensitivity')
          contrast = json.loads(Path('citable_result/selector_contrast_contract.json').read_text(encoding='utf-8'))
          if contrast.get('selection_data') != 'discovery_taxa_only':
              raise SystemExit('conventional-vs-SDMR selector contrast leaked validation taxa into selection')
          print('strict Product-A gate passed for', len(eligible), 'taxa')
          PY

      - name: Record immutable fixed-source Product-A contract
        if: always()
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          import pandas as pd

          result = Path('citable_result'); result.mkdir(parents=True, exist_ok=True)
          def sha(path):
              p = Path(path)
              return hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else ''
          def one(path):
              p = Path(path)
              if not p.exists(): return {}
              frame = pd.read_csv(p)
              return frame.iloc[0].to_dict() if len(frame) else {}
          def choice(path):
              out = {}
              p = Path(path)
              if p.exists():
                  for line in p.read_text(encoding='utf-8').splitlines():
                      if '=' in line:
                          k,v = line.split('=',1); out[k] = v
              return out

          focal = one('citable_input/focal.provenance.csv')
          target = one('citable_input/target_group.provenance.csv')
          probe_path = Path('citable_preflight/chelsa_raster_probe.csv')
          probe = pd.read_csv(probe_path) if probe_path.exists() else pd.DataFrame()
          spec_path = result/'pilot_grid_specification.json'
          spec = json.loads(spec_path.read_text(encoding='utf-8')) if spec_path.exists() else {}
          contrast_path = result/'selector_contrast_contract.json'
          contrast = json.loads(contrast_path.read_text(encoding='utf-8')) if contrast_path.exists() else {}
          criteria_sha = sha('configs/product_a_promotion_criteria_v1.csv')
          contract = {
              'protocol_version': 'product_a_v1_leakage_safe_M_sensitivity_fixed_sources',
              'source_head_sha': os.environ.get('GITHUB_SHA'),
              'snapshot_date': os.environ.get('SNAPSHOT_DATE'),
              'snapshot_doi': os.environ.get('SNAPSHOT_DOI'),
              'citation_sha256_expected': os.environ.get('CITATION_SHA256'),
              'citation_sha256_focal': focal.get('snapshot_citation_sha256',''),
              'target_citation_sha256': target.get('snapshot_citation_sha256',''),
              'focal_subset_sha256': focal.get('sha256',''),
              'target_subset_sha256': target.get('sha256',''),
              'focal_query_sha256': focal.get('query_sha256',''),
              'target_query_sha256': target.get('query_sha256',''),
              'focal_cache_source_run_id': '${{ steps.contracts.outputs.focal_run_id }}',
              'focal_cache_artifact': '${{ steps.contracts.outputs.focal_artifact }}',
              'target_cache_source_run_id': '${{ steps.contracts.outputs.target_run_id }}',
              'target_cache_artifact': '${{ steps.contracts.outputs.target_artifact }}',
              'seed': int(os.environ.get('SEED','0')),
              'spatial_test_fraction': float(os.environ.get('SPATIAL_TEST_FRACTION','nan')),
              'taxon_validation_fraction': float(os.environ.get('TAXON_VALIDATION_FRACTION','nan')),
              'min_occurrences': int(os.environ.get('MIN_OCCURRENCES','0')),
              'min_unique_cells': int(os.environ.get('MIN_UNIQUE_CELLS','0')),
              'taxon_panel_sha256': sha('configs/product_a_pilot_taxa_v1.csv'),
              'm_grid_sha256': sha('configs/product_a_buffer_specs_v1.csv'),
              'candidate_manifest_sha256': sha('configs/chelsa_v2_1_plant_candidates.csv'),
              'promotion_criteria_sha256': criteria_sha,
              'focal_thin_cell_size_degrees': spec.get('focal_thin_cell_size_degrees'),
              'outer_sealed_before_M': bool(spec.get('outer_sealed_before_M', False)),
              'm_grid_as_sensitivity': bool(spec.get('m_grid_as_sensitivity', False)),
              'chelsa_probe_rows': int(len(probe)),
              'chelsa_probe_failures': int(probe['status'].ne('ok').sum()) if 'status' in probe else None,
              'protocol_choice': choice(result/'product_a_protocol_choice.txt'),
              'selector_contrast_present': bool(contrast),
              'selector_contrast_canonical_M': contrast.get('canonical_specification'),
              'selector_contrast_selection_data': contrast.get('selection_data'),
              'selector_contrast_evaluation_data': contrast.get('evaluation_data'),
          }
          (result/'citable_snapshot_contract.json').write_text(json.dumps(contract, indent=2, sort_keys=True), encoding='utf-8')
          PY
          cp configs/gbif_snapshot_v1.csv citable_result/
          cp configs/product_a_v1_focal_cache.csv citable_result/
          cp configs/product_a_v1_target_cache.csv citable_result/
          cp configs/product_a_promotion_criteria_v1.csv citable_result/
          cp citable_input/*.citation.txt citable_result/ 2>/dev/null || true
          cat > citable_result/CITABLE_PILOT_BOUNDARY.txt <<'EOF'
          Fixed-source DOI-backed Product-A evidence. Development/tuning occurs without validation-taxon feedback. Focal occurrences
          are deterministically thinned and spatially sealed before M/background construction; M=150/300/500 km is a sensitivity
          set, not an optimized candidate. Conventional canonical-M AUC-equivalent and Boyce selectors are frozen from discovery
          taxa only and compared head-to-head with the SDMR M-robust selector on the same unseen taxa across all M specifications.
          AUC/Boyce remain local score components; the Product-A claim concerns transfer-stability of the selection procedure.
          EOF

      - name: Upload citable Product-A v1 bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: citable-product-a-v1-${{ env.SNAPSHOT_DATE }}
          path: |
            citable_preflight/
            citable_input/
            citable_result/
          if-no-files-found: error
          retention-days: 90
