name: product-a-prepared-method-sweep

on:
  workflow_run:
    workflows: ["product-a-v1-feature-cache"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful block-v2 feature-cache run ID"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: product-a-prepared-method-sweep-${{ github.event.workflow_run.id || inputs.source_run_id }}
  cancel-in-progress: true

jobs:
  resolve:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.source.outputs.run_id }}
    steps:
      - name: Resolve feature-cache source run
        id: source
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "run_id=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
          else
            echo "run_id=${{ inputs.source_run_id }}" >> "$GITHUB_OUTPUT"
          fi

  sweep:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - label: linear_c1_vif5
            profile: linear_l2_c1
            vif: '5'
          - label: linear_c1_vif10
            profile: linear_l2_c1
            vif: '10'
          - label: linear_regularized_vif5
            profile: linear_regularized
            vif: '5'
          - label: linear_regularized_vif10
            profile: linear_regularized
            vif: '10'
          - label: full_vif5
            profile: full
            vif: '5'
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install development engine
        run: python -m pip install -e '.[parquet]'
      - name: Download frozen feature evidence
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ needs.resolve.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: product-a-v1-feature-cache-block-v2-2026-08-01
          path: feature_cache
      - name: Verify cache contains no preselected method
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('feature_cache/feature_cache_contract.json').read_text())
          if c.get('contains_method_winner') is not False:
              raise SystemExit('feature cache contains a method winner')
          if c.get('raster_sampling_engine')!='native_block_grouped_exact_pixel':
              raise SystemExit('feature cache is not block-v2 exact sampling')
          if int(c.get('n_predictors',0))!=43 or int(c.get('n_taxa',0))!=12:
              raise SystemExit('feature cache has wrong predictor/taxon count')
          print(c)
          PY
      - name: Run method-only development search
        run: |
          sdmr-prepared-benchmark \
            --prepared-dir feature_cache \
            --manifest configs/chelsa_v2_1_plant_candidates.csv \
            --output-dir sweep_result \
            --model-profile '${{ matrix.profile }}' \
            --taxon-validation-fraction 0.25 \
            --spatial-test-fraction 0.20 \
            --vif-threshold '${{ matrix.vif }}' \
            --max-predictors 8 \
            --random-baseline-repeats 0 \
            --seed 20260814 \
            --benchmark-jobs 4 \
            --model-spec-jobs 1
          sdmr-generalization-diagnostics \
            --discovery-metrics sweep_result/protocol_discovery_metrics.csv \
            --output-dir sweep_result/generalization
      - name: Summarize selected method
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          choice={}
          for line in Path('sweep_result/product_a_protocol_choice.txt').read_text().splitlines():
              if '=' in line:
                  k,v=line.split('=',1); choice[k]=v
          validation=pd.read_csv('sweep_result/protocol_validation_metrics.csv')
          selected=validation.loc[
              validation['strategy'].astype(str).eq(choice['winning_strategy'])
              & validation['universe'].astype(str).eq(choice['winning_universe'])
          ]
          discovery=pd.read_csv('sweep_result/protocol_discovery_summary.csv')
          general=pd.read_csv('sweep_result/generalization/inner_outer_generalization_summary.csv').iloc[0].to_dict()
          summary={
              'label':'${{ matrix.label }}',
              'model_profile':'${{ matrix.profile }}',
              'vif_threshold':float('${{ matrix.vif }}'),
              'winning_universe':choice['winning_universe'],
              'winning_strategy':choice['winning_strategy'],
              'mean_selected_validation_presence_rank':float(selected['presence_rank'].mean()),
              'median_selected_validation_presence_rank':float(selected['presence_rank'].median()),
              'n_selected_validation_cases':int(len(selected)),
              'discovery_mean_case_rank_score':float(discovery.iloc[0]['mean_case_rank_score']),
              'discovery_spec_win_fraction':float(discovery.iloc[0]['spec_win_fraction']),
              'row_level_inner_outer_spearman':general.get('row_level_inner_outer_spearman'),
              'inner_winner_matches_outer_winner_fraction':general.get('inner_winner_matches_outer_winner_fraction'),
              'mean_outer_regret':general.get('mean_outer_regret'),
          }
          Path('sweep_result/sweep_summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True),encoding='utf-8')
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: product-a-prepared-sweep-${{ matrix.label }}
          path: sweep_result/
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: [resolve,sweep]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: product-a-prepared-sweep-*
          path: sweep_parts
      - name: Aggregate development sweep
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          rows=[]
          for path in sorted(Path('sweep_parts').glob('*/sweep_summary.json')):
              rows.append(json.loads(path.read_text()))
          if not rows:
              raise SystemExit('no sweep summaries found')
          out=pd.DataFrame(rows).sort_values(
              ['mean_selected_validation_presence_rank','discovery_mean_case_rank_score'],
              ascending=[False,False],kind='mergesort'
          ).reset_index(drop=True)
          Path('sweep_aggregate').mkdir()
          out.to_csv('sweep_aggregate/prepared_method_sweep.csv',index=False)
          print(out.to_string(index=False))
          Path('sweep_aggregate/DEVELOPMENT_SWEEP_BOUNDARY.txt').write_text(
              'Development-only comparison on one frozen feature/split evidence set. It cannot trigger Product-A promotion; repeated full reruns remain required.\n'
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: product-a-prepared-method-sweep-aggregate
          path: sweep_aggregate/
          if-no-files-found: error
          retention-days: 30
