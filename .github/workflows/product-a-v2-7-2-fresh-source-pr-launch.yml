name: product-a-v2-7-2-fresh-source-pr-launch

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'configs/product_a_v2_7_2_fresh_source_pr_trigger.txt'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Dispatch exactly one frozen rank-2 raw-source acquisition
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.parse, urllib.request
          from pathlib import Path

          c=json.load(open('configs/product_a_v2_7_2_fresh_source_execution_contract.json'))
          if c.get('purpose')!='product_a_v2_7_2_fresh_raw_source_execution_contract':
              raise SystemExit('wrong v2.7.2 source execution contract')
          if c.get('execution_source_frozen_before_raw_source_outcome') is not True:
              raise SystemExit('source execution identity was not frozen before outcome')
          if c.get('requires_single_workflow_dispatch_run_for_frozen_source') is not True:
              raise SystemExit('source acquisition is not one-shot')
          scope=c.get('scope',{})
          for key in ('candidate_model_fitting_allowed','CHELSA_environmental_values_allowed','v2_7_1_sealed_rows_allowed','v2_7_2_sealed_confirmation_outcomes_allowed','empirical_confirmation_execution_allowed','scientific_promotion_allowed','product_b_unblocked'):
              if scope.get(key) is not False:
                  raise SystemExit(f'source launcher crossed frozen scope: {key}')

          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']; api=f'https://api.github.com/repos/{repo}'
          headers={
              'Authorization':f'Bearer {token}',
              'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28',
              'User-Agent':'sdmr-v272-fresh-source-launcher',
          }
          def request(url,*,method='GET',payload=None):
              data=None if payload is None else json.dumps(payload).encode()
              req=urllib.request.Request(url,data=data,headers=headers,method=method)
              with urllib.request.urlopen(req,timeout=60) as r:
                  raw=r.read(); return json.loads(raw) if raw else None
          def verify_blob(path,expected):
              quoted=urllib.parse.quote(path,safe='/')
              ref=urllib.parse.quote(c['frozen_ref'],safe='')
              payload=request(f'{api}/contents/{quoted}?ref={ref}')
              if payload.get('sha')!=expected:
                  raise SystemExit(f'frozen blob changed: {path}')
          verify_blob(c['source_acquisition_contract_path'],c['source_acquisition_contract_blob_sha'])
          verify_blob(c['confirmation_decision_contract_path'],c['confirmation_decision_contract_blob_sha'])

          def matches():
              p=request(f"{api}/actions/workflows/{c['workflow_file']}/runs?event=workflow_dispatch&per_page=100")
              return [r for r in p.get('workflow_runs',[]) if str(r.get('head_sha'))==c['implementation_sha'] and str(r.get('head_branch'))==c['frozen_ref'] and str(r.get('event'))=='workflow_dispatch']

          runs=matches(); dispatched=False
          if len(runs)>1:
              raise SystemExit(f"multiple frozen v2.7.2 source runs exist: {len(runs)}")
          if not runs:
              request(f"{api}/actions/workflows/{c['workflow_file']}/dispatches",method='POST',payload={'ref':c['frozen_ref']})
              dispatched=True
              for _ in range(24):
                  time.sleep(5); runs=matches()
                  if runs: break
          if len(runs)!=1:
              raise SystemExit(f"expected one frozen v2.7.2 source run, found {len(runs)}")
          run=runs[0]
          event=json.load(open(os.environ['GITHUB_EVENT_PATH']))
          receipt={
              'purpose':'product_a_v2_7_2_fresh_raw_source_launch_receipt',
              'pull_request':int(event['pull_request']['number']),
              'implementation_sha':c['implementation_sha'],
              'frozen_ref':c['frozen_ref'],
              'workflow_file':c['workflow_file'],
              'dispatched_now':dispatched,
              'run_id':int(run['id']),
              'run_number':int(run['run_number']),
              'status':str(run['status']),
              'conclusion':run.get('conclusion'),
              'raw_source_only':True,
              'empirical_confirmation_execution_allowed':False,
              'scientific_promotion_allowed':False,
              'product_b_unblocked':False,
          }
          Path('launch').mkdir()
          Path('launch/receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print(json.dumps(receipt,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: product-a-v2-7-2-fresh-source-launch-receipt
          path: launch/receipt.json
          retention-days: 90
