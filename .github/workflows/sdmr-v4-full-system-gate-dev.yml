name: sdmr-v4-full-system-gate-dev

on:
  push:
    branches:
      - 'design/sdmr-v3-process-identification'
    paths:
      - 'src/sdmr/process_id/known_truth/full_system_calibration.py'
      - 'tests/test_process_id_full_system_calibration.py'
      - '.github/workflows/sdmr-v4-full-system-gate-dev.yml'
  pull_request:
    paths:
      - 'src/sdmr/process_id/known_truth/full_system_calibration.py'
      - 'tests/test_process_id_full_system_calibration.py'

permissions:
  contents: read

concurrency:
  group: sdmr-v4-full-system-gate-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run v4 full-system calibration tests
        run: pytest -q tests/test_process_id_full_system_calibration.py
