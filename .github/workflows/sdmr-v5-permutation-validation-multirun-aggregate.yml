name: sdmr-v5-permutation-validation-multirun-aggregate

on:
  push:
    branches:
      - 'design/sdmr-v3-process-identification'
    paths:
      - 'configs/sdmr_v5_permutation_validation_multirun_aggregate_once.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: sdmr-v5-permutation-validation-multirun-aggregate
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install -e '.[test]'
      - name: Verify aggregate activation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("configs/sdmr_v5_permutation_validation_multirun_aggregate_once.json").read_text())
          assert x["purpose"]=="aggregate_v5_validation_across_original_and_continuation"
          assert x["original_run"]==36070724122
          assert x["continuation_run"]==36071786172
          assert x["expected_unique_shards"]==40
          assert x["scientific_settings_changed"] is False
          PY
      - name: Download original validation artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 'v5-perm-val-*'
          path: sources/original
          run-id: 36070724122
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download continuation validation artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 'v5-perm-val-*'
          path: sources/continuation
          run-id: 36071786172
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Strictly dedupe and aggregate validation evidence
        run: |
          python scripts/aggregate_sdmr_v5_permutation_validation_multirun.py \
            --input-root sources \
            --config configs/sdmr_v5_permutation_gate_validation_v1.json \
            --outdir validation-aggregate \
            --expected-unique-shards 40 \
            --source-run 36070724122 \
            --source-run 36071786172
      - name: Upload terminal validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: sdmr-v5-permutation-gate-validation-v1-multirun
          path: validation-aggregate/
          if-no-files-found: error
