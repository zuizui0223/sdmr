name: product-a-v2-7-1-fresh-presealed-shard-build-pr-launch

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'configs/product_a_v2_7_1_fresh_presealed_shard_build_pr_trigger.txt'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Dispatch at most one exact sealed-blind shard build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.request
          from pathlib import Path

          c=json.load(open('configs/product_a_v2_7_1_fresh_presealed_shard_build_contract.json'))
          e=c['execution_identity']
          if c.get('contract_frozen_before_any_fresh_pretruth_or_sealed_outcome') is not True:
              raise SystemExit('shard-build contract was not frozen before outcome')
          if e.get('execution_allowed') is not True:
              raise SystemExit('shard-build gate is closed')
          if c['build_scope'].get('sealed_blind_only') is not True:
              raise SystemExit('shard-build scope is not sealed-blind')
          if c['build_scope'].get('total_M_shards')!=216:
              raise SystemExit('shard-build denominator changed')
          if c['activation_rule'].get('activation_may_not_depend_on_candidate_scores_or_scientific_metric_values') is not True:
              raise SystemExit('shard-build activation boundary changed')

          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']; api=f'https://api.github.com/repos/{repo}'
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'sdmr-v271-presealed-shard-build-launcher'}
          def request(url,*,method='GET',payload=None):
              data=None if payload is None else json.dumps(payload).encode()
              req=urllib.request.Request(url,data=data,headers=headers,method=method)
              with urllib.request.urlopen(req,timeout=60) as r:
                  raw=r.read(); return json.loads(raw) if raw else None
          def matches():
              data=request(f"{api}/actions/workflows/{e['workflow_file']}/runs?event=workflow_dispatch&per_page=100")
              return [r for r in data.get('workflow_runs',[])
                      if r.get('head_sha')==e['implementation_sha']
                      and r.get('head_branch')==e['frozen_ref']
                      and r.get('event')=='workflow_dispatch']

          runs=matches(); dispatched=False
          if len(runs)>1:
              raise SystemExit(f'multiple exact shard-build runs exist: {len(runs)}')
          if not runs:
              request(f"{api}/actions/workflows/{e['workflow_file']}/dispatches",method='POST',payload={'ref':e['frozen_ref']})
              dispatched=True
              for _ in range(24):
                  time.sleep(5); runs=matches()
                  if runs: break
          if len(runs)!=1:
              raise SystemExit(f'expected one exact shard-build run, found {len(runs)}')
          run=runs[0]; event=json.load(open(os.environ['GITHUB_EVENT_PATH']))
          receipt={
              'purpose':'product_a_v2_7_1_fresh_presealed_shard_build_launch_receipt',
              'pull_request':int(event['pull_request']['number']),
              'implementation_sha':e['implementation_sha'],
              'frozen_ref':e['frozen_ref'],
              'workflow_file':e['workflow_file'],
              'dispatched_now':dispatched,
              'run_id':int(run['id']),
              'run_number':int(run['run_number']),
              'status':str(run['status']),
              'conclusion':run.get('conclusion'),
              'sealed_environment_read_allowed':False,
              'scientific_decision_generated':False,
              'scientific_promotion_allowed':False,
              'product_b_unblocked':False,
          }
          Path('launch').mkdir()
          Path('launch/receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print(json.dumps(receipt,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: product-a-v2-7-1-fresh-presealed-shard-build-launch-receipt
          path: launch/receipt.json
          retention-days: 90
