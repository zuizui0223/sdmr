name: Nature Product-A reporting figures

on:
  pull_request:
    paths:
      - 'scripts/build_nature_product_a_figures.py'
      - 'scripts/build_nature_product_a_concept_figures.py'
      - 'scripts/check_nature_manuscript_format.py'
      - 'docs/product_a_nature_**'
      - 'source_data/nature_**'
      - '.github/workflows/nature-product-a-reporting.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-reporting-figures:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      V272_ARTIFACT_ID: '9490817718'
      V284_PART1_ARTIFACT_ID: '9750048481'
      V284_PART2_ARTIFACT_ID: '9749405054'
      V284_PART3_ARTIFACT_ID: '9749815263'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Check Nature Article format and frozen headline claims
        run: python scripts/check_nature_manuscript_format.py

      - name: Install reporting dependencies
        run: python -m pip install numpy pandas matplotlib

      - name: Build conceptual/falsification figures from frozen reporting inputs
        run: |
          mkdir -p nature_reporting
          python scripts/build_nature_product_a_concept_figures.py \
            --v23-source source_data/nature_fig2_v23.csv \
            --output-dir nature_reporting

      - name: Download pinned frozen reporting artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p frozen/v272 frozen/v284/part1 frozen/v284/part2 frozen/v284/part3
          download_artifact () {
            local id="$1"
            local zip="$2"
            local dest="$3"
            gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "${zip}"
            unzip -q "${zip}" -d "${dest}"
          }
          download_artifact "$V272_ARTIFACT_ID" v272.zip frozen/v272
          download_artifact "$V284_PART1_ARTIFACT_ID" v284p1.zip frozen/v284/part1
          download_artifact "$V284_PART2_ARTIFACT_ID" v284p2.zip frozen/v284/part2
          download_artifact "$V284_PART3_ARTIFACT_ID" v284p3.zip frozen/v284/part3

      - name: Build controlled-truth and empirical figures with frozen assertions
        run: |
          python scripts/build_nature_product_a_figures.py \
            --v272-dir frozen/v272 \
            --v284-part frozen/v284/part1 \
            --v284-part frozen/v284/part2 \
            --v284-part frozen/v284/part3 \
            --output-dir nature_reporting

      - name: Verify expected products
        run: |
          test -s nature_reporting/nature_fig1_identification_logic.png
          test -s nature_reporting/nature_fig1_identification_logic.pdf
          test -s nature_reporting/nature_fig2_false_necessity.png
          test -s nature_reporting/nature_fig2_false_necessity.pdf
          test -s nature_reporting/nature_fig3_known_truth.png
          test -s nature_reporting/nature_fig3_known_truth.pdf
          test -s nature_reporting/nature_fig4_empirical_identity.png
          test -s nature_reporting/nature_fig4_empirical_identity.pdf
          test -s nature_reporting/nature_source_data_fig2.csv
          test -s nature_reporting/nature_source_data_fig3.csv
          test -s nature_reporting/nature_source_data_fig4.csv
          test -s nature_reporting/nature_source_data_fig4_parts.csv
          python - <<'PY'
          import pandas as pd
          f2 = pd.read_csv('nature_reporting/nature_source_data_fig2.csv')
          f3 = pd.read_csv('nature_reporting/nature_source_data_fig3.csv')
          f4 = pd.read_csv('nature_reporting/nature_source_data_fig4.csv')
          parts = pd.read_csv('nature_reporting/nature_source_data_fig4_parts.csv')
          assert len(f2) == 3
          assert len(f3) == 6
          assert len(f4) == 108
          assert len(parts) == 3
          assert f4['candidate_identical'].all()
          assert f4['selected_predictors_identical'].all()
          assert f4['ecological_candidate'].nunique() == 1
          assert f4['ecological_candidate'].iat[0] == 'all|logit_l2_C0.1_degree1_rs0'
          assert parts['nondominated'].all()
          assert not parts['strict_improvement'].any()
          assert (parts['mean_presence_rank_delta'] == 0.0).all()
          print(f2.to_string(index=False))
          print(f3.to_string(index=False))
          print(parts.to_string(index=False))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: nature-product-a-reporting-${{ github.sha }}
          path: nature_reporting/
          retention-days: 90
