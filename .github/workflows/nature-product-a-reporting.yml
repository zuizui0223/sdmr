name: Nature Product-A reporting figures

on:
  pull_request:
    paths:
      - 'scripts/build_nature_product_a_figures.py'
      - 'scripts/build_nature_product_a_concept_figures.py'
      - 'scripts/render_nature_fig3_counterfactual.py'
      - 'scripts/check_v272_concrete_process_identification.py'
      - 'scripts/check_nature_manuscript_format.py'
      - 'docs/product_a_nature_**'
      - 'docs/product_a_final_claim_spine.md'
      - 'docs/product_a_counterfactual_process_recovery_result_2026-09-06.md'
      - 'source_data/nature_**'
      - '.github/workflows/nature-product-a-reporting.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-reporting-figures:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      V272_ARTIFACT_ID: '9490817718'
      V284_PART1_ARTIFACT_ID: '9750048481'
      V284_PART2_ARTIFACT_ID: '9749405054'
      V284_PART3_ARTIFACT_ID: '9749815263'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Check Nature Article format and frozen headline claims
        run: python scripts/check_nature_manuscript_format.py

      - name: Install reporting dependencies
        run: python -m pip install numpy pandas matplotlib

      - name: Build conceptual and falsification figures
        run: |
          mkdir -p nature_reporting
          python scripts/build_nature_product_a_concept_figures.py \
            --v23-source source_data/nature_fig2_v23.csv \
            --output-dir nature_reporting

      - name: Download pinned predecessor and empirical reporting artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p frozen/v272 frozen/v284/part1 frozen/v284/part2 frozen/v284/part3
          download_artifact () {
            local id="$1"
            local zip="$2"
            local dest="$3"
            gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "${zip}"
            unzip -q "${zip}" -d "${dest}"
          }
          download_artifact "$V272_ARTIFACT_ID" v272.zip frozen/v272
          download_artifact "$V284_PART1_ARTIFACT_ID" v284p1.zip frozen/v284/part1
          download_artifact "$V284_PART2_ARTIFACT_ID" v284p2.zip frozen/v284/part2
          download_artifact "$V284_PART3_ARTIFACT_ID" v284p3.zip frozen/v284/part3

      - name: Reconstruct predecessor and empirical reporting products
        run: |
          python scripts/check_v272_concrete_process_identification.py \
            --v272-dir frozen/v272 \
            --output-dir nature_reporting
          python scripts/build_nature_product_a_figures.py \
            --v272-dir frozen/v272 \
            --v284-part frozen/v284/part1 \
            --v284-part frozen/v284/part2 \
            --v284-part frozen/v284/part3 \
            --output-dir nature_reporting

      - name: Render replicated counterfactual Figure 3
        run: |
          python scripts/render_nature_fig3_counterfactual.py \
            --methods source_data/nature_fig3_counterfactual_methods.csv \
            --process source_data/nature_fig3_counterfactual_process_summary.csv \
            --sets source_data/nature_fig3_counterfactual_process_sets.csv \
            --output-dir nature_reporting

      - name: Verify expected products and scientific headline values
        run: |
          test -s nature_reporting/nature_fig1_identification_logic.png
          test -s nature_reporting/nature_fig1_identification_logic.pdf
          test -s nature_reporting/nature_fig2_false_necessity.png
          test -s nature_reporting/nature_fig2_false_necessity.pdf
          test -s nature_reporting/nature_fig3_known_truth.png
          test -s nature_reporting/nature_fig3_known_truth.pdf
          test -s nature_reporting/nature_fig4_empirical_identity.png
          test -s nature_reporting/nature_fig4_empirical_identity.pdf
          test -s nature_reporting/nature_source_data_fig2.csv
          test -s nature_reporting/nature_source_data_fig4.csv
          test -s nature_reporting/nature_source_data_fig4_parts.csv
          python - <<'PY'
          import numpy as np
          import pandas as pd

          methods = pd.read_csv('source_data/nature_fig3_counterfactual_methods.csv')
          proc = pd.read_csv('source_data/nature_fig3_counterfactual_process_summary.csv')
          sets = pd.read_csv('source_data/nature_fig3_counterfactual_process_sets.csv')
          f4 = pd.read_csv('nature_reporting/nature_source_data_fig4.csv')
          parts = pd.read_csv('nature_reporting/nature_source_data_fig4_parts.csv')

          rep = methods.loc[methods.phase.eq('independent_replication_4401_4410')].set_index('method')
          val = methods.loc[methods.phase.eq('fresh_validation_4301_4305')].set_index('method')
          assert int(val.loc['counterfactual','exact_n']) == 30
          assert int(val.loc['auc_winner','exact_n']) == 25
          assert int(val.loc['old_stable_core','exact_n']) == 23
          assert int(rep.loc['counterfactual','exact_n']) == 65
          assert int(rep.loc['auc_winner','exact_n']) == 56
          assert int(rep.loc['old_stable_core','exact_n']) == 49
          assert int(rep.loc['counterfactual','model_disagreement_n']) == 30
          assert int(rep.loc['counterfactual','exact_when_models_disagree_n']) == 27

          cp = proc.loc[proc.method.eq('counterfactual')].set_index('process')
          assert tuple(cp.loc['temperature',['tp','fn','tn','fp']].astype(int)) == (40,0,28,2)
          assert tuple(cp.loc['water',['tp','fn','tn','fp']].astype(int)) == (40,0,28,2)
          assert tuple(cp.loc['soil',['tp','fn','tn','fp']].astype(int)) == (39,1,30,0)
          assert np.isclose(cp.loc['temperature','specificity'], 28/30)
          assert np.isclose(cp.loc['water','specificity'], 28/30)
          assert np.isclose(cp.loc['soil','sensitivity'], 39/40)
          assert int(sets.counterfactual_exact_n.sum()) == 65
          assert int(sets.auc_exact_n.sum()) == 56
          assert dict(zip(sets.process_set, sets.counterfactual_exact_n)) == {
              'T':8, 'W':8, 'S':10, 'T+W':10, 'T+S':10, 'W+S':10, 'T+W+S':9
          }

          assert len(f4) == 108
          assert f4['candidate_identical'].all()
          assert f4['selected_predictors_identical'].all()
          assert f4['ecological_candidate'].nunique() == 1
          assert f4['ecological_candidate'].iat[0] == 'all|logit_l2_C0.1_degree1_rs0'
          assert len(parts) == 3
          assert parts['nondominated'].all()
          assert not parts['strict_improvement'].any()
          assert (parts['mean_presence_rank_delta'] == 0.0).all()

          print(methods.to_string(index=False))
          print(proc.to_string(index=False))
          print(sets.to_string(index=False))
          print(parts.to_string(index=False))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: nature-product-a-reporting-${{ github.sha }}
          path: nature_reporting/
          retention-days: 90
