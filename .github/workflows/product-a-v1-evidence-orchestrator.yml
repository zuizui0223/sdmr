name: product-a-v1-evidence-orchestrator

on:
  push:
    branches:
      - agent/nested-spatial-raster-benchmark
    paths:
      - 'configs/product_a_v1_target_cache.csv'

permissions:
  contents: read
  actions: read

concurrency:
  group: product-a-v1-evidence-orchestrator
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      citable_run_id: ${{ steps.wait.outputs.run_id }}
      analysis_sha: ${{ steps.wait.outputs.analysis_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait for citable Product-A run on this exact source commit
        id: wait
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, time
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          repo = os.environ['GITHUB_REPOSITORY']
          sha = os.environ['GITHUB_SHA']
          workflow = quote('citable-product-a-v1.yml')
          headers = {'Authorization': f"Bearer {os.environ['GH_TOKEN']}", 'Accept': 'application/vnd.github+json'}
          run_id = None
          for _ in range(1080):
              url = f'https://api.github.com/repos/{repo}/actions/workflows/{workflow}/runs?branch=agent%2Fnested-spatial-raster-benchmark&per_page=30'
              with urlopen(Request(url, headers=headers), timeout=60) as response:
                  runs = json.load(response).get('workflow_runs', [])
              matches = [r for r in runs if str(r.get('head_sha')) == sha]
              if matches:
                  run = sorted(matches, key=lambda r: int(r['id']), reverse=True)[0]
                  run_id = str(run['id'])
                  print('citable_run', run_id, run.get('status'), run.get('conclusion'))
                  if run.get('status') == 'completed':
                      if run.get('conclusion') != 'success':
                          raise SystemExit(f'citable Product-A failed: {run.get("conclusion")}')
                      break
              time.sleep(20)
          else:
              raise SystemExit('citable Product-A did not complete within orchestrator timeout')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f'run_id={run_id}\nanalysis_sha={sha}\n')
          PY
      - name: Download and gate fixed-source citable artifact
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.wait.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: citable-product-a-v1-*
          path: source_bundle
          merge-multiple: true
      - name: Require strict fixed-source source contract
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          import pandas as pd
          root = Path('source_bundle/citable_result')
          contract = json.loads((root/'citable_snapshot_contract.json').read_text(encoding='utf-8'))
          spec = json.loads((root/'pilot_grid_specification.json').read_text(encoding='utf-8'))
          if contract.get('protocol_version') != 'product_a_v1_leakage_safe_M_sensitivity_fixed_sources':
              raise SystemExit('wrong Product-A source protocol version')
          if contract.get('outer_sealed_before_M') is not True or contract.get('m_grid_as_sensitivity') is not True:
              raise SystemExit('source contract lacks strict sealed-before-M/M-sensitivity semantics')
          if spec.get('outer_sealed_before_M') is not True or spec.get('m_grid_as_sensitivity') is not True:
              raise SystemExit('source grid specification lacks strict semantics')
          if int(contract.get('chelsa_probe_failures', 1)) != 0:
              raise SystemExit('source CHELSA preflight did not pass')
          criteria = root/'product_a_promotion_criteria_v1.csv'
          if hashlib.sha256(criteria.read_bytes()).hexdigest() != str(contract.get('promotion_criteria_sha256','')).lower():
              raise SystemExit('promotion criteria fingerprint mismatch')
          expected = set(pd.read_csv('configs/product_a_pilot_taxa_v1.csv')['scientific_name'].astype(str))
          gate = pd.read_csv(root/'species_gate.csv')
          eligible = set(gate.loc[gate['eligible'].astype(bool), 'species'].astype(str))
          if eligible != expected:
              raise SystemExit(f'citable source lacks full predeclared panel: {sorted(expected-eligible)}')
          print('strict citable source accepted')
          PY

  stability_part:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        seed: [11, 22, 33, 44, 55]
        sealed_fraction: ['0.15', '0.20', '0.30']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.analysis_sha }}
          path: analysis
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install exact Product-A analysis package
        working-directory: analysis
        run: python -m pip install -e '.[geo,parquet]'
      - name: Download exact fixed-source citable artifact
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ needs.source.outputs.citable_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: citable-product-a-v1-*
          path: source_bundle
          merge-multiple: true
      - name: Rebuild this split from raw fixed source evidence
        run: |
          cd analysis
          sdmr-pilot-grid \
            --gbif-download "$GITHUB_WORKSPACE/source_bundle/citable_input/focal.parquet" \
            --gbif-download-key "stability-source:${{ needs.source.outputs.citable_run_id }}" \
            --target-group-download "$GITHUB_WORKSPACE/source_bundle/citable_input/target_group.parquet" \
            --target-group-download-key "stability-source:${{ needs.source.outputs.citable_run_id }}" \
            --checklist-key 'snapshot-interpreted:2026-08-01' \
            --taxa configs/product_a_pilot_taxa_v1.csv \
            --grid configs/product_a_buffer_specs_v1.csv \
            --manifest configs/chelsa_v2_1_plant_candidates.csv \
            --output-dir "$GITHUB_WORKSPACE/part_result" \
            --m-grid-as-sensitivity \
            --min-occurrences 80 \
            --min-unique-cells 50 \
            --gate-cell-size-degrees 0.05 \
            --spatial-test-fraction '${{ matrix.sealed_fraction }}' \
            --taxon-validation-fraction 0.25 \
            --vif-threshold 5 \
            --max-predictors 8 \
            --random-baseline-repeats 0 \
            --seed '${{ matrix.seed }}'
      - name: Gate full taxon panel and strict split semantics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          expected = set(pd.read_csv('analysis/configs/product_a_pilot_taxa_v1.csv')['scientific_name'].astype(str))
          gate = pd.read_csv('part_result/species_gate.csv')
          eligible = set(gate.loc[gate['eligible'].astype(bool), 'species'].astype(str))
          if eligible != expected:
              raise SystemExit(f'split loses predeclared taxa: {sorted(expected-eligible)}')
          spec = json.loads(Path('part_result/pilot_grid_specification.json').read_text(encoding='utf-8'))
          if spec.get('outer_sealed_before_M') is not True or spec.get('m_grid_as_sensitivity') is not True:
              raise SystemExit('split violates Product-A information/M sensitivity contract')
          PY
      - name: Freeze part metadata
        if: always()
        run: |
          mkdir -p part_result
          python - <<'PY'
          import json
          from pathlib import Path
          Path('part_result/part_metadata.json').write_text(json.dumps({
              'source_run_id': '${{ needs.source.outputs.citable_run_id }}',
              'source_head_sha': '${{ needs.source.outputs.analysis_sha }}',
              'seed': int('${{ matrix.seed }}'),
              'sealed_fraction': float('${{ matrix.sealed_fraction }}'),
              'taxon_validation_fraction': 0.25,
              'M_background_rebuilt_from_model_pool': True,
              'M_grid_treated_as_sensitivity_not_optimized': True,
              'raw_focal_reprocessed_for_split': True,
              'require_full_predeclared_taxon_panel': True,
              'random_baseline_repeats': 0,
          }, indent=2, sort_keys=True), encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-a-v1-stability-part-${{ matrix.seed }}-${{ matrix.sealed_fraction }}
          path: |
            part_result/part_metadata.json
            part_result/product_a_protocol_choice.txt
            part_result/pilot_grid_specification.json
            part_result/protocol_discovery_summary.csv
            part_result/protocol_validation_metrics.csv
            part_result/protocol_validation_summary.csv
            part_result/protocol_validation_paired_deltas.csv
            part_result/species_gate.csv
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: [source, stability_part]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.analysis_sha }}
          path: analysis
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact aggregation package
        run: python -m pip install -e analysis
      - name: Download all frozen stability parts
        uses: actions/download-artifact@v4
        with:
          pattern: product-a-v1-stability-part-*
          path: stability_parts
      - name: Aggregate without reselection
        run: |
          python analysis/scripts/aggregate_leakage_safe_stability.py \
            --parts-root stability_parts \
            --output-dir stability_result
      - name: Download citable source contract
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ needs.source.outputs.citable_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: citable-product-a-v1-*
          path: source_bundle
          merge-multiple: true
      - name: Freeze criteria and stability provenance
        run: |
          cp source_bundle/citable_result/citable_snapshot_contract.json stability_result/source_citable_snapshot_contract.json
          cp source_bundle/citable_result/product_a_promotion_criteria_v1.csv stability_result/promotion_criteria_predeclared_before_stability.csv
          cat > stability_result/stability_inputs.txt <<EOF
          source_run_id=${{ needs.source.outputs.citable_run_id }}
          source_head_sha=${{ needs.source.outputs.analysis_sha }}
          seeds=11,22,33,44,55
          sealed_fractions=0.15,0.20,0.30
          taxon_validation_fraction=0.25
          M_grid_as_sensitivity=true
          full_taxon_panel_required=true
          promotion_criteria_source=citable_source_artifact
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: product-a-v1-stability-aggregate
          path: stability_result/
          if-no-files-found: error
          retention-days: 90

  promote:
    needs: [source, aggregate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.analysis_sha }}
          path: analysis
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact promotion code
        run: python -m pip install -e analysis
      - name: Download frozen stability aggregate
        uses: actions/download-artifact@v4
        with:
          name: product-a-v1-stability-aggregate
          path: stability_result
      - name: Apply source-frozen promotion criteria
        run: |
          python - <<'PY'
          import csv, subprocess
          from pathlib import Path
          criteria = {row['criterion']: row['value'] for row in csv.DictReader(Path('stability_result/promotion_criteria_predeclared_before_stability.csv').open(encoding='utf-8'))}
          cmd = [
              'sdmr-promote-protocol',
              '--runs', str(Path('stability_result/protocol_stability_runs.csv').resolve()),
              '--choice-stability', str(Path('stability_result/protocol_choice_stability.csv').resolve()),
              '--paired-validation-deltas', str(Path('stability_result/protocol_validation_paired_deltas.csv').resolve()),
              '--output-dir', str(Path('promotion_result').resolve()),
              '--min-protocol-selection-fraction', criteria['min_protocol_selection_fraction'],
              '--min-runs-selected', criteria['min_runs_selected'],
              '--min-m-spec-win-fraction', criteria['min_m_spec_win_fraction'],
              '--min-mean-delta-presence-rank', criteria['min_mean_delta_presence_rank'],
              '--min-positive-pair-fraction', criteria['min_positive_pair_fraction'],
              '--min-pairs-per-comparator', criteria['min_pairs_per_comparator'],
              '--required-comparators', criteria['required_comparators'],
          ]
          result = subprocess.run(cmd, cwd='analysis', check=False)
          Path('promotion_result').mkdir(parents=True, exist_ok=True)
          (Path('promotion_result')/'promotion_cli_exit_code.txt').write_text(str(result.returncode)+'\n', encoding='utf-8')
          if result.returncode not in (0, 2):
              raise SystemExit(result.returncode)
          PY
      - name: Record final Product-A boundary
        if: always()
        run: |
          cp stability_result/promotion_criteria_predeclared_before_stability.csv promotion_result/product_a_promotion_criteria_v1.csv
          cp stability_result/source_citable_snapshot_contract.json promotion_result/
          cat > promotion_result/PRODUCT_A_FINAL_BOUNDARY.txt <<'EOF'
          Product A was evaluated from one fixed DOI-backed focal/target source pair, with sealed-before-M data preparation,
          deterministic 0.05-degree thinning, M treated as a sensitivity set, 15 complete reruns, full predeclared taxon-panel
          retention, and promotion criteria frozen in the citable source artifact before stability results existed.
          Exit code 2 / promotion_not_met is a valid scientific result and must not be repaired by changing thresholds post hoc.
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-a-v1-final-promotion
          path: promotion_result/
          if-no-files-found: error
          retention-days: 90
