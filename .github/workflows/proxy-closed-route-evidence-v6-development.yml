name: proxy-closed-route-evidence-v6-development

on:
  pull_request:
    paths:
      - 'src/sdmr/process_information_purge.py'
      - 'src/sdmr/proxy_closed_route_process_challenge.py'
      - 'scripts/diagnose_proxy_closed_positive_controls_v6.py'
      - 'configs/proxy_closed_route_process_challenge_v6_development.json'
      - 'tests/test_process_information_purge.py'
      - 'tests/test_proxy_closed_route_process_challenge.py'
      - '.github/workflows/proxy-closed-route-evidence-v6-development.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  PLANT_ARTIFACT_ID: '9989319865'
  NONPLANT_ARTIFACT_ID: '9989754054'

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package
        run: python -m pip install -e '.[test]'
      - name: Verify v5 state preservation and v6 purge/matched-route logic
        run: |
          pytest -q \
            tests/test_interval_evidence_process_challenge.py \
            tests/test_process_information_purge.py \
            tests/test_proxy_closed_route_process_challenge.py
      - name: Verify development contract cannot be mistaken for validation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c = json.loads(Path('configs/proxy_closed_route_process_challenge_v6_development.json').read_text())
          assert c['development_only'] is True
          assert c['eligible_for_prospective_performance_claim'] is False
          assert c['product_a_reopened'] is False
          assert c['scientific_change']['purge_uses_occurrence_class_or_external_truth'] is False
          assert c['relative_evidence']['v5_relative_state_rule_unchanged'] is True
          assert c['relative_evidence']['indeterminate_forces_unresolved'] is True
          assert c['empirical_development_diagnostic']['may_not_be_reused_as_fresh_validation'] is True
          assert c['prospective_validation_requirements']['no_favorable_taxon_or_M_subset'] is True
          PY

  consumed-positive-control-diagnostic:
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package and diagnostic dependencies
        run: python -m pip install -e .
      - name: Download pinned consumed positive-control artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p consumed/plant consumed/nonplant
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PLANT_ARTIFACT_ID}/zip" \
            > plant.zip
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${NONPLANT_ARTIFACT_ID}/zip" \
            > nonplant.zip
          unzip -q plant.zip -d consumed/plant
          unzip -q nonplant.zip -d consumed/nonplant
          test -s consumed/plant/positive_control_endpoint/feature_cache/pilot_occurrences.csv
          test -s consumed/nonplant/cross_taxon_endpoint/feature_cache/pilot_occurrences.csv
      - name: Recompute truth-blind T/W proxy-closed outer scores, then open consumed labels
        run: |
          python scripts/diagnose_proxy_closed_positive_controls_v6.py \
            --plant-root consumed/plant/positive_control_endpoint \
            --nonplant-root consumed/nonplant/cross_taxon_endpoint \
            --output-dir development
      - name: Verify bookkeeping only, not a favorable-outcome gate
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path
          root = Path('development')
          d = json.loads((root/'development_decision.json').read_text())
          routes = pd.read_csv(root/'proxy_closed_outer_route_evidence.csv')
          scores = pd.read_csv(root/'proxy_closed_outer_process_scores.csv')
          expected = pd.read_csv(root/'proxy_closed_expected_process_development_readout.csv')
          assert d['development_only'] is True
          assert d['eligible_for_empirical_validation_claim'] is False
          assert d['truth_blind_process_scores_completed_before_labels_opened'] is True
          assert d['current_eight_labels_must_not_be_reused_as_fresh_validation'] is True
          assert len(expected) == 8
          assert len(scores) == 16  # both T and W were computed for every taxon
          assert set(scores['process']) == {'temperature', 'water'}
          assert len(routes) == 8 * 3 * 2 * 2
          assert not expected.loc[expected['species'].eq('Plantago alpina'), 'm_complete'].fillna(False).any()
          # Deliberately do NOT assert a minimum number of recovered positive controls.
          print(expected.to_string(index=False))
          print(json.dumps(d, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: proxy-closed-route-evidence-v6-consumed-development-${{ github.sha }}
          path: development/
          retention-days: 90
          if-no-files-found: error
