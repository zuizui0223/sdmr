name: fia-competition-moisture-archive-v1

on:
  pull_request:
    paths:
      - 'experiments/fia_competition_moisture_interaction_v1.py'
      - 'tests/test_fia_competition_moisture_interaction_v1.py'
      - 'evidence/fia_habitat_structure_extension_v1/aggregate.json'
      - 'results/fia_density_physiography_moderation_v1.json'
      - 'docs/FIA_COMPETITION_MOISTURE_MODERATION_V1.md'
      - '.github/workflows/fia-competition-moisture-archive-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-archived-moderation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline test runner
        run: python -m pip install 'pytest>=8,<10'
      - name: Verify original source SHA, 13 species x 3 states, four-cell support and sensitivity
        run: python -m pytest -q tests/test_fia_competition_moisture_interaction_v1.py
      - name: Recompute archived four-cell source contrasts without network or FIA refit
        run: |
          python experiments/fia_competition_moisture_interaction_v1.py \
            --source evidence/fia_habitat_structure_extension_v1/aggregate.json \
            --output artifacts/fia_density_physiography_moderation_v1.json
      - name: Verify exact frozen output bytes
        run: cmp results/fia_density_physiography_moderation_v1.json artifacts/fia_density_physiography_moderation_v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: fia-competition-moisture-archive-v1
          path: artifacts/fia_density_physiography_moderation_v1.json
          if-no-files-found: error
