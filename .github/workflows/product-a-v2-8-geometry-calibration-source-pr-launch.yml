name: product-a-v2-8-geometry-calibration-source-pr-launch

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'configs/product_a_v2_8_geometry_calibration_source_pr_trigger.txt'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Dispatch exactly one externally authorized frozen v2.8 geometry source acquisition
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, time, urllib.parse, urllib.request
          from pathlib import Path
          auth=json.load(open('configs/product_a_v2_8_geometry_calibration_source_execution.json'))
          event=json.load(open(os.environ['GITHUB_EVENT_PATH']))
          if auth.get('purpose')!='product_a_v2_8_geometry_calibration_raw_source_execution_authorization': raise SystemExit('wrong v2.8 source authorization')
          if auth.get('execution_allowed') is not True or auth.get('one_shot') is not True: raise SystemExit('v2.8 source gate is closed')
          if auth.get('source_acquisition_only') is not True or int(auth.get('chunk_count',0))!=16: raise SystemExit('v2.8 source scope changed')
          for key in ('geometry_calibration_execution_allowed','environmental_values_allowed','candidate_model_fitting_allowed','sealed_ecological_outcomes_allowed','scientific_confirmation_allowed','scientific_promotion_allowed','product_b_unblocked'):
              if auth.get(key) is not False: raise SystemExit(f'v2.8 launcher crossed scope: {key}')
          required=('implementation_sha','frozen_ref','workflow_blob_sha','source_contract_blob_sha','design_contract_blob_sha','candidate_registry_blob_sha')
          if any(not auth.get(k) for k in required): raise SystemExit('v2.8 source frozen identity incomplete')
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']; api=f'https://api.github.com/repos/{repo}'
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'sdmr-v28-geometry-source-launcher'}
          def request(url,*,method='GET',payload=None):
              data=None if payload is None else json.dumps(payload).encode(); req=urllib.request.Request(url,data=data,headers=headers,method=method)
              with urllib.request.urlopen(req,timeout=60) as r:
                  raw=r.read(); return json.loads(raw) if raw else None
          def fetch_content(path,ref):
              return request(f"{api}/contents/{urllib.parse.quote(path,safe='/')}?ref={urllib.parse.quote(ref,safe='')}")
          authorization_commit_sha=str(event['pull_request']['base']['sha'])
          base_auth=fetch_content('configs/product_a_v2_8_geometry_calibration_source_execution.json',authorization_commit_sha)
          if json.loads(base64.b64decode(base_auth['content']).decode())!=auth: raise SystemExit('trigger PR altered v2.8 source authorization relative to base')
          authorization_blob_sha=str(base_auth['sha'])
          def verify_blob(path,expected):
              if fetch_content(path,auth['frozen_ref']).get('sha')!=expected: raise SystemExit(f'frozen v2.8 source blob changed: {path}')
          verify_blob('.github/workflows/product-a-v2-8-geometry-calibration-source.yml',auth['workflow_blob_sha'])
          verify_blob('configs/product_a_v2_8_geometry_calibration_source_contract.json',auth['source_contract_blob_sha'])
          verify_blob('configs/product_a_v2_8_geometry_only_validation_calibration_contract.json',auth['design_contract_blob_sha'])
          verify_blob('configs/product_a_v2_7_1_fresh_taxon_candidates.csv',auth['candidate_registry_blob_sha'])
          workflow='product-a-v2-8-geometry-calibration-source.yml'
          def matches():
              p=request(f'{api}/actions/workflows/{workflow}/runs?event=workflow_dispatch&per_page=100')
              return [r for r in p.get('workflow_runs',[]) if str(r.get('head_sha'))==auth['implementation_sha'] and str(r.get('head_branch'))==auth['frozen_ref'] and str(r.get('event'))=='workflow_dispatch']
          runs=matches(); dispatched=False
          if len(runs)>1: raise SystemExit(f'multiple exact v2.8 source runs exist: {len(runs)}')
          if not runs:
              inputs={'authorization_commit_sha':authorization_commit_sha,'authorization_blob_sha':authorization_blob_sha,'expected_runtime_sha':auth['implementation_sha'],'expected_frozen_ref':auth['frozen_ref']}
              request(f'{api}/actions/workflows/{workflow}/dispatches',method='POST',payload={'ref':auth['frozen_ref'],'inputs':inputs}); dispatched=True
              for _ in range(24):
                  time.sleep(5); runs=matches()
                  if runs: break
          if len(runs)!=1: raise SystemExit(f'expected one exact v2.8 source run, found {len(runs)}')
          run=runs[0]
          receipt={'purpose':'product_a_v2_8_geometry_calibration_raw_source_launch_receipt','pull_request':int(event['pull_request']['number']),'authorization_commit_sha':authorization_commit_sha,'authorization_blob_sha':authorization_blob_sha,'implementation_sha':auth['implementation_sha'],'frozen_ref':auth['frozen_ref'],'workflow_file':workflow,'dispatched_now':dispatched,'run_id':int(run['id']),'run_number':int(run['run_number']),'status':str(run['status']),'conclusion':run.get('conclusion'),'raw_source_only':True,'geometry_calibration_execution_allowed':False,'scientific_confirmation_allowed':False,'scientific_promotion_allowed':False,'product_b_unblocked':False}
          Path('launch').mkdir(); Path('launch/receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n'); print(json.dumps(receipt,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: product-a-v2-8-geometry-calibration-source-launch-receipt
          path: launch/receipt.json
          retention-days: 90
