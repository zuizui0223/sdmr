name: FIA PA MI prospective-external-response predictor freeze synthetic controls

on:
  pull_request:
    paths:
      - 'experiments/fia_PA_MI_transfer_model_freeze_v1.py'
      - 'tests/test_fia_PA_MI_transfer_model_freeze_v1.py'
      - 'docs/FIA_PA_MI_EXTERNAL_PREDICTOR_FREEZE_V1.md'
      - '.github/workflows/fia-PA-MI-transfer-predictor-freeze-contract-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-development-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numeric dependency and synthetic test runner only
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2,<4' 'pytest>=8,<10'
      - name: Test cross-version first-source identity, fixed five models and PA MI holdout refusal
        run: python -m pytest -q tests/test_fia_PA_MI_transfer_model_freeze_v1.py
      - name: Verify no outcome-data access in frozen training protocol
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,'experiments')
          import fia_PA_MI_transfer_model_freeze_v1 as m
          assert m.PRIMARY==('129','316','802','833','837')
          assert m.TRANSFER_BRANCH=={'PA':'VA','MI':'WI'}
          assert m.EXPECTED_OLD_SOURCE_ROWS==88145
          assert m.EXPECTED_GROWTH_ROWS==170994
          assert len(m.FEATURES)==3
          assert m.MIN_HOLDOUT_SOURCE_COVERAGE==.20
          PY
