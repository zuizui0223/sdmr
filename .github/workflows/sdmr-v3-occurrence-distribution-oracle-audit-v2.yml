name: sdmr-v3-occurrence-distribution-oracle-audit-v2

on:
  workflow_dispatch:
  push:
    branches:
      - 'design/sdmr-v3-process-identification'
    paths:
      - 'configs/sdmr_v3_occurrence_distribution_oracle_audit_v2_execute.json'

permissions:
  contents: read

concurrency:
  group: sdmr-v3-occurrence-distribution-oracle-audit-v2
  cancel-in-progress: false

jobs:
  audit:
    if: github.ref == 'refs/heads/design/sdmr-v3-process-identification'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Validate occurrence-oracle v2 machinery
        run: |
          pytest -q \
            tests/test_process_id_occurrence_oracle.py \
            tests/test_process_id_identifiability_crosswalk.py \
            tests/test_process_id_occurrence_oracle_audit.py \
            tests/test_process_id_occurrence_oracle_audit_v2_contract.py
      - name: Verify explicit v2 activation marker
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          marker = json.loads(
              Path("configs/sdmr_v3_occurrence_distribution_oracle_audit_v2_execute.json")
              .read_text(encoding="utf-8")
          )
          assert marker["purpose"] == "execute_sdmr_v3_occurrence_distribution_oracle_audit_v2"
          assert marker["branch"] == "design/sdmr-v3-process-identification"
          assert marker["single_activation"] is True
          assert marker["config_path"] == "configs/sdmr_v3_occurrence_distribution_oracle_audit_v2.json"
          PY
      - name: Run burned occurrence-distribution oracle audit v2
        run: |
          python scripts/run_sdmr_v3_occurrence_distribution_oracle_audit.py \
            --config configs/sdmr_v3_occurrence_distribution_oracle_audit_v2.json \
            --outdir occurrence-oracle-audit-v2-output
      - name: Upload occurrence-oracle audit v2 evidence
        uses: actions/upload-artifact@v4
        with:
          name: sdmr-v3-occurrence-distribution-oracle-audit-v2
          path: occurrence-oracle-audit-v2-output/
          if-no-files-found: error
