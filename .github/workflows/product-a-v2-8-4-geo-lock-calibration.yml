name: Product-A v2.8.4 truth-blind geo lock calibration

on:
  push:
    branches:
      - design/product-a-v2-8-4-geo-lock-calibration
    paths:
      - .github/workflows/product-a-v2-8-4-geo-lock-calibration.yml
      - configs/product_a_v2_8_4_geo_lock_calibration_contract.json
      - configs/product_a_v2_8_4_geo_requirements.in
      - configs/product_a_v2_8_4_geo_requirements.lock
      - tests/test_product_a_v2_8_4_geo_lock_calibration.py

permissions:
  contents: read

concurrency:
  group: product-a-v2-8-4-truth-blind-geo-lock-calibration
  cancel-in-progress: false

env:
  CONTRACT: configs/product_a_v2_8_4_geo_lock_calibration_contract.json
  GEO_LOCK: configs/product_a_v2_8_4_geo_requirements.lock

jobs:
  calibrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
          cache: pip
          cache-dependency-path: configs/product_a_v2_8_4_geo_requirements.lock

      - name: Verify the truth-blind calibration contract before installation
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          contract = json.loads(Path(os.environ['CONTRACT']).read_text(encoding='utf-8'))
          trigger = contract['trigger_boundary']
          if os.environ['GITHUB_EVENT_NAME'] != trigger['event']:
              raise SystemExit('geo lock calibration event changed')
          if os.environ['GITHUB_REF_NAME'] != trigger['branch']:
              raise SystemExit('geo lock calibration branch changed')
          if trigger['workflow_dispatch_allowed'] is not False:
              raise SystemExit('geo lock calibration became dispatchable')

          def digest(path):
              return hashlib.sha256(Path(path).read_bytes().replace(b'\r\n', b'\n')).hexdigest()

          environment = contract['environment']
          for key in (
              'scientific_requirements_input',
              'scientific_requirements_lock',
              'geo_requirements_input',
              'geo_requirements_lock',
          ):
              pin = environment[key]
              if digest(pin['path']) != pin['newline_canonical_sha256']:
                  raise SystemExit(f'geo lock calibration input changed: {pin["path"]}')
          predecessor = contract['predecessor_recovery_design']
          if digest(predecessor['path']) != predecessor['newline_canonical_sha256']:
              raise SystemExit('sealed recovery design changed before geo calibration')
          for key, value in contract['calibration_scope'].items():
              expected = key in ('truth_blind', 'package_metadata_and_wheels_only')
              if value is not expected:
                  raise SystemExit(f'geo calibration scope changed: {key}')
          PY

      - name: Install the exact hash-locked core plus geo extension
        run: python -m pip install --disable-pip-version-check --require-hashes -r "$GEO_LOCK"

      - name: Import rasterio without opening a raster and write the technical receipt
        run: |
          mkdir -p geo-lock-calibration
          python - <<'PY'
          import hashlib
          import importlib.metadata
          import json
          import os
          import platform
          import sys
          from pathlib import Path

          contract = json.loads(Path(os.environ['CONTRACT']).read_text(encoding='utf-8'))
          expected = {
              **contract['environment']['retained_core_versions'],
              **contract['environment']['added_geo_versions'],
          }
          observed = {name: importlib.metadata.version(name) for name in expected}
          if observed != expected:
              raise SystemExit(f'geo lock package versions changed: {observed!r}')

          import rasterio
          if rasterio.__version__ != expected['rasterio']:
              raise SystemExit('rasterio import version changed')

          def digest(path):
              return hashlib.sha256(Path(path).read_bytes().replace(b'\r\n', b'\n')).hexdigest()

          receipt = {
              'purpose': 'product_a_v2_8_4_truth_blind_geo_lock_calibration_receipt',
              'status': 'geo_lock_import_calibration_complete',
              'github_run_id': int(os.environ['GITHUB_RUN_ID']),
              'github_run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'github_sha': os.environ['GITHUB_SHA'],
              'runner_os': platform.system(),
              'python_version': platform.python_version(),
              'python_executable_version': '.'.join(map(str, sys.version_info[:3])),
              'package_versions': observed,
              'geo_requirements_input_sha256': digest(contract['environment']['geo_requirements_input']['path']),
              'geo_requirements_lock_sha256': digest(contract['environment']['geo_requirements_lock']['path']),
              'scientific_source_accessed': False,
              'presealed_receipts_accessed': False,
              'github_input_artifacts_accessed': False,
              'rasterio_imported': True,
              'raster_dataset_opened': False,
              'environmental_values_read': False,
              'sealed_read_entered': False,
              'scientific_outcome_read': False,
              'scientific_promotion_allowed': False,
              'product_b_unblocked': False,
          }
          canonical = json.dumps(receipt, sort_keys=True, separators=(',', ':')).encode()
          receipt['receipt_digest'] = hashlib.sha256(canonical).hexdigest()
          output = Path('geo-lock-calibration/receipt.json')
          output.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Run the calibration boundary tests
        run: python -m pytest -q tests/test_product_a_v2_8_4_geo_lock_calibration.py

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: product-a-v2-8-4-truth-blind-geo-lock-calibration
          path: geo-lock-calibration/receipt.json
          if-no-files-found: error
          retention-days: 90
