name: product-a-v1-evidence-orchestrator-v2

on:
  push:
    branches:
      - agent/nested-spatial-raster-benchmark
    paths:
      - 'configs/product_a_v1_target_cache.csv'

permissions:
  contents: read
  actions: read

concurrency:
  group: product-a-v1-evidence-orchestrator-v2
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      citable_run_id: ${{ steps.wait.outputs.run_id }}
      analysis_sha: ${{ steps.wait.outputs.analysis_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait for citable Product-A on the exact frozen-source commit
        id: wait
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, time
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          repo = os.environ['GITHUB_REPOSITORY']
          sha = os.environ['GITHUB_SHA']
          workflow = quote('citable-product-a-v1.yml')
          headers = {'Authorization': f"Bearer {os.environ['GH_TOKEN']}", 'Accept': 'application/vnd.github+json'}
          run_id = None
          for _ in range(1080):
              url = f'https://api.github.com/repos/{repo}/actions/workflows/{workflow}/runs?branch=agent%2Fnested-spatial-raster-benchmark&per_page=30'
              with urlopen(Request(url, headers=headers), timeout=60) as response:
                  runs = json.load(response).get('workflow_runs', [])
              matches = [r for r in runs if str(r.get('head_sha')) == sha]
              if matches:
                  run = sorted(matches, key=lambda r: int(r['id']), reverse=True)[0]
                  run_id = str(run['id'])
                  print('citable_run', run_id, run.get('status'), run.get('conclusion'))
                  if run.get('status') == 'completed':
                      if run.get('conclusion') != 'success':
                          raise SystemExit(f'citable Product-A failed: {run.get("conclusion")}')
                      break
              time.sleep(20)
          else:
              raise SystemExit('citable Product-A did not complete within orchestrator timeout')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f'run_id={run_id}\nanalysis_sha={sha}\n')
          PY
      - name: Download strict citable source artifact
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.wait.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: citable-product-a-v1-*
          path: source_bundle
          merge-multiple: true
      - name: Gate exact non-focal fixed-source contract
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          import pandas as pd

          root = Path('source_bundle/citable_result')
          contract = json.loads((root/'citable_snapshot_contract.json').read_text(encoding='utf-8'))
          spec = json.loads((root/'pilot_grid_specification.json').read_text(encoding='utf-8'))
          contrast = json.loads((root/'selector_contrast_contract.json').read_text(encoding='utf-8'))
          taxa_path = Path('configs/product_a_pilot_taxa_v1.csv')
          taxa_sha = hashlib.sha256(taxa_path.read_bytes()).hexdigest()

          if contract.get('protocol_version') != 'product_a_v1_leakage_safe_M_sensitivity_fixed_sources':
              raise SystemExit('wrong Product-A source protocol')
          if contract.get('outer_sealed_before_M') is not True or contract.get('m_grid_as_sensitivity') is not True:
              raise SystemExit('source lacks sealed-before-M / M-sensitivity semantics')
          if spec.get('outer_sealed_before_M') is not True or spec.get('m_grid_as_sensitivity') is not True:
              raise SystemExit('grid specification lacks strict semantics')
          if contract.get('target_source_independent_of_focal_occurrence_geography') is not True:
              raise SystemExit('target source depends on focal occurrence geography')
          if contract.get('target_focal_taxa_excluded_pre_split') is not True:
              raise SystemExit('target source did not exclude focal taxa before split')
          if int(contract.get('target_excluded_taxa_count',0)) != 12:
              raise SystemExit('target source did not exclude all 12 focal taxa')
          if str(contract.get('target_excluded_taxa_sha256','')).lower() != taxa_sha:
              raise SystemExit('target excluded-taxa fingerprint mismatch')
          if int(contract.get('chelsa_probe_failures',1)) != 0:
              raise SystemExit('CHELSA preflight did not pass')
          if contrast.get('cross_taxon_selection_data') != 'discovery_taxa_only':
              raise SystemExit('cross-taxon selectors used validation taxa')
          if contrast.get('local_nested_auc_selection_data') != 'validation_species_model_pool_only':
              raise SystemExit('local nested-AUC selector used evidence outside model pool')
          if contrast.get('outer_sealed_used_for_selection') is not False:
              raise SystemExit('selector contrast used outer sealed evidence for selection')

          criteria = root/'product_a_promotion_criteria_v1.csv'
          if hashlib.sha256(criteria.read_bytes()).hexdigest() != str(contract.get('promotion_criteria_sha256','')).lower():
              raise SystemExit('promotion criteria fingerprint mismatch')
          expected = set(pd.read_csv(taxa_path)['scientific_name'].astype(str))
          gate = pd.read_csv(root/'species_gate.csv')
          eligible = set(gate.loc[gate['eligible'].astype(bool), 'species'].astype(str))
          if eligible != expected:
              raise SystemExit(f'citable source lacks full predeclared panel: missing={sorted(expected-eligible)}')
          print('strict non-focal citable source accepted')
          PY

  stability_part:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        seed: [11, 22, 33, 44, 55]
        sealed_fraction: ['0.15', '0.20', '0.30']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.analysis_sha }}
          path: analysis
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install exact analysis package
        working-directory: analysis
        run: python -m pip install -e '.[geo,parquet]'
      - name: Download exact citable fixed sources
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ needs.source.outputs.citable_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: citable-product-a-v1-*
          path: source_bundle
          merge-multiple: true
      - name: Rebuild full split and compare conventional selectors
        run: |
          cd analysis
          sdmr-pilot-grid \
            --gbif-download "$GITHUB_WORKSPACE/source_bundle/citable_input/focal.parquet" \
            --gbif-download-key "stability-source:${{ needs.source.outputs.citable_run_id }}" \
            --target-group-download "$GITHUB_WORKSPACE/source_bundle/citable_input/target_group.parquet" \
            --target-group-download-key "stability-source:${{ needs.source.outputs.citable_run_id }}" \
            --checklist-key 'snapshot-interpreted:2026-08-01' \
            --taxa configs/product_a_pilot_taxa_v1.csv \
            --grid configs/product_a_buffer_specs_v1.csv \
            --manifest configs/chelsa_v2_1_plant_candidates.csv \
            --output-dir "$GITHUB_WORKSPACE/part_result" \
            --m-grid-as-sensitivity \
            --min-occurrences 80 \
            --min-unique-cells 50 \
            --gate-cell-size-degrees 0.05 \
            --spatial-test-fraction '${{ matrix.sealed_fraction }}' \
            --taxon-validation-fraction 0.25 \
            --vif-threshold 5 \
            --max-predictors 8 \
            --random-baseline-repeats 0 \
            --seed '${{ matrix.seed }}'
          sdmr-compare-evaluation \
            --product-a-dir "$GITHUB_WORKSPACE/part_result" \
            --manifest configs/chelsa_v2_1_plant_candidates.csv \
            --canonical-specification buffer_300km
      - name: Gate split semantics and full panel
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          expected = set(pd.read_csv('analysis/configs/product_a_pilot_taxa_v1.csv')['scientific_name'].astype(str))
          gate = pd.read_csv('part_result/species_gate.csv')
          eligible = set(gate.loc[gate['eligible'].astype(bool), 'species'].astype(str))
          if eligible != expected:
              raise SystemExit(f'split loses predeclared taxa: missing={sorted(expected-eligible)}')
          spec = json.loads(Path('part_result/pilot_grid_specification.json').read_text(encoding='utf-8'))
          contrast = json.loads(Path('part_result/selector_contrast_contract.json').read_text(encoding='utf-8'))
          if spec.get('outer_sealed_before_M') is not True or spec.get('m_grid_as_sensitivity') is not True:
              raise SystemExit('split violates sealed-before-M/M-sensitivity contract')
          if contrast.get('cross_taxon_selection_data') != 'discovery_taxa_only':
              raise SystemExit('split cross-taxon selectors used validation taxa')
          if contrast.get('local_nested_auc_selection_data') != 'validation_species_model_pool_only':
              raise SystemExit('split local nested-AUC selector escaped model pool')
          if contrast.get('outer_sealed_used_for_selection') is not False:
              raise SystemExit('split used outer sealed evidence for selection')
          PY
      - name: Freeze part metadata
        if: always()
        run: |
          mkdir -p part_result
          python - <<'PY'
          import json
          from pathlib import Path
          Path('part_result/part_metadata.json').write_text(json.dumps({
              'source_run_id': '${{ needs.source.outputs.citable_run_id }}',
              'source_head_sha': '${{ needs.source.outputs.analysis_sha }}',
              'seed': int('${{ matrix.seed }}'),
              'sealed_fraction': float('${{ matrix.sealed_fraction }}'),
              'taxon_validation_fraction': 0.25,
              'M_background_rebuilt_from_model_pool': True,
              'M_grid_treated_as_sensitivity_not_optimized': True,
              'raw_focal_reprocessed_for_split': True,
              'require_full_predeclared_taxon_panel': True,
              'random_baseline_repeats': 0,
              'selector_contrast': 'canonical_M_AUC_Boyce_and_local_nested_AUC_vs_SDMR_same_outer_sealed_cases',
          }, indent=2, sort_keys=True), encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-a-v1-stability-v2-${{ matrix.seed }}-${{ matrix.sealed_fraction }}
          path: |
            part_result/part_metadata.json
            part_result/product_a_protocol_choice.txt
            part_result/pilot_grid_specification.json
            part_result/protocol_discovery_summary.csv
            part_result/protocol_validation_metrics.csv
            part_result/protocol_validation_summary.csv
            part_result/protocol_validation_paired_deltas.csv
            part_result/species_gate.csv
            part_result/selector_contrast_contract.json
            part_result/selector_contrast_choices.csv
            part_result/selector_contrast_transfer_summary.csv
            part_result/selector_contrast_paired_deltas.csv
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: [source, stability_part]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.analysis_sha }}
          path: analysis
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact aggregation package
        run: python -m pip install -e analysis
      - name: Download all frozen stability parts
        uses: actions/download-artifact@v4
        with:
          pattern: product-a-v1-stability-v2-*
          path: stability_parts
      - name: Aggregate already-frozen parts without reselection
        run: |
          python analysis/scripts/aggregate_leakage_safe_stability.py \
            --parts-root stability_parts \
            --output-dir stability_result
          python analysis/scripts/aggregate_selector_contrast.py \
            --parts-root stability_parts \
            --output-dir stability_result
      - name: Download citable source governance
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ needs.source.outputs.citable_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: citable-product-a-v1-*
          path: source_bundle
          merge-multiple: true
      - name: Freeze source criteria and provenance
        run: |
          cp source_bundle/citable_result/citable_snapshot_contract.json stability_result/source_citable_snapshot_contract.json
          cp source_bundle/citable_result/product_a_promotion_criteria_v1.csv stability_result/promotion_criteria_predeclared_before_stability.csv
          cat > stability_result/stability_inputs.txt <<EOF
          source_run_id=${{ needs.source.outputs.citable_run_id }}
          source_head_sha=${{ needs.source.outputs.analysis_sha }}
          seeds=11,22,33,44,55
          sealed_fractions=0.15,0.20,0.30
          taxon_validation_fraction=0.25
          M_grid_as_sensitivity=true
          full_taxon_panel_required=true
          target_source=global_nonfocal_pre_split_focal_taxa_excluded
          promotion_criteria_source=citable_source_artifact
          selector_contrast=canonical_M_AUC_Boyce_and_local_nested_AUC_vs_SDMR_same_outer_sealed_cases
          selector_contrast_is_descriptive_not_posthoc_promotion_threshold=true
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: product-a-v1-stability-v2-aggregate
          path: stability_result/
          if-no-files-found: error
          retention-days: 90

  promote:
    needs: [source, aggregate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.analysis_sha }}
          path: analysis
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact promotion code
        run: python -m pip install -e analysis
      - name: Download frozen stability aggregate
        uses: actions/download-artifact@v4
        with:
          name: product-a-v1-stability-v2-aggregate
          path: stability_result
      - name: Apply source-frozen Product-A promotion criteria
        run: |
          python - <<'PY'
          import csv, subprocess
          from pathlib import Path
          criteria = {row['criterion']: row['value'] for row in csv.DictReader(Path('stability_result/promotion_criteria_predeclared_before_stability.csv').open(encoding='utf-8'))}
          cmd = [
              'sdmr-promote-protocol',
              '--runs', str(Path('stability_result/protocol_stability_runs.csv').resolve()),
              '--choice-stability', str(Path('stability_result/protocol_choice_stability.csv').resolve()),
              '--paired-validation-deltas', str(Path('stability_result/protocol_validation_paired_deltas.csv').resolve()),
              '--output-dir', str(Path('promotion_result').resolve()),
              '--min-protocol-selection-fraction', criteria['min_protocol_selection_fraction'],
              '--min-runs-selected', criteria['min_runs_selected'],
              '--min-m-spec-win-fraction', criteria['min_m_spec_win_fraction'],
              '--min-mean-delta-presence-rank', criteria['min_mean_delta_presence_rank'],
              '--min-positive-pair-fraction', criteria['min_positive_pair_fraction'],
              '--min-pairs-per-comparator', criteria['min_pairs_per_comparator'],
              '--required-comparators', criteria['required_comparators'],
          ]
          result = subprocess.run(cmd, cwd='analysis', check=False)
          Path('promotion_result').mkdir(parents=True, exist_ok=True)
          (Path('promotion_result')/'promotion_cli_exit_code.txt').write_text(str(result.returncode)+'\n', encoding='utf-8')
          if result.returncode not in (0, 2):
              raise SystemExit(result.returncode)
          PY
      - name: Record final evidence boundary
        if: always()
        run: |
          cp stability_result/promotion_criteria_predeclared_before_stability.csv promotion_result/product_a_promotion_criteria_v1.csv
          cp stability_result/source_citable_snapshot_contract.json promotion_result/
          cp stability_result/selector_contrast_comparator_summary.csv promotion_result/ 2>/dev/null || true
          cp stability_result/selector_contrast_choice_summary.csv promotion_result/ 2>/dev/null || true
          cp stability_result/selector_contrast_run_summary.csv promotion_result/ 2>/dev/null || true
          cat > promotion_result/PRODUCT_A_FINAL_BOUNDARY.txt <<'EOF'
          Product A uses one frozen DOI-backed focal source and a global non-focal Plantae sampling footprint from the same snapshot.
          All 12 focal taxa are excluded from the target-group source before any spatial split, preventing sealed positives from
          returning as background. Every stability run re-thins, re-seals and rebuilds M/background. M is a sensitivity set.
          Conventional canonical-M AUC/Boyce selectors and a strong per-species local nested spatial-CV AUC selector are compared
          against SDMR on identical outer-sealed cases, but do not alter the predeclared promotion threshold. promotion_not_met is
          a valid scientific conclusion.
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-a-v1-final-promotion-v2
          path: promotion_result/
          if-no-files-found: error
          retention-days: 90
