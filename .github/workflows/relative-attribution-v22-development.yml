name: relative-attribution-v22-development

on:
  pull_request:
    paths:
      - 'src/sdmr/relative_attribution_v22.py'
      - 'src/sdmr/relative_attribution_v22_development.py'
      - 'configs/relative_attribution_v22_development.json'
      - 'tests/test_relative_attribution_v22.py'
      - '.github/workflows/relative-attribution-v22-development.yml'
  workflow_dispatch:

concurrency:
  group: relative-attribution-v22-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e . pytest
      - run: pytest -q tests/test_relative_attribution_v22.py

  freeze-pairs:
    needs: gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e .
      - name: Download authoritative v21 terminal artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p v21
          gh api repos/${{ github.repository }}/actions/artifacts/10291023518/zip > v21.zip
          unzip -q v21.zip -d v21
          test -f v21/context_decisions.csv
      - run: python -m sdmr.relative_attribution_v22_development freeze-pairs --context-decisions v21/context_decisions.csv --output-dir frozen
      - uses: actions/upload-artifact@v4
        with:
          name: v22-pair-manifest-${{ github.sha }}
          path: frozen/
          retention-days: 90

  fit-family:
    needs: freeze-pairs
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        family: [gaussian, asymmetric, soft_threshold, interaction, omitted_driver, observation_confounded]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: v22-pair-manifest-${{ github.sha }}
          path: frozen
      - run: python -m sdmr.relative_attribution_v22_development fit-family --family '${{ matrix.family }}' --pair-manifest frozen/pair_manifest.csv --output-dir family
      - uses: actions/upload-artifact@v4
        with:
          name: v22-${{ matrix.family }}-${{ github.sha }}
          path: family/
          retention-days: 90

  aggregate:
    needs: fit-family
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: v22-pair-manifest-${{ github.sha }}
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          pattern: v22-*-${{ github.sha }}
          path: inputs
      - run: python -m sdmr.relative_attribution_v22_development aggregate --input-dir inputs --pair-manifest frozen/pair_manifest.csv --output-dir aggregate
      - uses: actions/upload-artifact@v4
        with:
          name: relative-attribution-v22-aggregate-${{ github.sha }}
          path: aggregate/
          retention-days: 90
