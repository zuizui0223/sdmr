name: geographic-turnover-common-support-v1

on:
  pull_request:
    paths:
      - 'configs/geographic_turnover_common_support_v1.json'
      - 'experiments/geographic_turnover_common_support_v1.py'
      - 'tests/test_geographic_turnover_common_support_v1.py'
      - '.github/workflows/geographic-turnover-common-support-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  climate-only-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install geo and tests
        run: python -m pip install -e '.[geo,test]' pyproj scipy
      - name: Run outcome-blind fixture tests
        run: python -m pytest -q tests/test_geographic_turnover_common_support_v1.py
      - name: Extract the entire fixed climate-only panel (no GBIF access)
        run: python experiments/geographic_turnover_common_support_v1.py --output-dir artifacts/geographic_common_support_v1
      - name: Archive all climate windows and every accepted/rejected pair
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geographic-turnover-common-support-v1
          path: artifacts/geographic_common_support_v1/
          if-no-files-found: warn
