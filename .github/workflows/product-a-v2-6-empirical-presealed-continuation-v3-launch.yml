name: product-a-v2-6-empirical-presealed-continuation-v3-launch

on:
  push:
    branches: [main]
    paths:
      - 'configs/product_a_v2_6_empirical_presealed_continuation_v3_trigger.txt'

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exactly one frozen Product-A continuation v3 run and record receipt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, time, urllib.error, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']
          c=json.load(open('configs/product_a_v2_6_continuation_v3_promotion_contract.json'))
          source=c['independent_empirical_continuation_v3_source']
          workflow=source['workflow_file']; frozen_ref=source['frozen_ref']; implementation_sha=source['implementation_sha']
          api=f'https://api.github.com/repos/{repo}'
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'sdmr-v26-cont3-launcher'}
          def req(url,*,method='GET',payload=None,allow_404=False):
              data=None if payload is None else json.dumps(payload).encode()
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,data=data,headers=headers,method=method),timeout=60) as r:
                      raw=r.read(); return json.loads(raw) if raw else None
              except urllib.error.HTTPError as exc:
                  if allow_404 and exc.code==404: return None
                  raise
          def artifact_names(run_id):
              names=[]
              for page in range(1,10):
                  p=req(f'{api}/actions/runs/{run_id}/artifacts?per_page=100&page={page}')
                  batch=p.get('artifacts',[]); names.extend(str(a['name']) for a in batch if not a.get('expired'))
                  if len(batch)<100: break
              return names
          # Both technical predecessors must still have stopped before pretruth/sealed evidence.
          for predecessor in source['technical_predecessors']:
              run=req(f"{api}/actions/runs/{predecessor['run_id']}")
              names=artifact_names(predecessor['run_id'])
              if any(n.startswith(('v26-cont-pretruth-','v26-cont2-pretruth-','v26-cont-audit-','v26-cont2-audit-')) for n in names):
                  raise SystemExit(f"predecessor {predecessor['run_id']} is no longer presealed")
              if any('independent-empirical-confirmation-decision-continuation' in n for n in names):
                  raise SystemExit(f"predecessor {predecessor['run_id']} unexpectedly has a decision")
              assert predecessor['sealed_environment_opened'] is False
          def matches():
              p=req(f'{api}/actions/workflows/{workflow}/runs?event=workflow_dispatch&per_page=100')
              return [r for r in p.get('workflow_runs',[]) if str(r.get('head_sha'))==implementation_sha and str(r.get('head_branch'))==frozen_ref and str(r.get('event'))=='workflow_dispatch']
          runs=matches(); dispatched=False
          if len(runs)>1: raise SystemExit(f'multiple frozen Product-A cont3 runs exist: {len(runs)}')
          if not runs:
              req(f'{api}/actions/workflows/{workflow}/dispatches',method='POST',payload={'ref':frozen_ref}); dispatched=True
              for _ in range(24):
                  time.sleep(5); runs=matches()
                  if runs: break
          if len(runs)!=1: raise SystemExit(f'expected one frozen Product-A cont3 run, found {len(runs)}')
          run=runs[0]
          receipt={
              'purpose':'product_a_v2_6_empirical_presealed_continuation_v3_launch_receipt',
              'launcher_trigger_sha':os.environ['GITHUB_SHA'],
              'dispatched_now':dispatched,
              'run_id':int(run['id']),
              'run_number':int(run['run_number']),
              'status':str(run['status']),
              'conclusion':run.get('conclusion'),
              'created_at':str(run['created_at']),
              'head_sha':str(run['head_sha']),
              'head_branch':str(run['head_branch']),
              'implementation_sha':implementation_sha,
              'frozen_ref':frozen_ref,
              'workflow_name':str(run['name']),
              'html_url':str(run['html_url']),
              'source_presealed_run_id':source['source_presealed_run_id'],
              'technical_predecessor_run_ids':[x['run_id'] for x in source['technical_predecessors']],
              'predecessors_sealed_environment_opened':False,
          }
          path='configs/product_a_v2_6_empirical_presealed_continuation_v3_launch_receipt.json'
          old=req(f'{api}/contents/{path}?ref=main',allow_404=True)
          payload={'message':f'Record Product-A continuation v3 run {run["id"]}','content':base64.b64encode((json.dumps(receipt,indent=2,sort_keys=True)+'\n').encode()).decode(),'branch':'main'}
          if old: payload['sha']=old['sha']
          req(f'{api}/contents/{path}',method='PUT',payload=payload)
          print(json.dumps(receipt,indent=2,sort_keys=True))
          PY
