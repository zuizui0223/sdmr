name: product-b-v2-1-known-truth-launch

on:
  push:
    branches: [main]
    paths:
      - 'configs/product_b_v2_1_known_truth_trigger.txt'

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exactly one Product-B v2.1 run from the frozen source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, time, urllib.error, urllib.request

          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']
          workflow='product-b-v2-1-known-truth.yml'
          frozen_ref='frozen/product-b-v2-1-064db306'
          frozen_sha='064db306a44ce1104327b73b70e055e56e451018'
          api=f'https://api.github.com/repos/{repo}'
          headers={
              'Authorization':f'Bearer {token}',
              'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28',
              'User-Agent':'sdmr-product-b-v2-1-known-truth-launcher',
          }
          def request(url, *, method='GET', payload=None, allow_404=False):
              data=None if payload is None else json.dumps(payload).encode('utf-8')
              req=urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=60) as response:
                      raw=response.read()
                      return json.loads(raw) if raw else None
              except urllib.error.HTTPError as exc:
                  if allow_404 and exc.code==404:
                      return None
                  raise
          def matching_runs():
              payload=request(f'{api}/actions/workflows/{workflow}/runs?event=workflow_dispatch&per_page=100')
              return [r for r in payload.get('workflow_runs', [])
                      if str(r.get('head_sha'))==frozen_sha
                      and str(r.get('head_branch'))==frozen_ref
                      and str(r.get('event'))=='workflow_dispatch']

          runs=matching_runs(); dispatched_now=False
          if len(runs)>1:
              raise SystemExit(f'Product-B v2.1 frozen source already has {len(runs)} workflow_dispatch runs')
          if not runs:
              request(f'{api}/actions/workflows/{workflow}/dispatches', method='POST', payload={'ref':frozen_ref})
              dispatched_now=True
              for _ in range(18):
                  time.sleep(5)
                  runs=matching_runs()
                  if runs:
                      break
          if len(runs)!=1:
              raise SystemExit(f'expected exactly one Product-B v2.1 frozen-source run, found {len(runs)}')
          run=runs[0]
          receipt={
              'purpose':'product_b_v2_1_known_truth_launch_receipt',
              'frozen_ref':frozen_ref,
              'implementation_sha':frozen_sha,
              'dispatched_now':dispatched_now,
              'run_id':int(run['id']),
              'run_number':int(run['run_number']),
              'status':str(run['status']),
              'conclusion':run.get('conclusion'),
              'created_at':str(run['created_at']),
              'head_sha':str(run['head_sha']),
              'head_branch':str(run['head_branch']),
              'html_url':str(run['html_url']),
              'workflow_name':str(run['name']),
          }
          path='configs/product_b_v2_1_known_truth_launch_receipt.json'
          existing=request(f'{api}/contents/{path}?ref=main', allow_404=True)
          put={
              'message':f'Record Product-B v2.1 known-truth run {run["id"]}',
              'content':base64.b64encode((json.dumps(receipt, indent=2, sort_keys=True)+'\n').encode()).decode(),
              'branch':'main',
          }
          if existing:
              put['sha']=existing['sha']
          request(f'{api}/contents/{path}', method='PUT', payload=put)
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY
