name: product-a-v2-6-empirical-launch

on:
  push:
    branches:
      - main
    paths:
      - 'configs/product_a_v2_6_empirical_confirmation_trigger.txt'

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Idempotently dispatch frozen empirical confirmation and record receipt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          trigger_sha = os.environ['GITHUB_SHA']
          workflow = 'product-a-v2-6-empirical-confirmation.yml'
          api = f'https://api.github.com/repos/{repo}'
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'sdmr-product-a-v2-6-launcher',
          }

          def request(url, *, method='GET', payload=None, allow_404=False):
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=60) as response:
                      raw = response.read()
                      return json.loads(raw) if raw else None
              except urllib.error.HTTPError as exc:
                  if allow_404 and exc.code == 404:
                      return None
                  raise

          def matching_runs():
              payload = request(
                  f'{api}/actions/workflows/{workflow}/runs?branch=main&event=workflow_dispatch&per_page=30'
              )
              runs = [
                  run for run in payload.get('workflow_runs', [])
                  if str(run.get('head_sha', '')) == trigger_sha
              ]
              return sorted(runs, key=lambda run: str(run.get('created_at', '')), reverse=True)

          runs = matching_runs()
          dispatched_now = False
          if not runs:
              request(
                  f'{api}/actions/workflows/{workflow}/dispatches',
                  method='POST',
                  payload={'ref': 'main'},
              )
              dispatched_now = True
              for _ in range(12):
                  time.sleep(5)
                  runs = matching_runs()
                  if runs:
                      break
          if not runs:
              raise SystemExit('empirical confirmation dispatch produced no run for the trigger SHA')

          run = runs[0]
          receipt = {
              'purpose': 'product_a_v2_6_empirical_confirmation_launch_receipt',
              'launcher_trigger_sha': trigger_sha,
              'dispatched_now': dispatched_now,
              'run_id': int(run['id']),
              'run_number': int(run['run_number']),
              'status': str(run['status']),
              'conclusion': run.get('conclusion'),
              'created_at': str(run['created_at']),
              'head_sha': str(run['head_sha']),
              'html_url': str(run['html_url']),
              'workflow_name': str(run['name']),
          }
          path = 'configs/product_a_v2_6_empirical_confirmation_launch_receipt.json'
          existing = request(f'{api}/contents/{path}?ref=main', allow_404=True)
          payload = {
              'message': f'Record Product-A v2.6 empirical run {run["id"]}',
              'content': base64.b64encode((json.dumps(receipt, indent=2, sort_keys=True) + '\n').encode()).decode(),
              'branch': 'main',
          }
          if existing:
              payload['sha'] = existing['sha']
          request(f'{api}/contents/{path}', method='PUT', payload=payload)
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY
