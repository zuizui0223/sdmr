name: raster-block-equivalence

on:
  pull_request:
    paths:
      - 'src/sdmr/data/raster.py'
      - 'tests/test_raster_block_sampling.py'
      - '.github/workflows/raster-block-equivalence.yml'
  push:
    branches:
      - agent/nested-spatial-raster-benchmark
    paths:
      - 'src/sdmr/data/raster.py'
      - 'tests/test_raster_block_sampling.py'
      - '.github/workflows/raster-block-equivalence.yml'

permissions:
  contents: read

concurrency:
  group: raster-block-equivalence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-values:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install geo test dependencies
        run: python -m pip install -e '.[test,geo]'
      - name: Require exact rasterio-sample equivalence
        run: pytest -q tests/test_raster_block_sampling.py
