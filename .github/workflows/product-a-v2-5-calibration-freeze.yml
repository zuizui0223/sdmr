name: product-a-v2-5-calibration-freeze

on:
  pull_request:
    paths:
      - 'src/sdmr/v2_5_calibration_support.py'
      - 'src/sdmr/v2_5_contract.py'
      - 'src/sdmr/v2_5_refit_worker.py'
      - 'src/sdmr/v2_5_calibration_aggregate.py'
      - 'configs/product_a_v2_5_calibration_support.json'
      - '.github/workflows/product-a-v2-5-calibration-freeze.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: product-a-v2-5-calibration-freeze-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  calibration-refit:
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        panel: [panel_D1, panel_D2, panel_D3]
        taxon_index: [0, 1, 2, 3, 4]
        group: [base, noise, seasonality, soil, temperature, water]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_DISCOVERY_RUN_ID: '32096477308'
      SOURCE_DISCOVERY_HEAD_SHA: '3c222249109ac2c15f6258ebc79bb1c957dd42a4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package
        run: python -m pip install -e '.[test]'
      - name: Verify v2.5 contract before any calibration fit
        run: |
          python - <<'PY'
          from sdmr.v2_5_contract import load_v2_5_contract
          c=load_v2_5_contract('configs/product_a_v2_5_calibration_support.json')
          assert c.support_audit.complete
          assert len(c.panels) == 3
          assert all(len(p.calibration) == 5 for p in c.panels)
          PY
      - name: Verify and download frozen v2.4 discovery artifact
        run: |
          set -euo pipefail
          case '${{ matrix.panel }}' in
            panel_D1)
              artifact_id='9310256239'
              artifact_digest='sha256:aace53635728c8a2edf4a92de8136e127a21d9552679cad0f30048195e25e7db'
              ;;
            panel_D2)
              artifact_id='9310224903'
              artifact_digest='sha256:b47f660cab44e2c8e7a29131c163447a39d7aa6332a4c83a3ea0f7aebdd0936b'
              ;;
            panel_D3)
              artifact_id='9310181352'
              artifact_digest='sha256:5f325c22cffd3048ba99aecf24bf94dc6e95c9264aae6953e7ae0a9b473dc85e'
              ;;
          esac
          run_json=$(curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_DISCOVERY_RUN_ID")
          test "$(jq -r '.status' <<<"$run_json")" = 'completed'
          test "$(jq -r '.conclusion' <<<"$run_json")" = 'success'
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$SOURCE_DISCOVERY_HEAD_SHA"
          artifact_json=$(curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id")
          test "$(jq -r '.digest' <<<"$artifact_json")" = "$artifact_digest"
          test "$(jq -r '.workflow_run.id' <<<"$artifact_json")" = "$SOURCE_DISCOVERY_RUN_ID"
          test "$(jq -r '.workflow_run.head_sha' <<<"$artifact_json")" = "$SOURCE_DISCOVERY_HEAD_SHA"
          rm -rf source_discovery source_discovery.zip
          mkdir -p source_discovery
          curl --fail --location --retry 5 --retry-all-errors \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
            --output source_discovery.zip
          unzip -q source_discovery.zip -d source_discovery
          test -f source_discovery/contract.json
      - name: Fit frozen calibration members without truth
        run: |
          rm -rf worker_output
          python -m sdmr.v2_5_refit_worker \
            --contract configs/product_a_v2_5_calibration_support.json \
            --discovery-dir source_discovery \
            --panel '${{ matrix.panel }}' \
            --role calibration \
            --taxon-index '${{ matrix.taxon_index }}' \
            --group '${{ matrix.group }}' \
            --output-dir worker_output
      - name: Verify model-only calibration worker
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          root=Path('worker_output')
          c=json.loads((root/'contract.json').read_text())
          expected=pd.read_csv(root/'expected_members.csv')
          keys=pd.read_csv(root/'expected_response_keys.csv')
          fits=pd.read_csv(root/'fit_ledger.csv')
          assert c['purpose'] == 'product_a_v2_5_model_only_refit_worker'
          assert c['role'] == 'calibration'
          assert c['generating_truth_read'] is False
          assert c['real_empirical_data_read'] is False
          assert c['candidate_selection_performed'] is False
          assert c['scientific_threshold_tuning_performed'] is False
          assert len(expected) == c['n_frozen_candidates'] * 3 * 6
          assert set(expected['fit_mode']) == {'full_fit','spatial_refit'}
          assert fits['fit_status'].isin({'success','abstain_member_fit'}).all()
          expected_predictors={'temperature','water','soil'} if c['family']=='omitted_driver' else {'temperature','water'}
          assert set(keys['predictor'].astype(str)) == expected_predictors
          assert set(keys['quantity'].astype(str)) == {'optimum','lower_limit','upper_limit'}
          forbidden={'true_suitability','sampling_effort','focal_recording_multiplier'}
          for name in ('expected_members.csv','expected_response_keys.csv','fit_ledger.csv','response_estimates.csv','frozen_candidates.csv'):
              frame=pd.read_csv(root/name)
              assert not forbidden.intersection(frame.columns)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: product-a-v2-5-calibration-refit-${{ matrix.panel }}-taxon${{ matrix.taxon_index }}-${{ matrix.group }}
          path: worker_output/
          if-no-files-found: error
          retention-days: 90

  freeze-calibration:
    needs: calibration-refit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package
        run: python -m pip install -e '.[test]'
      - uses: actions/download-artifact@v4
        with:
          pattern: product-a-v2-5-calibration-refit-*
          path: calibration_workers
          merge-multiple: false
      - name: Verify all 90 model-only workers before opening calibration truth
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for path in Path('calibration_workers').rglob('contract.json'):
              row=json.loads(path.read_text())
              if row.get('purpose') == 'product_a_v2_5_model_only_refit_worker':
                  rows.append(row)
          assert len(rows) == 90, len(rows)
          assert all(r['role']=='calibration' for r in rows)
          assert all(r['generating_truth_read'] is False for r in rows)
          assert all(r['candidate_selection_performed'] is False for r in rows)
          keys={(r['panel'],int(r['taxon_index']),r['group']) for r in rows}
          assert len(keys) == 90
          PY
      - name: Freeze raw envelopes then open calibration truth once
        run: |
          rm -rf product_a_v2_5_calibration
          python -m sdmr.v2_5_calibration_aggregate \
            --contract configs/product_a_v2_5_calibration_support.json \
            --worker-root calibration_workers \
            --output-dir product_a_v2_5_calibration
      - name: Verify complete frozen calibration before any fresh validation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          root=Path('product_a_v2_5_calibration')
          c=json.loads((root/'contract.json').read_text())
          cal=pd.read_csv(root/'calibration.csv')
          assert c['purpose'] == 'product_a_v2_5_frozen_calibration_radii'
          assert c['n_model_only_calibration_workers'] == 90
          assert c['raw_envelopes_frozen_before_calibration_truth_read'] is True
          assert c['calibration_generating_truth_read_after_raw_freeze'] is True
          assert c['fresh_validation_taxa_simulated_or_read'] is False
          assert c['fresh_validation_truth_read'] is False
          assert c['validation_truth_used_for_calibration'] is False
          assert c['all_required_validation_keys_calibrated'] is True
          assert len(cal) == 27
          assert cal['calibration_status'].astype(str).eq('complete').all()
          assert set(cal['predictor']) == {'temperature','water','soil'}
          assert set(cal['quantity']) == {'optimum','lower_limit','upper_limit'}
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: product-a-v2-5-frozen-calibration
          path: product_a_v2_5_calibration/
          if-no-files-found: error
          retention-days: 90
