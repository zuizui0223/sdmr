name: sdmr-v3-stage-p-safety-v3-aggregate-repair

on:
  push:
    branches:
      - 'design/sdmr-v3-process-identification'
    paths:
      - 'configs/sdmr_v3_stage_p_safety_v3_aggregate_repair_execute.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: sdmr-v3-stage-p-safety-v3-aggregate-repair
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install -e '.[test]'
      - name: Verify repair activation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("configs/sdmr_v3_stage_p_safety_v3_aggregate_repair_execute.json")
          x=json.loads(p.read_text())
          assert x["purpose"]=="repair_stage_p_safety_v3_aggregate_only"
          assert x["source_workflow_run"]==35992320576
          assert x["scientific_shards_recomputed"] is False
          assert x["reason"]=="float_serialization_hash_only"
          PY
      - name: Download original Stage-P v3 shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 'stage-p-safety-v3-*'
          path: safety-shards
          run-id: 35992320576
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Aggregate original Stage-P v3 evidence
        run: |
          python scripts/aggregate_sdmr_v3_stage_p_safety_v3.py \
            --input-root safety-shards \
            --outdir safety-aggregate \
            --config configs/sdmr_v3_stage_p_safety_audit_v3.json \
            --expected-shards 8
      - name: Record repair provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("safety-aggregate/aggregate_repair_receipt.json")
          p.write_text(json.dumps({
            "source_workflow_run":35992320576,
            "source_shard_count":8,
            "scientific_shards_recomputed":False,
            "repair":"semantic hash + 14-digit numeric hash replaced nonportable 17-digit CSV hash",
          },indent=2,sort_keys=True)+"\n")
          PY
      - name: Upload repaired Stage-P aggregate
        uses: actions/upload-artifact@v4
        with:
          name: sdmr-v3-stage-p-safety-v3-repaired-aggregate
          path: safety-aggregate/
          if-no-files-found: error
