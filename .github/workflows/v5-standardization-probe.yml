name: v5 post-terminal standardization diagnosis (model-pool only)

on:
  push:
    branches:
      - development/v5-standardization-cause-probe-v1
    paths:
      - 'configs/v5_standardization_probe_execute.lock'

permissions:
  contents: read
  actions: read

env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  PYTHONHASHSEED: '0'

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install diagnostic dependencies
        run: |
          python -m pip install -e '.[test,parquet]'
          python -m pip install 'scikit-learn==1.9.1' 'numpy==2.5.3' 'pandas==3.0.6' 'scipy==1.18.1'
          python -m pip show scikit-learn numpy pandas scipy
      - name: Verify standalone diagnostic tests before original inputs
        run: python -m pytest -q tests/test_v5_standardization_probe.py
      - name: Download frozen all46 model-pool feature table
        uses: actions/download-artifact@v4
        with:
          name: sdmr-fresh-empirical-v5-feature-gate
          run-id: 37545674411
          github-token: ${{ github.token }}
          path: frozen/feature
      - name: Download frozen occurrence model-pool partition
        uses: actions/download-artifact@v4
        with:
          name: sdmr-fresh-empirical-v5-occurrence-split
          run-id: 37305740628
          github-token: ${{ github.token }}
          path: frozen/occurrence
      - name: Download frozen original model-pool result
        uses: actions/download-artifact@v4
        with:
          name: sdmr-fresh-empirical-v5-model-pool-freeze
          run-id: 37613738626
          github-token: ${{ github.token }}
          path: frozen/pool
      - name: Repackage explicit allowed inputs only
        run: |
          mkdir -p inputs outputs
          (cd frozen/feature && zip -q ../../inputs/feature.zip location_features_v5.parquet model_pool_feature_index_v5.csv background_300km_feature_index_v5.csv)
          (cd frozen/occurrence && zip -q ../../inputs/occurrence.zip model_pool_occurrences_v5.csv)
          (cd frozen/pool && zip -q -r ../../inputs/pool.zip model_pool_freeze)
      - name: Evaluate exact first ten frozen ranks, without sealed holdout
        run: >-
          python experiments/v5_standardization_probe.py
          --feature-zip inputs/feature.zip
          --occurrence-zip inputs/occurrence.zip
          --pool-zip inputs/pool.zip
          --registry experiments/frozen_v5_process_registry.csv
          --taxon-limit 10
          --output outputs/v5_standardization_model_pool_probe_10.json
      - name: Enforce post-terminal non-promotion invariant
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('outputs/v5_standardization_model_pool_probe_10.json')
          x=json.loads(p.read_text())
          assert x['taxon_limit']==10
          assert x['frozen_taxon_denominator']==50
          assert x['truth_or_sealed_answer_check_read'] is False
          assert x['reference_v5_emp_d']['promotion']=='failed_closed'
          assert x['baseline_replay']['all_within_1e-3'], 'raw logistic does not reproduce frozen CV; block attribution'
          print('exploratory model-pool replay reproduced original baseline; no v5 re-promotion')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdmr-v5-postterminal-standardization-probe-first10
          path: outputs/
          if-no-files-found: warn
          retention-days: 90
