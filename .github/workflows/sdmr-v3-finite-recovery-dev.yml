name: sdmr-v3-finite-recovery-dev

on:
  push:
    branches:
      - 'design/sdmr-v3-process-identification'
    paths:
      - 'src/sdmr/process_id/evidence.py'
      - 'src/sdmr/process_id/known_truth/resampling.py'
      - 'src/sdmr/process_id/known_truth/finite_recovery_audit.py'
      - 'tests/test_process_id_evidence.py'
      - 'tests/test_process_id_resampling.py'
      - 'tests/test_process_id_finite_recovery_audit.py'
      - '.github/workflows/sdmr-v3-finite-recovery-dev.yml'
  pull_request:
    paths:
      - 'src/sdmr/process_id/evidence.py'
      - 'src/sdmr/process_id/known_truth/resampling.py'
      - 'tests/test_process_id_evidence.py'
      - 'tests/test_process_id_resampling.py'
      - '.github/workflows/sdmr-v3-finite-recovery-dev.yml'

permissions:
  contents: read

concurrency:
  group: sdmr-v3-finite-recovery-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run finite-recovery development tests
        run: |
          pytest -q             tests/test_process_id_evidence.py             tests/test_process_id_resampling.py \
            tests/test_process_id_finite_recovery_audit.py
