name: Product-A v2.8.4 sealed reusable

on:
  workflow_call:
    inputs:
      implementation_ref:
        description: Exact reviewed sealed implementation commit
        required: true
        type: string
      reusable_workflow_sha256:
        description: Newline-canonical SHA-256 of this reusable workflow
        required: true
        type: string
      authorization_commit_sha:
        description: Exact merge commit containing the separate sealed authorization and caller
        required: true
        type: string
      caller_workflow_sha256:
        description: Newline-canonical SHA-256 of the separately authorized caller workflow
        required: true
        type: string
      sealed_authorization_receipt_digest:
        description: Canonical digest embedded in the separate one-shot sealed authorization
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: product-a-v2-8-4-sealed-product-a-v2-8-4-fresh-confirmation-v1
  cancel-in-progress: false

env:
  BOUNDARY: configs/product_a_v2_8_4_sealed_boundary_contract.json
  FREEZE: configs/product_a_v2_8_4_environment_timeout_freeze.json
  SCIENTIFIC_CONTRACT: configs/product_a_v2_8_3_fresh_confirmation_contract.json
  TAXON_REGISTRY: configs/product_a_v2_8_2_fresh_confirmation_taxa.csv
  CHELSA_MANIFEST: configs/chelsa_v2_1_plant_candidates.csv
  SOURCE_RUN_ID: '33036252432'

jobs:
  authorization-and-receipt-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.implementation_ref }}
          fetch-depth: 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.authorization_commit_sha }}
          path: authorization-checkout
          fetch-depth: 1

      - name: Verify separate one-shot authorization before any sealed source access
        env:
          PYTHONPATH: src
          IMPLEMENTATION_REF: ${{ inputs.implementation_ref }}
          WORKFLOW_SHA256: ${{ inputs.reusable_workflow_sha256 }}
          CALLER_SHA256: ${{ inputs.caller_workflow_sha256 }}
          AUTH_COMMIT: ${{ inputs.authorization_commit_sha }}
          AUTH_DIGEST: ${{ inputs.sealed_authorization_receipt_digest }}
          CURRENT_SHA: ${{ github.sha }}
          CURRENT_REF: ${{ github.ref }}
          CURRENT_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          mkdir -p preflight
          python3 -m sdmr.v2_8_4_sealed_authorization \
            --authorization authorization-checkout/configs/product_a_v2_8_4_sealed_execution_authorization.json \
            --boundary "$BOUNDARY" \
            --implementation-root . \
            --authorization-root authorization-checkout \
            --implementation-ref "$IMPLEMENTATION_REF" \
            --reusable-workflow-sha256 "$WORKFLOW_SHA256" \
            --caller-workflow-sha256 "$CALLER_SHA256" \
            --authorization-commit-sha "$AUTH_COMMIT" \
            --current-sha "$CURRENT_SHA" \
            --current-ref "$CURRENT_REF" \
            --current-event "$CURRENT_EVENT" \
            --output preflight/authorization_gate.json
          python3 - <<'PY'
          import json, os
          gate=json.load(open('preflight/authorization_gate.json'))
          if gate['authorization_receipt_digest'] != os.environ['AUTH_DIGEST']:
              raise SystemExit('Product-A v2.8.4 sealed authorization input digest changed')
          if gate['one_shot_sealed_execution_authorized'] is not True:
              raise SystemExit('Product-A v2.8.4 sealed execution is not authorized')
          PY

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
          cache: pip
          cache-dependency-path: configs/product_a_v2_8_4_scientific_requirements.lock

      - name: Install exact scientific environment
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r configs/product_a_v2_8_4_scientific_requirements.lock
          python -m pip install --disable-pip-version-check --no-deps -e .

      - name: Fail closed on runner-environment drift before any sealed source access
        run: |
          python -m sdmr.v2_8_4_presealed_receipt environment \
            --freeze "$FREEZE" \
            --output preflight/environment_receipt.json

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: product-a-v2-8-4-presealed-receipt-2026082201
          path: receipts/2026082201
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: '33155966119'

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: product-a-v2-8-4-presealed-receipt-2026082202
          path: receipts/2026082202
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: '33155969410'

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: product-a-v2-8-4-presealed-receipt-2026082203
          path: receipts/2026082203
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: '33155971954'

      - name: Validate all three reviewed receipt artifacts and build truth-blind input gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          boundary=json.load(open(os.environ['BOUNDARY']))
          headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json'}
          artifacts=[]
          for pin in boundary['presealed_receipts']:
              url=f"https://api.github.com/repos/{os.environ['REPOSITORY']}/actions/artifacts/{int(pin['artifact_id'])}"
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers)) as response:
                  artifacts.append(json.load(response))
          with open('preflight/outer_receipt_artifacts.json','w') as handle:
              json.dump({'artifacts':artifacts},handle,indent=2,sort_keys=True)
          PY
          python -m sdmr.v2_8_4_sealed_runtime input-gate \
            --boundary "$BOUNDARY" \
            --receipt receipts/2026082201/presealed_part_receipt.json \
            --receipt receipts/2026082202/presealed_part_receipt.json \
            --receipt receipts/2026082203/presealed_part_receipt.json \
            --outer-artifact-catalog preflight/outer_receipt_artifacts.json \
            --output preflight/truth_blind_input_gate.json
          python -m json.tool preflight/truth_blind_input_gate.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: product-a-v2-8-4-sealed-preflight
          path: preflight/
          if-no-files-found: error
          retention-days: 90

  sealed-part:
    needs: authorization-and-receipt-preflight
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - seed: 2026082201
            presealed_run_id: 33155966119
          - seed: 2026082202
            presealed_run_id: 33155969410
          - seed: 2026082203
            presealed_run_id: 33155971954
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.implementation_ref }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
          cache: pip
          cache-dependency-path: configs/product_a_v2_8_4_scientific_requirements.lock

      - name: Install exact scientific environment
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r configs/product_a_v2_8_4_scientific_requirements.lock
          python -m pip install --disable-pip-version-check --no-deps -e .

      - name: Fail closed on this part runner before downloading sealed-source artifacts
        run: |
          mkdir -p technical-state
          python -m sdmr.v2_8_4_presealed_receipt environment \
            --freeze "$FREEZE" \
            --output technical-state/environment_receipt.json

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: product-a-v2-8-4-sealed-preflight
          path: preflight

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: product-a-v2-8-4-presealed-receipt-${{ matrix.seed }}
          path: receipt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ matrix.presealed_run_id }}

      - name: Verify exactly 15 receipt-pinned input artifacts before any download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PART_SEED: ${{ matrix.seed }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          receipt=json.load(open('receipt/presealed_part_receipt.json'))
          seed=int(os.environ['PART_SEED'])
          if int(receipt['part_seed']) != seed:
              raise SystemExit('Product-A v2.8.4 sealed receipt seed mismatch')
          pins=list(receipt['source_artifacts'])
          pins += [x for x in receipt['output_artifacts'] if x['artifact_name'].startswith(f'v284-pretruth-{seed}')]
          pins += [x for x in receipt['output_artifacts'] if x['artifact_name'].startswith(f'v284-final-{seed}-taxon')]
          if len(pins) != 15:
              raise SystemExit('Product-A v2.8.4 sealed input pin count changed')
          headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json'}
          rows=[]
          for pin in pins:
              url=f"https://api.github.com/repos/{os.environ['REPOSITORY']}/actions/artifacts/{int(pin['artifact_id'])}"
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers)) as response:
                  rows.append(json.load(response))
          with open('technical-state/input_artifact_catalog.json','w') as handle:
              json.dump({'artifacts':rows},handle,indent=2,sort_keys=True)
          PY
          python -m sdmr.v2_8_4_sealed_runtime part-manifest \
            --boundary "$BOUNDARY" \
            --gate preflight/truth_blind_input_gate.json \
            --receipt receipt/presealed_part_receipt.json \
            --artifact-catalog technical-state/input_artifact_catalog.json \
            --part-seed "${PART_SEED}" \
            --output technical-state/part_input_manifest.json

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: v283-fresh-part-${{ matrix.seed }}
          path: source/part
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: '33036252432'

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: v283-structural-part-${{ matrix.seed }}
          path: structural/part
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: '33036252432'

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: v284-pretruth-${{ matrix.seed }}
          path: pretruth
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ matrix.presealed_run_id }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: v284-final-${{ matrix.seed }}-taxon*
          path: final-fits
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ matrix.presealed_run_id }}

      - name: Enter the one-shot sealed read and finalize this part
        env:
          PART_SEED: ${{ matrix.seed }}
          AUTH_DIGEST: ${{ inputs.sealed_authorization_receipt_digest }}
        run: |
          set +e
          mkdir -p sealed-audit finalized
          python -m sdmr.v2_8_4_sealed_runtime sealed-audit \
            --boundary "$BOUNDARY" \
            --gate preflight/truth_blind_input_gate.json \
            --receipt receipt/presealed_part_receipt.json \
            --environment-receipt technical-state/environment_receipt.json \
            --scientific-contract "$SCIENTIFIC_CONTRACT" \
            --part-dir source/part \
            --pretruth-dir pretruth \
            --final-fit-root final-fits \
            --manifest "$CHELSA_MANIFEST" \
            --part-seed "$PART_SEED" \
            --sealed-authorization-receipt-digest "$AUTH_DIGEST" \
            --state technical-state/sealed_read_state.json \
            --output-dir sealed-audit
          RC=$?
          if [ "$RC" -eq 0 ]; then
            python -m sdmr.v2_8_4_sealed_runtime finalize-part \
              --boundary "$BOUNDARY" \
              --audit-dir sealed-audit \
              --structural-part-dir structural/part \
              --taxa "$TAXON_REGISTRY" \
              --part-seed "$PART_SEED" \
              --output-dir finalized
            RC=$?
          fi
          printf '%s\n' "$RC" > technical-state/technical_return_code.txt
          exit "$RC"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: product-a-v2-8-4-sealed-state-${{ matrix.seed }}
          path: |
            technical-state/
            sealed-audit/
          if-no-files-found: warn
          retention-days: 90

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: product-a-v2-8-4-finalized-part-${{ matrix.seed }}
          path: finalized/
          if-no-files-found: error
          retention-days: 90

  aggregate-decision:
    needs: sealed-part
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.implementation_ref }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
          cache: pip
          cache-dependency-path: configs/product_a_v2_8_4_scientific_requirements.lock

      - name: Install exact scientific environment
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r configs/product_a_v2_8_4_scientific_requirements.lock
          python -m pip install --disable-pip-version-check --no-deps -e .

      - name: Verify aggregate runner identity
        run: |
          python -m sdmr.v2_8_4_presealed_receipt environment \
            --freeze "$FREEZE" \
            --output aggregate-environment.json

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: product-a-v2-8-4-sealed-preflight
          path: preflight

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: product-a-v2-8-3-structural-transportability
          path: structural-aggregate
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: '33036252432'

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: product-a-v2-8-4-finalized-part-*
          path: finalized-parts

      - name: Apply the unchanged fixed-denominator v2.8.3 decision semantics
        env:
          AUTH_DIGEST: ${{ inputs.sealed_authorization_receipt_digest }}
        run: |
          python -m sdmr.v2_8_4_sealed_runtime aggregate \
            --boundary "$BOUNDARY" \
            --gate preflight/truth_blind_input_gate.json \
            --environment-receipt aggregate-environment.json \
            --scientific-contract "$SCIENTIFIC_CONTRACT" \
            --structural-aggregate-dir structural-aggregate \
            --finalized-root finalized-parts \
            --sealed-authorization-receipt-digest "$AUTH_DIGEST" \
            --output-dir terminal-decision
          python -m json.tool terminal-decision/contract.json
          python - <<'PY'
          import pandas as pd
          row=pd.read_csv('terminal-decision/decision.csv').iloc[0]
          print(row.to_dict())
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: product-a-v2-8-4-terminal-decision
          path: terminal-decision/
          if-no-files-found: error
          retention-days: 90
