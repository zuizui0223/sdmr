name: FIA VA-WI shared vs regional growth synthetic contract tests

on:
  pull_request:
    paths:
      - 'experiments/fia_shared_vs_regional_growth_core_v1.py'
      - 'experiments/fia_VA_WI_new_source_growth_v1.py'
      - 'tests/test_fia_shared_vs_regional_growth_core_v1.py'
      - 'tests/test_fia_VA_WI_new_source_growth_v1.py'
      - 'experiments/fia_density_vs_county_climate_replay_v1.py'
      - 'tests/test_fia_density_vs_county_climate_replay_v1.py'
      - 'experiments/fia_county_within_basal_area_audit_v1.py'
      - 'tests/test_fia_county_within_basal_area_audit_v1.py'
      - 'experiments/fia_plot_equal_BA_sensitivity_v1.py'
      - 'tests/test_fia_plot_equal_BA_sensitivity_v1.py'
      - 'configs/fia_VA_WI_shared_regional_growth_v1.json'
      - 'docs/FIA_VA_WI_CONDITIONAL_GROWTH_V1.md'
      - '.github/workflows/fia-VA-WI-growth-contract-tests-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed model and validation dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2,<4' 'pytest>=8,<10'
      - name: Verify full source and known-truth learner refusal controls
        run: |
          python -m pytest -q \
            tests/test_fia_shared_vs_regional_growth_core_v1.py \
            tests/test_fia_VA_WI_new_source_growth_v1.py \
            tests/test_fia_VA_WI_county_source_folds_v1.py \
            tests/test_fia_density_vs_county_climate_replay_v1.py \
            tests/test_fia_county_within_basal_area_audit_v1.py \
            tests/test_fia_plot_equal_BA_sensitivity_v1.py
      - name: Verify model output is not prospectively biological-confirmatory
        run: |
          python - <<'PY'
          import json
          x=json.load(open('configs/fia_VA_WI_shared_regional_growth_v1.json'))
          assert x['states']==['VA','WI']
          assert x['primary_five_species']==['129','316','802','833','837']
          assert x['scientific_status']=='postpriorFIAoutcome_exploratory_noncausal_development'
          assert x['new_source_version_not_independent_individual_sample']
          assert x['no_RI_tree_outcomes_opened']
          assert x['survival_endpoint']=='not_evaluated_only_qc_transition_counts'
          PY
