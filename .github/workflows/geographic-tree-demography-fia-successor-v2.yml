name: geographic-tree-demography-fia-successor-v2

on:
  pull_request:
    paths:
      - 'experiments/geographic_tree_demography_fia_crosswalk_v1.py'
      - 'experiments/geographic_tree_demography_fia_wi_capacity_v2.py'
      - 'tests/test_geographic_tree_demography_fia_crosswalk_v1.py'
      - 'docs/GEOGRAPHIC_TREE_DEMOGRAPHY_FIA_SUCCESSOR_V2.md'
      - '.github/workflows/geographic-tree-demography-fia-successor-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-ref-species:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source-only taxonomy linkage
        run: python -m pip install pytest && python -m pytest -q tests/test_geographic_tree_demography_fia_crosswalk_v1.py
      - name: Download official FIA species reference table (no growth data)
        run: |
          python experiments/geographic_tree_demography_fia_crosswalk_v1.py \
            --output artifacts/fia_taxon_crosswalk_v1.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fia-taxonomy-crosswalk-v1
          path: artifacts/fia_taxon_crosswalk_v1.json
          if-no-files-found: warn
  wi-size-cap-successor:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recheck unchanged Wisconsin state archive with larger technical byte cap
        run: |
          python experiments/geographic_tree_demography_fia_wi_capacity_v2.py \
            --output artifacts/fia_wi_capacity_successor_v2.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fia-wi-archive-size-successor-v2
          path: artifacts/fia_wi_capacity_successor_v2.json
          if-no-files-found: warn
