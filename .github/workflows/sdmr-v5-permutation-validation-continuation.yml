name: sdmr-v5-permutation-validation-continuation

on:
  push:
    branches:
      - 'design/sdmr-v3-process-identification'
    paths:
      - 'configs/sdmr_v5_permutation_validation_continuation_once.json'

permissions:
  contents: read

concurrency:
  group: sdmr-v5-permutation-validation-continuation
  cancel-in-progress: false

jobs:
  continue:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - world: unique_process
            seed_block: 0
          - world: redundant_representation
            seed_block: 2
          - world: redundant_representation
            seed_block: 3
          - world: shared_carrier
            seed_block: 1
          - world: shared_carrier
            seed_block: 2
          - world: shared_carrier
            seed_block: 4
          - world: null_correlated
            seed_block: 1
          - world: interaction
            seed_block: 1
          - world: interaction
            seed_block: 2
          - world: interaction
            seed_block: 3
          - world: interaction
            seed_block: 4
          - world: observation_confounded
            seed_block: 0
          - world: observation_confounded
            seed_block: 1
          - world: observation_confounded
            seed_block: 2
          - world: observation_confounded
            seed_block: 3
          - world: observation_confounded
            seed_block: 4
          - world: omitted_driver
            seed_block: 0
          - world: omitted_driver
            seed_block: 1
          - world: omitted_driver
            seed_block: 2
          - world: omitted_driver
            seed_block: 3
          - world: omitted_driver
            seed_block: 4
          - world: geographic_shift
            seed_block: 0
          - world: geographic_shift
            seed_block: 1
          - world: geographic_shift
            seed_block: 2
          - world: geographic_shift
            seed_block: 3
          - world: geographic_shift
            seed_block: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 89dd508e3367417fc077c2b71511e6567cf60813
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install -e '.[test]'
      - name: Verify continuation provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("configs/sdmr_v5_permutation_gate_validation_v1_execute.json").read_text())
          assert x["purpose"]=="execute_sdmr_v5_permutation_gate_validation_v1"
          assert x["config_blob_sha"]=="3c6fb2a14aeab46788b5cdb178e0eb3f88b43186"
          PY
      - name: Run missing validation shard
        run: |
          python scripts/run_sdmr_v5_permutation_gate_validation_shard.py \
            --config configs/sdmr_v5_permutation_gate_validation_v1.json \
            --activation configs/sdmr_v5_permutation_gate_validation_v1_execute.json \
            --world ${{ matrix.world }} \
            --seed-block ${{ matrix.seed_block }} \
            --outdir validation-output
      - name: Upload continuation shard
        uses: actions/upload-artifact@v4
        with:
          name: v5-perm-val-${{ matrix.world }}-block${{ matrix.seed_block }}
          path: validation-output/
          if-no-files-found: error
