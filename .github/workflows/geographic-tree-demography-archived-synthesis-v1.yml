name: geographic-tree-demography-archived-synthesis-v1

on:
  pull_request:
    paths:
      - 'evidence/geographic_tree_demography_first_response_v1/aggregate.json'
      - 'experiments/geographic_tree_demography_archived_synthesis_v1.py'
      - 'tests/test_geographic_tree_demography_archived_synthesis_v1.py'
      - 'results/fia_archived_regional_growth_status_synthesis_v1.json'
      - 'docs/GEOGRAPHIC_TREE_DEMOGRAPHY_ARCHIVED_SYNTHESIS_V1.md'
      - '.github/workflows/geographic-tree-demography-archived-synthesis-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-only-recompute:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source hash and cohort, species bands, status denominators
        run: python -m pip install pytest && python -m pytest -q tests/test_geographic_tree_demography_archived_synthesis_v1.py
      - name: Recreate same 13 x 3 result without data download
        run: |
          python experiments/geographic_tree_demography_archived_synthesis_v1.py \
            --source evidence/geographic_tree_demography_first_response_v1/aggregate.json \
            --output /tmp/fia_archived_regional_growth_status_synthesis_v1.json
          cmp /tmp/fia_archived_regional_growth_status_synthesis_v1.json results/fia_archived_regional_growth_status_synthesis_v1.json
