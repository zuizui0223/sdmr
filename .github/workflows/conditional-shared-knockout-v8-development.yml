name: conditional-shared-knockout-v8-development

on:
  pull_request:
    paths:
      - 'src/sdmr/conditional_shared_information_knockout.py'
      - 'src/sdmr/conditional_shared_knockout_process_challenge.py'
      - 'src/sdmr/conditional_shared_knockout_v8_development.py'
      - 'configs/conditional_shared_knockout_v8_development.json'
      - 'tests/test_conditional_shared_information_knockout.py'
      - 'tests/test_conditional_shared_knockout_process_challenge.py'
      - '.github/workflows/conditional-shared-knockout-v8-development.yml'
  workflow_dispatch:

permissions:
  contents: read
  checks: read

env:
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  VECLIB_MAXIMUM_THREADS: '1'
  BLIS_NUM_THREADS: '1'

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - name: Wait for required full CI matrix on this exact head
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          required=(core-py3.10 core-py3.11 core-py3.12 core-py3.13 geo-rasterio-py3.12)
          for attempt in $(seq 1 180); do
            checks="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/commits/${CHECK_SHA}/check-runs?per_page=100")"
            pending=0
            for name in "${required[@]}"; do
              row="$(jq -r --arg name "$name" '[.check_runs[] | select(.name == $name)] | sort_by(.started_at // .completed_at // "") | last | if . == null then "missing\t" else [.status, (.conclusion // "")] | @tsv end' <<<"$checks")"
              status="${row%%$'\t'*}"; conclusion="${row#*$'\t'}"
              if [[ "$status" == "completed" ]]; then
                [[ "$conclusion" == "success" ]] || exit 1
              else
                pending=1
              fi
            done
            [[ "$pending" -eq 0 ]] && break
            [[ "$attempt" -lt 180 ]] || exit 1
            sleep 20
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package
        run: python -m pip install -e '.[test]'
      - name: Verify v8 contract and focused tests
        run: |
          pytest -q tests/test_conditional_shared_information_knockout.py tests/test_conditional_shared_knockout_process_challenge.py
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('configs/conditional_shared_knockout_v8_development.json').read_text())
          assert c['development_only'] is True
          assert c['eligible_for_prospective_performance_claim'] is False
          assert c['consumed_seed_denominator'] == list(range(15001,15011))
          assert c['retained_non_target_predictors_must_be_numerically_unchanged'] is True
          assert c['fresh_empirical_validation_authorized'] is False
          PY

  family:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        family: [gaussian, asymmetric, soft_threshold, interaction, omitted_driver, observation_confounded]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Fit v8 on consumed denominator
        run: python -m sdmr.conditional_shared_knockout_v8_development fit-family --family '${{ matrix.family }}' --output-dir development
      - uses: actions/upload-artifact@v4
        with:
          name: conditional-v8-development-${{ matrix.family }}-${{ github.sha }}
          path: development/
          retention-days: 90
          if-no-files-found: error

  aggregate:
    needs: family
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: conditional-v8-development-*-${{ github.sha }}
          path: inputs
          merge-multiple: false
      - name: Aggregate consumed development readout
        run: python -m sdmr.conditional_shared_knockout_v8_development aggregate --input-dir inputs --output-dir development | tee development_stdout.txt
      - name: Verify reporting boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('development/development_decision.json').read_text())
          assert d['development_only'] is True
          assert d['eligible_for_prospective_performance_claim'] is False
          assert d['n_cases'] == 60
          assert d['n_process_cells'] == 300
          assert d['fresh_known_truth_validation_required_before_promotion'] is True
          assert d['fresh_empirical_validation_authorized'] is False
          print(json.dumps(d,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: conditional-shared-knockout-v8-development-${{ github.sha }}
          path: development/
          retention-days: 90
          if-no-files-found: error
