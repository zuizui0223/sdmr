name: decorrelation-contrast-v10-development

on:
  pull_request:
    paths:
      - 'src/sdmr/environmental_decorrelation_audit.py'
      - 'src/sdmr/decorrelation_contrast_v10_development.py'
      - 'src/sdmr/separator_block_process_contrast.py'
      - 'configs/decorrelation_contrast_v10_development.json'
      - 'tests/test_environmental_decorrelation_audit.py'
      - 'tests/test_separator_block_process_contrast.py'
      - 'tests/test_decorrelation_contrast_v10_contract.py'
      - '.github/workflows/decorrelation-contrast-v10-development.yml'
  workflow_dispatch:

permissions:
  contents: read
  checks: read

env:
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e . pytest
      - run: pytest -q tests/test_environmental_decorrelation_audit.py tests/test_separator_block_process_contrast.py tests/test_decorrelation_contrast_v10_contract.py

  family:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        family: [gaussian, asymmetric, soft_threshold, interaction, omitted_driver, observation_confounded]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e .
      - run: python -m sdmr.decorrelation_contrast_v10_development fit-family --family '${{ matrix.family }}' --output-dir output
      - uses: actions/upload-artifact@v4
        with:
          name: decorrelation-v10-${{ matrix.family }}-${{ github.sha }}
          path: output/
          retention-days: 90

  aggregate:
    needs: family
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: decorrelation-v10-*-${{ github.sha }}
          path: inputs
      - run: python -m sdmr.decorrelation_contrast_v10_development aggregate --input-dir inputs --output-dir development | tee development_stdout.txt
      - uses: actions/upload-artifact@v4
        with:
          name: decorrelation-contrast-v10-development-${{ github.sha }}
          path: development/
          retention-days: 90
