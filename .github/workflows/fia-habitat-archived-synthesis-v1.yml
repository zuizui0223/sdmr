name: fia-habitat-archived-synthesis-v1

on:
  pull_request:
    paths:
      - 'evidence/fia_habitat_structure_extension_v1/**'
      - 'experiments/fia_habitat_archived_synthesis_v1.py'
      - 'tests/test_fia_habitat_archived_synthesis_v1.py'
      - 'results/fia_habitat_archived_synthesis_v1.json'
      - 'docs/FIA_HABITAT_ARCHIVED_SYNTHESIS_V1.md'
      - '.github/workflows/fia-habitat-archived-synthesis-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run archive-only biological-denominator and sensitivity tests
        run: python -m pytest -q tests/test_fia_habitat_archived_synthesis_v1.py
      - name: Recompute from SHA-256-pinned aggregate, without external source requests
        run: |
          python experiments/fia_habitat_archived_synthesis_v1.py \
            --source evidence/fia_habitat_structure_extension_v1/aggregate.json \
            --output artifacts/fia_habitat_archived_synthesis_v1.json
      - name: Verify deterministic archival output
        run: cmp results/fia_habitat_archived_synthesis_v1.json artifacts/fia_habitat_archived_synthesis_v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: fia-habitat-archived-synthesis-v1
          path: artifacts/fia_habitat_archived_synthesis_v1.json
          if-no-files-found: error
