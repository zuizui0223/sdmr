name: product-a-v2-7-2-postsealed-recovery-pr-launch

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'configs/product_a_v2_7_2_postsealed_recovery_pr_trigger.txt'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Dispatch exactly one frozen post-sealed recovery
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.parse, urllib.request
          from pathlib import Path

          auth=json.load(open('configs/product_a_v2_7_2_postsealed_abstention_recovery_execution.json'))
          recovery=json.load(open('configs/product_a_v2_7_2_postsealed_abstention_recovery_contract.json'))
          if auth.get('purpose')!='product_a_v2_7_2_postsealed_abstention_recovery_execution_authorization':
              raise SystemExit('wrong recovery execution authorization')
          if auth.get('execution_allowed') is not True or auth.get('one_shot') is not True:
              raise SystemExit('recovery gate is closed or not one-shot')
          if auth.get('rerun_all_6_audits') is not True or auth.get('reuse_old_audits_for_decision') is not False:
              raise SystemExit('recovery denominator/reuse rule changed')
          if auth.get('post_outcome_retuning_allowed') is not False:
              raise SystemExit('post-outcome retuning was authorized')
          if auth.get('scientific_promotion_allowed') is not False or auth.get('product_b_unblocked') is not False:
              raise SystemExit('launcher crossed scientific claim boundary')
          if recovery.get('purpose')!='product_a_v2_7_2_postsealed_abstention_control_flow_recovery':
              raise SystemExit('wrong recovery contract')
          if recovery['diagnosis'].get('successful_audit_result_contents_used_to_design_repair') is not False:
              raise SystemExit('recovery was designed from successful sealed outcomes')
          if recovery['repair'].get('available_or_authorized_scientific_audit_function_changed') is not False:
              raise SystemExit('available scientific audit path changed')
          if recovery['repair'].get('rerun_all_6_audit_parts_uniformly') is not True:
              raise SystemExit('uniform six-part recovery changed')
          required=('implementation_sha','frozen_ref','workflow_blob_sha','contract_blob_sha','wrapper_blob_sha','original_audit_blob_sha')
          if any(not auth.get(k) for k in required):
              raise SystemExit('frozen recovery identity incomplete')

          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']; api=f'https://api.github.com/repos/{repo}'
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'sdmr-v272-postsealed-launcher'}
          def request(url,*,method='GET',payload=None):
              data=None if payload is None else json.dumps(payload).encode()
              req=urllib.request.Request(url,data=data,headers=headers,method=method)
              with urllib.request.urlopen(req,timeout=60) as r:
                  raw=r.read(); return json.loads(raw) if raw else None
          def verify_blob(path,expected):
              quoted=urllib.parse.quote(path,safe='/')
              ref=urllib.parse.quote(auth['frozen_ref'],safe='')
              data=request(f'{api}/contents/{quoted}?ref={ref}')
              if data.get('sha')!=expected:
                  raise SystemExit(f'frozen recovery blob changed: {path}')
          verify_blob('.github/workflows/product-a-v2-7-2-postsealed-abstention-recovery.yml',auth['workflow_blob_sha'])
          verify_blob('configs/product_a_v2_7_2_postsealed_abstention_recovery_contract.json',auth['contract_blob_sha'])
          verify_blob('src/sdmr/v2_7_2_fresh_sealed_audit_recovery.py',auth['wrapper_blob_sha'])
          verify_blob('src/sdmr/v2_7_2_fresh_sealed_audit.py',auth['original_audit_blob_sha'])

          source=request(f"{api}/actions/runs/{int(auth['source_run_id'])}")
          if source.get('status')!='completed' or source.get('conclusion')!='failure':
              raise SystemExit('source run no longer matches failed sealed-stage source')
          if source.get('head_sha')!='c12acaefaacd07dbdd3a442d913fc8af9d6b2d6d':
              raise SystemExit('source sealed-stage runtime changed')

          workflow='product-a-v2-7-2-postsealed-abstention-recovery.yml'
          def matches():
              data=request(f'{api}/actions/workflows/{workflow}/runs?event=workflow_dispatch&per_page=100')
              return [r for r in data.get('workflow_runs',[])
                      if r.get('head_sha')==auth['implementation_sha']
                      and r.get('head_branch')==auth['frozen_ref']
                      and r.get('event')=='workflow_dispatch']
          runs=matches(); dispatched=False
          if len(runs)>1:
              raise SystemExit(f'multiple exact recovery runs exist: {len(runs)}')
          if not runs:
              request(f'{api}/actions/workflows/{workflow}/dispatches',method='POST',payload={'ref':auth['frozen_ref']})
              dispatched=True
              for _ in range(24):
                  time.sleep(5); runs=matches()
                  if runs: break
          if len(runs)!=1:
              raise SystemExit(f'expected one exact recovery run, found {len(runs)}')
          run=runs[0]; event=json.load(open(os.environ['GITHUB_EVENT_PATH']))
          receipt={
              'purpose':'product_a_v2_7_2_postsealed_abstention_recovery_launch_receipt',
              'pull_request':int(event['pull_request']['number']),
              'implementation_sha':auth['implementation_sha'],
              'frozen_ref':auth['frozen_ref'],
              'source_run_id':int(auth['source_run_id']),
              'rerun_all_6_audits':True,
              'reuse_old_audits_for_decision':False,
              'post_outcome_retuning_allowed':False,
              'scientific_promotion_allowed':False,
              'product_b_unblocked':False,
              'dispatched_now':dispatched,
              'run_id':int(run['id']),
              'run_number':int(run['run_number']),
              'status':str(run['status']),
              'conclusion':run.get('conclusion'),
          }
          Path('launch').mkdir()
          Path('launch/receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print(json.dumps(receipt,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: product-a-v2-7-2-postsealed-recovery-launch-receipt
          path: launch/receipt.json
          retention-days: 90
