name: Product A factorial discovery diagnostics

on:
  pull_request:
    paths:
      - 'scripts/analyze_factorial_process_discovery.py'
      - '.github/workflows/product-a-factorial-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      FACTORIAL_ARTIFACT_ID: '9983694702'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Download frozen 4201-4205 factorial artifact
        run: |
          mkdir -p factorial_input factorial_discovery
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${FACTORIAL_ARTIFACT_ID}/zip" \
            > factorial.zip
          unzip -q factorial.zip -d factorial_input
      - name: Evaluate truth-free discovery rules
        run: |
          python scripts/analyze_factorial_process_discovery.py \
            --input-dir factorial_input \
            --output-dir factorial_discovery \
            | tee factorial_discovery/stdout.txt
      - uses: actions/upload-artifact@v4
        with:
          name: product-a-factorial-discovery-${{ github.sha }}
          path: factorial_discovery/
          retention-days: 90
