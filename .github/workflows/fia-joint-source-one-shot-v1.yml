name: FIA joint source-only one-shot (new cohort, no tree outcomes)

# A uniquely named lock addition is the sole trigger. Never re-run this
# against later mutable FIA DataMart content as though it were identical.
on:
  push:
    branches: [research/geographic-driver-turnover-macro-v0-20261019]
    paths:
      - 'configs/fia_joint_source_acquire_once_v1.lock'

permissions:
  contents: read

jobs:
  frozen-source-only-collection:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit exactly the one-shot source acquisition contract
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('configs/fia_joint_source_acquire_once_v1.lock').read_text()
          required=['programme=fia_joint_source_only_v1',
                    'cohort=new_not_original_v4',
                    'declared_species=13',
                    'states=RI_VA_WI',
                    'NOAA_snapshot=20261006',
                    'current_TREE_species_selection=forbidden',
                    'DIA_STATUSCD_outcome_read=forbidden',
                    'biological_promotion=forbidden']
          assert all(x in text for x in required)
          PY
      - name: Run offline source-only and joint-support regression tests
        run: |
          python -m pip install 'pytest>=8,<10'
          python -m pytest -q tests/test_fia_joint_source_only_v1.py tests/test_fia_joint_support_gate_v1.py
      - name: Read source identity and paired county climate only from fresh public snapshots
        run: |
          python experiments/fia_joint_source_only_v1.py \
            --noaa-csv results/fia_noaa_county_climate_v1/noaa_county_growing_months_1991_2025.csv \
            --noaa-receipt results/fia_noaa_county_climate_v1/source_receipt.json \
            --output artifacts/fia_joint_source_only_v1
      - name: Evaluate only source-support, never growth or survival
        run: |
          python experiments/fia_joint_support_gate_v1.py \
            --config configs/fia_joint_climate_support_gate_v1.json \
            --samples artifacts/fia_joint_source_only_v1/fia_new_cohort_joint_source_only.csv \
            --source-receipt artifacts/fia_joint_source_only_v1/source_receipt.json \
            --output artifacts/fia_joint_source_only_v1/source_support_gate_v1_1.json
      - name: Archive complete source-only outcomes or failure receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fia-joint-source-only-new-cohort-v1
          path: artifacts/fia_joint_source_only_v1/
          if-no-files-found: error
          retention-days: 90
