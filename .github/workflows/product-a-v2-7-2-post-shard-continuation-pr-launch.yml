name: product-a-v2-7-2-post-shard-continuation-pr-launch

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'configs/product_a_v2_7_2_post_shard_continuation_pr_trigger.txt'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Dispatch at most one exact deterministic continuation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.request
          from pathlib import Path
          c=json.load(open('configs/product_a_v2_7_2_post_shard_continuation_execution.json'))
          if c.get('execution_allowed') is not True:
              raise SystemExit('deterministic continuation gate is closed')
          if not c.get('implementation_sha') or not c.get('frozen_ref'):
              raise SystemExit('deterministic continuation identity is not pinned')
          if c.get('random_state')!=271 or c.get('required_M_shard_artifact_count')!=216:
              raise SystemExit('deterministic continuation denominator changed')
          if int(c.get('shard_build_run_id') or 0)<=0 or int(c.get('shard_build_receipt_artifact_id') or 0)<=0 or not str(c.get('shard_build_receipt_artifact_digest') or '').startswith('sha256:'):
              raise SystemExit('successful deterministic shard build is not pinned')
          if c.get('promotion_source_fields_pinned_before_dispatch') is not True:
              raise SystemExit('promotion source identity was not frozen before dispatch')
          if c.get('one_shot_required') is not True or c.get('selective_worker_repair_allowed') is not False:
              raise SystemExit('deterministic continuation execution boundary changed')
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']; api=f'https://api.github.com/repos/{repo}'
          h={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'sdmr-v272-continuation-launcher'}
          def request(url,*,method='GET',payload=None):
              data=None if payload is None else json.dumps(payload).encode(); req=urllib.request.Request(url,data=data,headers=h,method=method)
              with urllib.request.urlopen(req,timeout=60) as r:
                  raw=r.read(); return json.loads(raw) if raw else None
          def matches():
              data=request(f"{api}/actions/workflows/{c['workflow_file']}/runs?event=workflow_dispatch&per_page=100")
              return [r for r in data.get('workflow_runs',[]) if r.get('head_sha')==c['implementation_sha'] and r.get('head_branch')==c['frozen_ref'] and r.get('event')=='workflow_dispatch']
          runs=matches(); dispatched=False
          if len(runs)>1:
              raise SystemExit(f'multiple exact deterministic continuation runs exist: {len(runs)}')
          if not runs:
              payload={'ref':c['frozen_ref'],'inputs':{
                  'expected_sha':c['implementation_sha'],'expected_ref':c['frozen_ref'],
                  'shard_build_run_id':str(c['shard_build_run_id']),
                  'shard_build_receipt_artifact_id':str(c['shard_build_receipt_artifact_id']),
                  'shard_build_receipt_artifact_digest':c['shard_build_receipt_artifact_digest']}}
              request(f"{api}/actions/workflows/{c['workflow_file']}/dispatches",method='POST',payload=payload); dispatched=True
              for _ in range(24):
                  time.sleep(5); runs=matches()
                  if runs: break
          if len(runs)!=1:
              raise SystemExit(f'expected one exact deterministic continuation run, found {len(runs)}')
          run=runs[0]; event=json.load(open(os.environ['GITHUB_EVENT_PATH']))
          receipt={
              'purpose':'product_a_v2_7_2_post_shard_continuation_launch_receipt',
              'pull_request':int(event['pull_request']['number']),
              'implementation_sha':c['implementation_sha'],'frozen_ref':c['frozen_ref'],'random_state':271,
              'shard_build_run_id':int(c['shard_build_run_id']),
              'shard_build_receipt_artifact_id':int(c['shard_build_receipt_artifact_id']),
              'shard_build_receipt_artifact_digest':c['shard_build_receipt_artifact_digest'],
              'dispatched_now':dispatched,'run_id':int(run['id']),'run_number':int(run['run_number']),'status':str(run['status']),'conclusion':run.get('conclusion'),
              'scientific_promotion_allowed':False,'product_b_unblocked':False,
          }
          Path('launch').mkdir(); Path('launch/receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n'); print(json.dumps(receipt,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: product-a-v2-7-2-post-shard-continuation-launch-receipt
          path: launch/receipt.json
          retention-days: 90
