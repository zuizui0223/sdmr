name: sdmr-v3-hgb-regularization-screen

on:
  push:
    branches:
      - 'design/sdmr-v3-process-identification'
    paths:
      - 'configs/sdmr_v3_hgb_regularization_screen_v1_execute.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdmr-v3-hgb-regularization-screen-v1
  cancel-in-progress: false

jobs:
  screen:
    if: github.ref == 'refs/heads/design/sdmr-v3-process-identification'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Validate HGB screen machinery
        run: |
          pytest -q             tests/test_process_id_hgb_regularization_screen.py             tests/test_process_id_hgb_regularization_screen_contract.py             tests/test_process_id_probability_audit.py             tests/test_process_id_evidence.py
      - name: Verify explicit activation marker
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          marker = json.loads(
              Path("configs/sdmr_v3_hgb_regularization_screen_v1_execute.json").read_text()
          )
          assert marker["purpose"] == "execute_sdmr_v3_hgb_regularization_screen_v1"
          assert marker["branch"] == "design/sdmr-v3-process-identification"
          assert marker["single_activation"] is True
          assert marker["config_path"] == "configs/sdmr_v3_hgb_regularization_screen_v1.json"
          PY
      - name: Run HGB regularization screen
        run: |
          python scripts/run_sdmr_v3_hgb_regularization_screen.py             --config configs/sdmr_v3_hgb_regularization_screen_v1.json             --outdir hgb-screen-output
      - name: Upload HGB screen evidence
        uses: actions/upload-artifact@v4
        with:
          name: sdmr-v3-hgb-regularization-screen-v1
          path: hgb-screen-output/
          if-no-files-found: error
