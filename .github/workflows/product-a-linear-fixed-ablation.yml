name: product-a-linear-fixed-ablation

on:
  push:
    branches:
      - agent/nested-spatial-raster-benchmark
    paths:
      - '.github/workflows/product-a-linear-fixed-ablation.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: product-a-linear-fixed-ablation
  cancel-in-progress: true

jobs:
  ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      SDMR_BENCHMARK_JOBS: '4'
      SDMR_MODEL_SPEC_JOBS: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install development engine
        run: python -m pip install -e '.[geo,parquet]'
      - name: Download already-verified frozen source bundle
        uses: actions/download-artifact@v4
        with:
          run-id: 31869318368
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: citable-product-a-v1-accelerated-2026-08-01
          path: frozen_source
      - name: Run fixed linear-L2-C1 ablation under the same information barrier
        run: |
          mkdir -p linear_ablation
          python - <<'PY'
          import hashlib
          from pathlib import Path
          import pandas as pd
          from sdmr.model import ModelSpec
          import sdmr.method as method
          from sdmr.pilot_grid_cli import main as pilot_main
          from sdmr.evaluation_contrast_cli import main as contrast_main

          # Development ablation only: remove model-complexity search while
          # keeping the exact same source evidence, outer split semantics, M
          # sensitivity set, environmental universes, and variable strategies.
          method._default_model_specs = lambda: [ModelSpec(C=1.0, degree=1, penalty='l2')]

          focal = Path('frozen_source/citable_input/focal.parquet')
          target = Path('frozen_source/citable_input/target_group.parquet')
          if not focal.exists() or not target.exists():
              raise SystemExit('frozen source bundle is incomplete')
          print('focal_sha256', hashlib.sha256(focal.read_bytes()).hexdigest())
          print('target_sha256', hashlib.sha256(target.read_bytes()).hexdigest())

          rc = pilot_main([
              '--gbif-download', str(focal),
              '--gbif-download-key', 'linear-ablation-fixed-source-2026-08-01',
              '--target-group-download', str(target),
              '--target-group-download-key', 'linear-ablation-fixed-source-2026-08-01',
              '--checklist-key', 'snapshot-interpreted:2026-08-01',
              '--taxa', 'configs/product_a_pilot_taxa_v1.csv',
              '--grid', 'configs/product_a_buffer_specs_v1.csv',
              '--manifest', 'configs/chelsa_v2_1_plant_candidates.csv',
              '--output-dir', 'linear_ablation',
              '--m-grid-as-sensitivity',
              '--min-occurrences', '80',
              '--min-unique-cells', '50',
              '--gate-cell-size-degrees', '0.05',
              '--spatial-test-fraction', '0.20',
              '--taxon-validation-fraction', '0.25',
              '--vif-threshold', '5',
              '--max-predictors', '8',
              '--random-baseline-repeats', '0',
              '--seed', '20260814',
          ])
          if rc not in (0, None):
              raise SystemExit(rc)
          rc = contrast_main([
              '--product-a-dir', 'linear_ablation',
              '--manifest', 'configs/chelsa_v2_1_plant_candidates.csv',
              '--canonical-specification', 'buffer_300km',
          ])
          if rc not in (0, None):
              raise SystemExit(rc)
          PY
      - name: Freeze development-only boundary
        if: always()
        run: |
          cat > linear_ablation/DEVELOPMENT_ABLATION_BOUNDARY.txt <<'EOF'
          DEVELOPMENT ONLY. Fixed ModelSpec = logistic L2, C=1, degree=1. This run asks whether the environmental-
          universe/variable-selection pattern persists when model-complexity search is removed. It does not replace
          the frozen full Product-A confirmatory protocol and cannot trigger promotion.
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-a-linear-fixed-ablation
          path: linear_ablation/
          if-no-files-found: error
          retention-days: 30
