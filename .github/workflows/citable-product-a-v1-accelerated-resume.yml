name: citable-product-a-v1-accelerated-resume

on:
  push:
    branches:
      - agent/nested-spatial-raster-benchmark
    paths:
      - '.github/workflows/citable-product-a-v1-accelerated-resume.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: citable-product-a-v1-accelerated-resume
  cancel-in-progress: true

jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SCIENTIFIC_SOURCE_SHA: bdabeff06c1be26006837d978e8beffc0584faac
      EXECUTION_ENGINE_SHA: 9d3c9411a717a3b352b86b6cc6f3298f75ac1d17
      PERFORMANCE_EQUIVALENCE_RUN_ID: '31869105326'
      RESUME_SOURCE_RUN_ID: '31869318368'
      RESUME_SOURCE_ARTIFACT: citable-product-a-v1-accelerated-2026-08-01
      SDMR_BENCHMARK_JOBS: '4'
      SDMR_MODEL_SPEC_JOBS: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      SEED: '20260814'
      SPATIAL_TEST_FRACTION: '0.20'
      TAXON_VALIDATION_FRACTION: '0.25'
    steps:
      - name: Checkout exact-semantics execution engine
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXECUTION_ENGINE_SHA }}
          path: engine
      - name: Checkout frozen scientific governance
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SCIENTIFIC_SOURCE_SHA }}
          path: governance
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install exact-semantics execution engine
        working-directory: engine
        run: python -m pip install -e '.[geo,parquet]'

      - name: Verify exact-semantics engine proof
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json, os
          from urllib.request import Request, urlopen
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['PERFORMANCE_EQUIVALENCE_RUN_ID']}"
          req = Request(url, headers={'Authorization': f"Bearer {os.environ['GH_TOKEN']}", 'Accept':'application/vnd.github+json'})
          with urlopen(req, timeout=60) as response:
              run = json.load(response)
          if run.get('status') != 'completed' or run.get('conclusion') != 'success':
              raise SystemExit('performance equivalence run is not successful')
          if str(run.get('head_sha')) != os.environ['EXECUTION_ENGINE_SHA']:
              raise SystemExit('performance equivalence run tested another engine SHA')
          print('exact_semantics_engine_verified', os.environ['EXECUTION_ENGINE_SHA'])
          PY

      - name: Download already-preflighted frozen source bundle
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.RESUME_SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ env.RESUME_SOURCE_ARTIFACT }}
          path: resumed_source

      - name: Verify versioned source contract and artifact evidence
        run: |
          mkdir -p citable_input citable_result citable_preflight
          cp resumed_source/citable_input/focal.parquet citable_input/focal.parquet
          cp resumed_source/citable_input/focal.provenance.csv citable_input/focal.provenance.csv
          cp resumed_source/citable_input/focal.parquet.citation.txt citable_input/focal.parquet.citation.txt
          cp resumed_source/citable_input/target_group.parquet citable_input/target_group.parquet
          cp resumed_source/citable_input/target_group.provenance.csv citable_input/target_group.provenance.csv
          cp resumed_source/citable_input/target_group.parquet.citation.txt citable_input/target_group.parquet.citation.txt
          cp resumed_source/citable_preflight/chelsa_raster_probe.csv citable_preflight/chelsa_raster_probe.csv
          python - <<'PY'
          import csv, hashlib, os
          from pathlib import Path
          import pandas as pd

          def one(path):
              rows = list(csv.DictReader(Path(path).open(encoding='utf-8')))
              if len(rows) != 1:
                  raise SystemExit(f'{path} must contain exactly one row')
              return rows[0]
          def sha(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          focal_cfg = one('governance/configs/product_a_v1_focal_cache.csv')
          target_cfg = one('governance/configs/product_a_v1_target_cache.csv')
          snapshot_cfg = one('governance/configs/gbif_snapshot_v1.csv')
          taxa_sha = sha('governance/configs/product_a_pilot_taxa_v1.csv')

          if target_cfg.get('sampling_mode','').strip() != 'global_nonfocal_one_per_grid_cell_sampling_footprint':
              raise SystemExit('target config is not global non-focal footprint')
          if target_cfg.get('source_independent_of_focal_occurrence_geography','').strip().lower() != 'true':
              raise SystemExit('target config depends on focal occurrence geography')
          if target_cfg.get('focal_taxa_excluded_pre_split','').strip().lower() != 'true':
              raise SystemExit('target config does not guarantee pre-split focal-taxon exclusion')
          if int(target_cfg.get('excluded_taxa_count','0')) != 12:
              raise SystemExit('target config excluded-taxon count != 12')
          if target_cfg.get('excluded_taxa_sha256','').strip().lower() != taxa_sha:
              raise SystemExit('target config focal-taxon exclusion fingerprint mismatch')

          expected_citation = snapshot_cfg['citation_sha256'].strip().lower()
          expected_date = snapshot_cfg['snapshot_date'].strip()
          expected_doi = snapshot_cfg['snapshot_doi'].strip().lower()
          for label, cfg, filename in [
              ('focal', focal_cfg, 'focal'),
              ('target_group', target_cfg, 'target_group'),
          ]:
              path = Path(f'citable_input/{filename}.parquet')
              prov = pd.read_csv(f'citable_input/{filename}.provenance.csv').iloc[0]
              citation = Path(f'citable_input/{filename}.parquet.citation.txt')
              file_key = 'focal_sha256' if label == 'focal' else 'target_sha256'
              query_key = 'focal_query_sha256' if label == 'focal' else 'target_query_sha256'
              actual = sha(path)
              if actual != cfg[file_key].strip().lower() or str(prov.get('sha256','')).lower() != actual:
                  raise SystemExit(f'{label} file/provenance SHA mismatch')
              if str(prov.get('query_sha256','')).lower() != cfg[query_key].strip().lower():
                  raise SystemExit(f'{label} query SHA mismatch')
              citation_sha = sha(citation)
              if citation_sha != expected_citation or str(prov.get('snapshot_citation_sha256','')).lower() != expected_citation:
                  raise SystemExit(f'{label} citation SHA mismatch')
              if str(prov.get('snapshot_date','')) != expected_date or str(prov.get('snapshot_doi','')).lower() != expected_doi:
                  raise SystemExit(f'{label} snapshot date/DOI mismatch')

          target_prov = pd.read_csv('citable_input/target_group.provenance.csv').iloc[0]
          if str(target_prov.get('sampling_mode','')) != 'global_nonfocal_one_per_grid_cell_sampling_footprint':
              raise SystemExit('target artifact is not global non-focal footprint')
          if abs(float(target_prov.get('one_per_grid_cell_degrees',0)) - 0.05) > 1e-12:
              raise SystemExit('target artifact grid != 0.05 degrees')
          if int(target_prov.get('excluded_taxa_count',0)) != 12:
              raise SystemExit('target artifact excluded-taxon count != 12')
          if str(target_prov.get('excluded_taxa_sha256','')).lower() != taxa_sha:
              raise SystemExit('target artifact focal-taxon exclusion fingerprint mismatch')

          probe = pd.read_csv('citable_preflight/chelsa_raster_probe.csv')
          if len(probe) != 43 or 'status' not in probe or probe['status'].ne('ok').any():
              raise SystemExit('resumed source does not contain successful 43/43 CHELSA preflight')
          print('resumed_frozen_source_verified', 'focal_rows', len(pd.read_parquet('citable_input/focal.parquet')), 'target_rows', len(pd.read_parquet('citable_input/target_group.parquet')))
          PY

      - name: Run accelerated strict M-robust Product-A benchmark
        run: |
          sdmr-pilot-grid \
            --gbif-download citable_input/focal.parquet \
            --gbif-download-key 'accelerated-resume-fixed-source-2026-08-01' \
            --target-group-download citable_input/target_group.parquet \
            --target-group-download-key 'accelerated-resume-fixed-source-2026-08-01' \
            --checklist-key 'snapshot-interpreted:2026-08-01' \
            --taxa governance/configs/product_a_pilot_taxa_v1.csv \
            --grid governance/configs/product_a_buffer_specs_v1.csv \
            --manifest governance/configs/chelsa_v2_1_plant_candidates.csv \
            --output-dir citable_result \
            --m-grid-as-sensitivity \
            --min-occurrences 80 \
            --min-unique-cells 50 \
            --gate-cell-size-degrees 0.05 \
            --spatial-test-fraction "$SPATIAL_TEST_FRACTION" \
            --taxon-validation-fraction "$TAXON_VALIDATION_FRACTION" \
            --vif-threshold 5 \
            --max-predictors 8 \
            --random-baseline-repeats 0 \
            --seed "$SEED"

      - name: Compare SDMR with frozen conventional selectors
        run: |
          sdmr-compare-evaluation \
            --product-a-dir citable_result \
            --manifest governance/configs/chelsa_v2_1_plant_candidates.csv \
            --canonical-specification buffer_300km

      - name: Enforce final frozen information barrier
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          expected = set(pd.read_csv('governance/configs/product_a_pilot_taxa_v1.csv')['scientific_name'].astype(str))
          gate = pd.read_csv('citable_result/species_gate.csv')
          eligible = set(gate.loc[gate['eligible'].astype(bool), 'species'].astype(str))
          if eligible != expected:
              raise SystemExit(f'full panel failed: missing={sorted(expected-eligible)}, extra={sorted(eligible-expected)}')
          spec = json.loads(Path('citable_result/pilot_grid_specification.json').read_text(encoding='utf-8'))
          contrast = json.loads(Path('citable_result/selector_contrast_contract.json').read_text(encoding='utf-8'))
          if spec.get('outer_sealed_before_M') is not True or spec.get('m_grid_as_sensitivity') is not True:
              raise SystemExit('strict M semantics failed')
          if contrast.get('cross_taxon_selection_data') != 'discovery_taxa_only':
              raise SystemExit('cross-taxon selection leak')
          if contrast.get('local_nested_auc_selection_data') != 'validation_species_model_pool_only':
              raise SystemExit('local nested AUC leak')
          if contrast.get('outer_sealed_used_for_selection') is not False:
              raise SystemExit('outer sealed selection leak')
          print('accelerated_resume_barrier_passed', len(eligible), 'taxa')
          PY

      - name: Freeze resumed citable contract
        if: always()
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          import pandas as pd
          def sha(path):
              p=Path(path); return hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else ''
          spec_path=Path('citable_result/pilot_grid_specification.json')
          spec=json.loads(spec_path.read_text()) if spec_path.exists() else {}
          contrast_path=Path('citable_result/selector_contrast_contract.json')
          contrast=json.loads(contrast_path.read_text()) if contrast_path.exists() else {}
          probe=pd.read_csv('citable_preflight/chelsa_raster_probe.csv') if Path('citable_preflight/chelsa_raster_probe.csv').exists() else pd.DataFrame()
          contract={
              'protocol_version':'product_a_v1_leakage_safe_M_sensitivity_fixed_sources_accelerated_exact_semantics',
              'scientific_source_sha':os.environ['SCIENTIFIC_SOURCE_SHA'],
              'execution_engine_sha':os.environ['EXECUTION_ENGINE_SHA'],
              'performance_equivalence_run_id':os.environ['PERFORMANCE_EQUIVALENCE_RUN_ID'],
              'resume_source_run_id':os.environ['RESUME_SOURCE_RUN_ID'],
              'exact_semantics_equivalence':True,
              'outer_sealed_before_M':bool(spec.get('outer_sealed_before_M',False)),
              'm_grid_as_sensitivity':bool(spec.get('m_grid_as_sensitivity',False)),
              'chelsa_probe_rows':int(len(probe)),
              'chelsa_probe_failures':int(probe['status'].ne('ok').sum()) if 'status' in probe else None,
              'promotion_criteria_sha256':sha('governance/configs/product_a_promotion_criteria_v1.csv'),
              'differentiation_criteria_sha256':sha('governance/configs/product_a_differentiation_criteria_v1.csv'),
              'selector_contrast_outer_sealed_used_for_selection':contrast.get('outer_sealed_used_for_selection'),
              'performance_only_changes':['SDMR_BENCHMARK_JOBS=4','random_baseline_repeats=0'],
          }
          Path('citable_result/citable_snapshot_contract.json').write_text(json.dumps(contract,indent=2,sort_keys=True),encoding='utf-8')
          PY
          cp governance/configs/product_a_promotion_criteria_v1.csv citable_result/
          cp governance/configs/product_a_differentiation_criteria_v1.csv citable_result/
          cat > citable_result/ACCELERATED_RESUME_BOUNDARY.txt <<'EOF'
          Exact-semantics accelerated continuation of the frozen Product-A v1 protocol after correcting a verifier-only
          provenance-key mismatch. Source evidence, scientific configuration, sealed rows, M sensitivity set, candidate
          universes/strategies, seed, and frozen governance are unchanged. The resumed source artifact had already passed
          43/43 CHELSA preflight before the verifier-only failure.
          EOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: citable-product-a-v1-accelerated-resume-2026-08-01
          path: |
            citable_preflight/
            citable_input/
            citable_result/
          if-no-files-found: error
          retention-days: 90
