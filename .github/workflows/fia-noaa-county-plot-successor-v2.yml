name: fia-noaa-county-plot-successor-v2

on:
  pull_request:
    paths:
      - 'results/fia_noaa_county_climate_v1/**'
      - 'experiments/fia_noaa_county_plot_successor_v2.py'
      - 'tests/test_fia_noaa_county_plot_successor_v2.py'
      - 'docs/FIA_NOAA_COUNTY_PLOT_SUCCESSOR_V2.md'
      - '.github/workflows/fia-noaa-county-plot-successor-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  new-plot-version-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source test requirements
        run: python -m pip install -e '.[test]'
      - name: Test source identity and no-outcome boundary
        run: python -m pytest -q tests/test_fia_noaa_county_plot_successor_v2.py
      - name: One-shot new-PLOT-source eligibility check (never open tree outcomes)
        run: |
          python experiments/fia_noaa_county_plot_successor_v2.py \
            --original-stop results/fia_noaa_county_climate_v1/original_plot_source_stop.json \
            --climate-csv results/fia_noaa_county_climate_v1/noaa_county_growing_months_1991_2025.csv \
            --climate-receipt results/fia_noaa_county_climate_v1/source_receipt.json \
            --output artifacts/fia_noaa_county_plot_successor_v2.json
      - name: Retain complete source gate receipt, including nonavailability
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fia-noaa-county-plot-successor-v2
          path: artifacts/fia_noaa_county_plot_successor_v2.json
          if-no-files-found: warn
