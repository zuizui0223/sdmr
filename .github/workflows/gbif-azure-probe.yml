name: gbif-azure-probe

on:
  pull_request:
    paths:
      - 'src/sdmr/data/snapshot.py'
      - 'tests/test_snapshot.py'
      - '.github/workflows/gbif-azure-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gbif-azure-probe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install cloud dependencies
        run: python -m pip install -e '.[cloud]'
      - name: Probe exact frozen GBIF Azure snapshot schema
        run: |
          python - <<'PY'
          import duckdb
          from sdmr.data.snapshot import _configure_duckdb_cloud, gbif_snapshot_azure_uri

          uri = gbif_snapshot_azure_uri('2026-08-01')
          print('azure_uri', uri)
          con = duckdb.connect()
          try:
              _configure_duckdb_cloud(con, cloud_provider='azure', region='us-east-1')
              schema = con.execute(
                  f"DESCRIBE SELECT * FROM read_parquet('{uri}', union_by_name=true)"
              ).fetchdf()
              required = {'species', 'decimallatitude', 'decimallongitude', 'kingdom'}
              names = {str(x).lower() for x in schema['column_name']}
              missing = sorted(required - names)
              if missing:
                  raise SystemExit(f'Azure snapshot schema missing required columns: {missing}')
              print('schema_columns', len(schema))
              print('required_columns_ok', sorted(required))
          finally:
              con.close()
          PY
