name: Independent NEON source-only catalog contract checks v1

on:
  pull_request:
    paths:
      - 'experiments/fia_independent_neon_catalog_v1.py'
      - 'tests/test_fia_independent_neon_catalog_v1.py'
      - 'docs/FIA_INDEPENDENT_NEON_COHORT_SOURCE_GATE_V1.md'
      - '.github/workflows/fia-independent-NEON-catalog-contract-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-metadata-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner only
        run: python -m pip install 'pytest>=8,<10'
      - name: Validate no-data, no-token NEON metadata contracts
        run: python -m pytest -q tests/test_fia_independent_neon_catalog_v1.py
      - name: Confirm code is source-only and preserves old FIA endpoints
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,"experiments")
          import fia_independent_neon_catalog_v1 as m
          assert m.URL=="https://data.neonscience.org/api/v0/products/DP1.10098.001"
          assert m.RELEASE=="RELEASE-2026"
          assert m.MIN_YEAR_SPAN==4
          assert m.DOI=="10.48443/pypa-qf12"
          PY
