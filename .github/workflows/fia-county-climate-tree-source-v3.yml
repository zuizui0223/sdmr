name: fia-county-climate-tree-source-v3

on:
  pull_request:
    paths:
      - 'experiments/fia_climate_tree_source_gate_v3.py'
      - 'tests/test_fia_climate_tree_source_gate_v3.py'
      - 'docs/FIA_CLIMATE_TREE_SOURCE_GATE_V3.md'
      - '.github/workflows/fia-county-climate-tree-source-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-identities-only:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install 'pytest>=8,<10'
      - name: Unit tests, no external source access
        run: python -m pytest -q tests/test_fia_climate_tree_source_gate_v3.py
      - name: Open ONLY source identity and opportunity, not FIA growth or death
        run: |
          python experiments/fia_climate_tree_source_gate_v3.py \
            --plot-source results/fia_noaa_county_climate_v1/plot_successor_v2_result.json \
            --noaa-csv results/fia_noaa_county_climate_v1/noaa_county_growing_months_1991_2025.csv \
            --noaa-receipt results/fia_noaa_county_climate_v1/source_receipt.json \
            --output artifacts/fia_climate_tree_source_gate_v3.json
      - name: Archive failures and source identities, without individual measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fia-climate-tree-source-gate-v3
          path: artifacts/fia_climate_tree_source_gate_v3.json
          if-no-files-found: error
