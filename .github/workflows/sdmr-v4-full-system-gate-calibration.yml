name: sdmr-v4-full-system-gate-calibration

on:
  push:
    branches:
      - 'design/sdmr-v3-process-identification'
    paths:
      - 'configs/sdmr_v4_full_system_gate_calibration_v1_execute.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdmr-v4-full-system-gate-calibration-v1
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Validate v4 calibration machinery
        run: |
          pytest -q \
            tests/test_process_id_full_system_calibration.py \
            tests/test_process_id_v4_full_system_calibration_contract.py
      - name: Verify activation marker
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("configs/sdmr_v4_full_system_gate_calibration_v1_execute.json").read_text())
          assert x["purpose"]=="execute_sdmr_v4_full_system_gate_calibration_v1"
          assert x["single_activation"] is True
          assert x["config_blob_sha"]=="7f7f37dbaffa39c12df530d687369c10e48457af"
          assert x["confirmation_opened_before_calibration"] is False
          assert x["reserved_prospective_opened"] is False
          PY

  calibrate:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        world:
          - unique_process
          - redundant_representation
          - shared_carrier
          - null_correlated
          - interaction
          - observation_confounded
          - omitted_driver
          - geographic_shift
        seed_block: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install -e '.[test]'
      - name: Run calibration shard
        run: |
          python scripts/run_sdmr_v4_full_system_gate_calibration_shard.py \
            --config configs/sdmr_v4_full_system_gate_calibration_v1.json \
            --activation configs/sdmr_v4_full_system_gate_calibration_v1_execute.json \
            --world ${{ matrix.world }} \
            --seed-block ${{ matrix.seed_block }} \
            --outdir calibration-output
      - name: Upload calibration shard
        uses: actions/upload-artifact@v4
        with:
          name: v4-gate-cal-${{ matrix.world }}-block${{ matrix.seed_block }}
          path: calibration-output/
          if-no-files-found: error

  aggregate:
    needs: calibrate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install -e '.[test]'
      - name: Download calibration shards
        uses: actions/download-artifact@v4
        with:
          pattern: 'v4-gate-cal-*'
          path: calibration-shards
      - name: Aggregate and select candidate
        run: |
          python scripts/aggregate_sdmr_v4_full_system_gate_calibration.py \
            --input-root calibration-shards \
            --config configs/sdmr_v4_full_system_gate_calibration_v1.json \
            --activation configs/sdmr_v4_full_system_gate_calibration_v1_execute.json \
            --outdir calibration-aggregate \
            --expected-shards 40
      - name: Upload calibration terminal evidence
        uses: actions/upload-artifact@v4
        with:
          name: sdmr-v4-full-system-gate-calibration-v1
          path: calibration-aggregate/
          if-no-files-found: error
