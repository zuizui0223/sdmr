name: Product A counterfactual process replication

on:
  pull_request:
    paths:
      - 'configs/product_a_counterfactual_process_replication_contract.json'
      - 'src/sdmr/counterfactual_process_replication.py'
      - '.github/workflows/product-a-counterfactual-process-replication.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replicate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Run unchanged rule on fresh 4401-4410 seeds
        run: |
          mkdir -p counterfactual_process_replication
          python -m sdmr.counterfactual_process_replication \
            --output-dir counterfactual_process_replication \
            | tee counterfactual_process_replication/stdout.txt
      - name: Print replication result
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path
          root = Path('counterfactual_process_replication')
          d = json.loads((root / 'counterfactual_replication_decision.json').read_text())
          p = pd.read_csv(root / 'counterfactual_replication_process_summary.csv')
          c = pd.read_csv(root / 'counterfactual_replication_cases.csv')
          print(json.dumps(d, indent=2, sort_keys=True))
          print('\nPROCESS SUMMARY')
          print(p.to_string(index=False))
          print('\nCOUNTERFACTUAL ERRORS')
          print(c.loc[~c['counterfactual_exact'].astype(bool)].to_string(index=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: product-a-counterfactual-process-replication-${{ github.sha }}
          path: counterfactual_process_replication/
          retention-days: 90
